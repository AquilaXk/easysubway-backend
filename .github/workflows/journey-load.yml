name: Journey Load Scenarios

on:
  schedule:
    # 매일 04:07 KST. 엔진 벤치마크 추세(03:23 KST)와 러너를 겹쳐 쓰지 않도록 시간을 벌린다.
    - cron: "7 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 같은 시나리오가 겹쳐 돌면 서로의 부하가 측정에 섞인다. 진행 중인 실행은 취소하지 않는다.
concurrency:
  group: journey-load-scenarios
  cancel-in-progress: false

jobs:
  load:
    name: Journey load scenarios
    # 대상은 러너가 직접 띄우는 로컬 서버뿐이다(운영 서버·운영 비밀 없음). 운영 부하와 겹치는 self-hosted 운영 러너는 쓰지 않는다.
    # 정확성 계약(팩 교체 중 응답 일관성, 시설 상태 장애의 명시적 응답) 위반은 job을 실패시키고, 지연 한도 초과는 ::warning으로만 드러낸다.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21.0.11"
          cache: gradle

      # v1 datapack은 Journey OCI artifact의 fallback이 아니라 별도 backend resource다.
      - name: Stage pinned contracts
        shell: bash
        run: |
          artifact_url="$(jq -er '.artifactUrl | select(. == "https://raw.githubusercontent.com/AquilaXk/easysubway/6c29b55e6cbdb1713522cb4f766d9754728d5fc8/contracts/bundles/backend-contracts-v1.0.0.json")' backend/contracts.lock.json)"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --output "${RUNNER_TEMP}/backend-contracts.json" \
            "${artifact_url}"
          node backend/tools/stage-contracts.mjs \
            --lock backend/contracts.lock.json \
            --input "${RUNNER_TEMP}/backend-contracts.json" \
            --output backend/build/contracts-staging

      - name: Stage pinned Journey contracts
        shell: bash
        run: |
          set -euo pipefail
          journey_contract_subject="$(jq -er '.artifact | if type == "object" and (.repository | type == "string") and (.manifestDigest | type == "string" and test("^sha256:[a-f0-9]{64}$")) then "\(.repository)@\(.manifestDigest)" else error("invalid Journey contract OCI subject") end' backend/journey-contracts.lock.json)"
          [[ "${journey_contract_subject}" =~ ^ghcr\.io/aquilaxk/easysubway-backend-contracts@sha256:[a-f0-9]{64}$ ]]
          oras pull "${journey_contract_subject}" --output "${RUNNER_TEMP}/journey-contract-pull"
          node backend/tools/stage-journey-contracts.mjs \
            --lock backend/journey-contracts.lock.json \
            --input "${RUNNER_TEMP}/journey-contract-pull/journey-v3-contract-bundle-v2.json" \
            --output backend/build/journey-contracts-staging

      - name: Set up k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: "2.1.0"

      # 서버 기동·k6 실행·판정은 실행기 하나가 맡는다. 판정 요약은 job summary에 남고, 서버 로그와 k6 결과는 artifact로 남는다.
      - name: Run the load scenarios
        env:
          EASYSUBWAY_CONTRACTS_BUNDLE: ${{ runner.temp }}/backend-contracts.json
        run: node tools/ci/journey-load-run.mjs --output-dir "${RUNNER_TEMP}/journey-load"

      - name: Upload the load result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: journey-load-${{ github.sha }}
          path: ${{ runner.temp }}/journey-load/
          retention-days: 30
          if-no-files-found: error
