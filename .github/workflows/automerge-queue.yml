name: Automerge Queue

# 다중 세션 병합 경합 해소용 FIFO 코디네이터.
# automerge 라벨이 붙은 PR 중 가장 오래된 하나만 처리한다. 라벨은 merge-workflow 규약
# 4단계(코드리뷰 게이트) 완료 후에만 붙인다.
#
# 인증은 github.token 하나뿐이다. GITHUB_TOKEN이 만든 이벤트는 새 workflow run을
# 만들지 않고 예외는 workflow_dispatch와 repository_dispatch뿐이므로, 이 코디네이터가
# 끊게 되는 두 체인을 명시 dispatch로 잇는다.
#   - main 병합 후 immutable image producer: head_sha 기준으로 실행 유무를 판정해 dispatch
#   - update-branch 후 PR CI: head_ref로 ci.yml dispatch
# 그 사이 트리거 공백은 schedule cron이 메운다.

on:
  pull_request_target:
    types: [labeled]
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: automerge-queue
  cancel-in-progress: false

jobs:
  coordinate:
    name: Automerge Queue
    if: github.event_name != 'pull_request_target' || github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # 큐가 계약 위반으로 멈춰 있는 동안에도 배포 체인은 끊기면 안 되므로 producer
      # dispatch를 큐보다 먼저 둔다.
      - name: Dispatch immutable image producer for the current main
        shell: bash
        run: |
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          producer="release-artifacts.yml"
          # producer-dispatch-begin
          main_sha="$(gh api "repos/${repo}/commits/main" --jq '.sha')"
          if [[ ! "${main_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "main head revision 조회 결과가 40자리 SHA가 아니다: ${main_sha}" >&2
            exit 1
          fi
          # 중복과 누락을 같은 키 하나로 막는다. head_sha로 producer 실행 유무를 보면
          # 사람이 UI에서 병합해 push가 뜬 경우, 수동 dispatch한 경우, 직전 실행이 이미
          # dispatch한 경우가 모두 같은 판정에 들어온다. pull_request 실행은 이미지를
          # 발행하지 않는 preflight이므로 제외한다.
          producer_runs() {
            gh api \
              "repos/${repo}/actions/workflows/${producer}/runs?head_sha=${main_sha}&per_page=100" \
              --jq '[.workflow_runs[] | select(.event != "pull_request")] | length'
          }
          if [[ "$(producer_runs)" != "0" ]]; then
            echo "main ${main_sha}의 image producer 실행이 이미 있다; dispatch하지 않는다."
            exit 0
          fi
          gh workflow run "${producer}" --repo "${repo}" --ref main
          # ponytail: bounded wait only; the run record appears asynchronously.
          for _ in {1..12}; do
            if [[ "$(producer_runs)" != "0" ]]; then
              echo "image producer dispatch 확인: main ${main_sha}"
              exit 0
            fi
            sleep 5
          done
          # dispatch는 수락됐는데 run 목록에 아직 안 보이는 상태다. 여기서 실패시키면
          # 큐까지 멈추고, 조용히 넘기면 누락이 남는다. 경고만 남기고 다음 트리거가
          # 같은 head_sha 키로 다시 판정한다. 재빌드는 push-by-digest라 무해하다.
          echo "::warning::main ${main_sha}의 image producer run을 확인하지 못했다; 다음 트리거에서 재확인한다."
          # producer-dispatch-end

      - name: Coordinate oldest eligible pull request
        shell: bash
        run: |
          # shellcheck disable=SC2016
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          # draft는 선택 단계에서 걸러낸다. `gh pr list`는 draft를 필터하지 않으므로
          # 큐 맨 앞이 draft면 아래 jq -e가 매 실행마다 실패해 큐 전체가 멈춘다.
          pr="$(gh pr list --repo "${repo}" --base main --state open --label automerge \
            --limit 1000 --json number,createdAt,isDraft \
            --jq '[.[] | select(.isDraft == false)] | sort_by(.createdAt)[0].number // empty')"
          [[ -n "${pr}" ]] || exit 0

          info="$(gh pr view "${pr}" --repo "${repo}" \
            --json baseRefName,headRefName,headRefOid,headRepository,isDraft,labels,mergeStateStatus,state)"
          jq -e '
            .state == "OPEN" and
            .isDraft == false and
            .baseRefName == "main" and
            any(.labels[]; .name == "automerge")
          ' <<<"${info}" >/dev/null

          head="$(jq -r '.headRefOid' <<<"${info}")"
          head_ref="$(jq -r '.headRefName' <<<"${info}")"
          head_repo="$(jq -r '.headRepository.nameWithOwner // ""' <<<"${info}")"
          merge_state="$(jq -r '.mergeStateStatus' <<<"${info}")"

          # required context는 main ruleset이 정본이다. 하드코딩 폴백을 두면 ruleset
          # 변경이나 조회 실패가 그대로 게이트 완화가 되므로 조회 실패는 fail closed다.
          rules="$(gh api "repos/${repo}/rules/branches/main")"
          required="$(jq -c '
            [.[] |
              select(.type == "required_status_checks") |
              .parameters.required_status_checks[] |
              {context, integration_id: (.integration_id // null)}] |
            unique_by(.context, .integration_id)
          ' <<<"${rules}")"
          jq -e 'length > 0' <<<"${required}" >/dev/null

          reviews="$(gh api --paginate --slurp \
            "repos/${repo}/pulls/${pr}/reviews?per_page=100")"
          # review-state-filter-begin
          jq -e --arg head "${head}" '
            [flatten[] |
              select(
                .author_association == "OWNER" or
                .author_association == "MEMBER" or
                .author_association == "COLLABORATOR"
              )] as $trusted |
            ($trusted | map(select(.commit_id == $head))) as $current |
            ($trusted |
            sort_by(.submitted_at, .id) |
            reduce .[] as $review ({};
              if $review.state == "COMMENTED" then
                .[$review.user.login] //= "COMMENTED"
              elif $review.state == "DISMISSED" then
                del(.[$review.user.login])
              else
                .[$review.user.login] = $review.state
              end
            )) as $states |
            ($states | length > 0 and all(.[]; . == "APPROVED" or . == "COMMENTED")) and
            any($current[];
              .state == "APPROVED" or
              (.state == "COMMENTED" and
                (.body // "" | startswith("**Actionable comments posted: ")) and
                (.body // "" | contains("<!-- Review source: Codex CLI fallback; canonical visible structure:"))))
          ' <<<"${reviews}" >/dev/null
          # review-state-filter-end

          owner="${repo%%/*}"
          name="${repo#*/}"
          # shellcheck disable=SC2016
          threads="$(gh api graphql -f owner="${owner}" -f name="${name}" -F number="${pr}" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviewThreads(first: 100) {
                    nodes { isResolved }
                    pageInfo { hasNextPage }
                  }
                }
              }
            }
          ')"
          jq -e '
            .data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage == false and
            all(.data.repository.pullRequest.reviewThreads.nodes[]; .isResolved)
          ' <<<"${threads}" >/dev/null

          checks="$(gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/${repo}/commits/${head}/check-runs?per_page=100")"
          statuses="$(gh api --paginate --slurp \
            -H 'Accept: application/vnd.github+json' \
            "repos/${repo}/commits/${head}/statuses?per_page=100")"
          while IFS= read -r required_check; do
            # 아직 끝나지 않은 check는 계약 위반이 아니다. 진행 중(conclusion null)이나
            # 새 head에 아직 안 붙은 상태를 exit 1로 처리하면 그 실패 check가 PR을
            # UNSTABLE로 만들어 다음 실행을 같은 자리에서 죽인다. 명시적 실패만 위반이다.
            # required-context-filter-begin
            context_state="$(jq -r --argjson required_check "${required_check}" --argjson statuses "${statuses}" '
              ($statuses | flatten) as $status_records |
              ([.[].check_runs[] |
                select(.name == $required_check.context) |
                select($required_check.integration_id == null or .app.id == $required_check.integration_id)] |
                sort_by(.started_at, .id) |
                last) as $run |
              ([$status_records[] | select(.context == $required_check.context)] |
                sort_by((.updated_at // .created_at // ""), .id) |
                last) as $status |
              if $run != null then
                (if $run.conclusion == null then "pending"
                 elif $run.conclusion == "success" then "success"
                 else "failure" end)
              elif $required_check.integration_id == null and $status != null then
                (if $status.state == "success" then "success"
                 elif $status.state == "pending" then "pending"
                 else "failure" end)
              else
                "missing"
              end
            ' <<<"${checks}")"
            # required-context-filter-end
            context_name="$(jq -r '.context' <<<"${required_check}")"
            case "${context_state}" in
              success) ;;
              pending | missing)
                echo "PR #${pr} required context ${context_state}: ${context_name}; retrying on the next trigger."
                exit 0
                ;;
              *)
                echo "PR #${pr} required context failed: ${context_name}" >&2
                exit 1
                ;;
            esac
          done < <(jq -c '.[]' <<<"${required}")

          # required context 검증이 병합 가능 여부의 정본이다. mergeStateStatus는 여기서
          # 실제로 병합이 불가능한 상태(base 갱신 필요·충돌)를 가려내는 데만 쓴다.
          # 전이·대기 상태에서 exit 1을 내면 그 실패가 이 PR의 check로 붙어 PR을
          # UNSTABLE로 만들고, 다음 실행이 다시 그 UNSTABLE을 보고 죽는 자기 유발
          # 교착이 된다. 그래서 exit 1은 사람이 고쳐야 하는 계약 위반에만 남긴다.
          # merge-state-dispatch-begin
          case "${merge_state}" in
            CLEAN | HAS_HOOKS | UNSTABLE)
              # UNSTABLE은 "mergeable하지만 필수가 아닌 check가 green이 아님"이다.
              # ruleset이 필수로 두지 않은 check로 병합을 막지 않는다.
              gh pr merge --squash --auto "${pr}" --repo "${repo}" \
                --match-head-commit "${head}"
              exit 0
              ;;
            BEHIND)
              [[ "${head_repo}" == "${repo}" ]] || {
                echo "PR #${pr} uses a fork head; refusing base-repository CI dispatch." >&2
                exit 1
              }
              gh api --method PUT "repos/${repo}/pulls/${pr}/update-branch" \
                -f expected_head_sha="${head}" >/dev/null
              # ponytail: bounded wait only; the API applies the base merge asynchronously.
              for _ in {1..12}; do
                new_head="$(gh pr view "${pr}" --repo "${repo}" --json headRefOid --jq '.headRefOid')"
                [[ "${new_head}" != "${head}" ]] && break
                sleep 5
              done
              if [[ "${new_head}" == "${head}" ]]; then
                # update-branch는 비동기라 bounded wait 안에 head가 안 바뀔 수 있다.
                # 이는 계약 위반이 아니라 대기 상태다. stale ref로 CI를 쏘지 않고
                # 다음 트리거에서 재시도한다. bare `[[ ]]`로 두면 bash 5에서는
                # 아무 메시지 없이 job이 죽고 bash 3.2에서는 그냥 통과해버린다.
                echo "PR #${pr} base update has not landed yet; retrying on the next trigger."
                exit 0
              fi
              # GITHUB_TOKEN의 update-branch push는 synchronize 이벤트로 CI를 만들지
              # 못한다. 새 head에 required context를 다시 붙이려면 명시 dispatch가 필요하다.
              gh workflow run ci.yml --repo "${repo}" --ref "${head_ref}"
              exit 0
              ;;
            BLOCKED | UNKNOWN)
              # UNKNOWN은 GitHub이 mergeability를 아직 계산 중인 상태다. BLOCKED은 이
              # job의 리뷰·thread·required context 계약을 모두 통과한 뒤라면 GitHub 쪽
              # 상태 반영이 아직 따라오지 않은 것이다. 어느 쪽도 실패가 아니므로 다음
              # 트리거(schedule·workflow_run·push)에서 재시도하도록 물러난다.
              echo "PR #${pr} is not ready yet: ${merge_state}; retrying on the next trigger."
              exit 0
              ;;
            DIRTY)
              # base와 충돌. 소유 세션이 rebase 해야 풀리므로 계약 위반으로 실패시킨다.
              echo "PR #${pr} conflicts with the base branch: ${merge_state}" >&2
              exit 1
              ;;
            *)
              # DRAFT는 위 isDraft 검증에서 이미 걸러진다. 그 밖의 미지 상태에서 조용히
              # 물러나면 큐가 원인 없이 멈추므로 사람이 보도록 실패시킨다.
              echo "PR #${pr} is not mergeable: ${merge_state}" >&2
              exit 1
              ;;
          esac
          # merge-state-dispatch-end
