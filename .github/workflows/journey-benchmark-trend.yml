name: Journey Engine Benchmark Trend

on:
  push:
    branches:
      - main
  schedule:
    # 매일 03:23 KST. 정각을 피해 예약 실행 지연을 줄인다.
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 병합이 몰려도 측정은 한 번에 하나만 돌고, 대기열에는 가장 최근 push 하나만 남는다(이전 대기 run은 취소된다).
# 진행 중인 측정은 취소하지 않는다. 취소된 측정은 추세에 빈 점을 남긴다.
concurrency:
  group: journey-engine-benchmark-trend
  cancel-in-progress: false

jobs:
  benchmark:
    name: Journey engine benchmark trend
    # 운영 부하와 겹치는 self-hosted 운영 러너는 쓰지 않는다. 호스티드 러너의 편차는 새 JVM 반복 중앙값과
    # 보정 작업 시간 정규화로 줄이고, 임계를 넘어도 job은 실패시키지 않는다(관찰형, backend #516).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      BENCHMARK_REPEATS: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up backend build environment
        uses: ./.github/actions/backend-setup

      # 회귀 게이트(JourneyEnginePerformanceGateTest)와 같은 측정을 판정 없이 새 JVM에서 반복 실행한다.
      - name: Measure the engine benchmark
        working-directory: backend
        env:
          EASYSUBWAY_CONTRACTS_BUNDLE: ${{ runner.temp }}/backend-contracts.json
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/journey-benchmark"
          for repeat in $(seq 1 "${BENCHMARK_REPEATS}"); do
            ./gradlew --init-script ../tools/ci/gradle/journey-benchmark.init.gradle journeyEngineBenchmark -PjourneyBenchmarkOutput="${RUNNER_TEMP}/journey-benchmark/measured-${repeat}.json" --no-daemon
          done

      - name: Aggregate the benchmark repeats
        shell: bash
        run: |
          set -euo pipefail
          measured=()
          for repeat in $(seq 1 "${BENCHMARK_REPEATS}"); do
            measured+=(--measured "${RUNNER_TEMP}/journey-benchmark/measured-${repeat}.json")
          done
          node tools/ci/journey-benchmark-trend.mjs aggregate "${measured[@]}" --output "${RUNNER_TEMP}/journey-benchmark/result.json"

      # 결과는 저장소에 커밋하지 않는다(자동 PR 누적 방지). 보존 기간 안의 직전 성공 run들과만 비교한다.
      - name: Upload the benchmark result
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: journey-engine-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/journey-benchmark/
          retention-days: 14
          if-no-files-found: error

      # 직전 성공 run 최대 5개의 결과를 내려받는다. 보존 만료는 알림으로, 그 밖의 실패(목록·artifact·다운로드 오류, 손상된 파일)는
      # 경고로 남기고 나머지 run으로 기준을 채운다. 내려받은 목록은 manifest.json에 모인다.
      - name: Fetch previous successful runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          node tools/ci/journey-benchmark-trend.mjs fetch-previous --repo "${GITHUB_REPOSITORY}" --workflow "${WORKFLOW_NAME}" --dir "${RUNNER_TEMP}/previous-benchmark" --output "${RUNNER_TEMP}/previous-benchmark/manifest.json"

      # 회귀는 ::warning으로만 드러내고 job은 실패시키지 않는다. 기준이 없거나 손상된 이유는 summary에 그대로 남는다.
      - name: Compare with the previous successful runs
        shell: bash
        run: |
          set -euo pipefail
          node tools/ci/journey-benchmark-trend.mjs compare --current "${RUNNER_TEMP}/journey-benchmark/result.json" --previous-manifest "${RUNNER_TEMP}/previous-benchmark/manifest.json" --gate-baseline backend/src/test/resources/journey-benchmark/engine-performance-baseline.json --summary "$GITHUB_STEP_SUMMARY"
