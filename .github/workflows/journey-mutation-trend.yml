name: Journey Mutation Trend

on:
  schedule:
    # 매일 05:11 KST. 엔진 벤치마크 추세(03:23 KST)와 경로 부하(04:07 KST)가 끝난 뒤로 러너를 겹쳐 쓰지 않도록 시간을 벌린다.
    - cron: "11 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 측정은 한 번에 하나만 돌고, 진행 중인 측정은 취소하지 않는다. 취소된 측정은 추세에 빈 점을 남긴다.
concurrency:
  group: journey-mutation-trend
  cancel-in-progress: false

jobs:
  mutation:
    name: Journey mutation trend
    # 운영 부하와 겹치는 self-hosted 운영 러너는 쓰지 않는다. 점수가 내려가도 job은 실패시키지 않는다(관찰형, backend #523).
    # 테스트가 깨졌거나 PIT가 끝나지 못해 점수를 믿을 수 없을 때만 job이 실패한다.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      # Gradle 캐시를 쓰지 않는다. setup-java의 캐시 키는 저장소의 Gradle 파일에서 나오므로 main에서 도는 이 야간 job이 저장한 항목을
      # 필수 CI가 복원할 수 있다. 이 job은 lockfile 밖의 PIT 도구를 해석하므로 그 산출물이 필수 CI 캐시로 흘러가면 안 된다.
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21.0.11"

      # v1 datapack은 Journey OCI artifact의 fallback이 아니라 별도 backend resource다.
      - name: Stage pinned contracts
        shell: bash
        run: |
          artifact_url="$(jq -er '.artifactUrl | select(. == "https://raw.githubusercontent.com/AquilaXk/easysubway/6c29b55e6cbdb1713522cb4f766d9754728d5fc8/contracts/bundles/backend-contracts-v1.0.0.json")' backend/contracts.lock.json)"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --output "${RUNNER_TEMP}/backend-contracts.json" \
            "${artifact_url}"
          node backend/tools/stage-contracts.mjs \
            --lock backend/contracts.lock.json \
            --input "${RUNNER_TEMP}/backend-contracts.json" \
            --output backend/build/contracts-staging

      - name: Stage pinned Journey contracts
        shell: bash
        run: |
          set -euo pipefail
          journey_contract_subject="$(jq -er '.artifact | if type == "object" and (.repository | type == "string") and (.manifestDigest | type == "string" and test("^sha256:[a-f0-9]{64}$")) then "\(.repository)@\(.manifestDigest)" else error("invalid Journey contract OCI subject") end' backend/journey-contracts.lock.json)"
          [[ "${journey_contract_subject}" =~ ^ghcr\.io/aquilaxk/easysubway-backend-contracts@sha256:[a-f0-9]{64}$ ]]
          oras pull "${journey_contract_subject}" --output "${RUNNER_TEMP}/journey-contract-pull"
          node backend/tools/stage-journey-contracts.mjs \
            --lock backend/journey-contracts.lock.json \
            --input "${RUNNER_TEMP}/journey-contract-pull/journey-v3-contract-bundle-v2.json" \
            --output backend/build/journey-contracts-staging

      # PIT 도구(플러그인·PIT·JUnit 플러그인과 전이 의존성)는 backend/gradle.lockfile 밖에서 해석되므로 같은 좌표 목록을 따로 OSV로 검사한다.
      # 알려진 취약점이 있으면 job이 실패한다. 받은 jar가 목록과 같은지는 init script가 sha256으로 대조한다.
      - name: Scan the PIT toolchain with OSV
        uses: google/osv-scanner-action/osv-scanner-action@8ac9e5ce44cc7178e0e04229a91bdcc003166e57
        with:
          scan-args: |-
            --lockfile=tools/ci/gradle/journey-mutation/gradle.lockfile

      # PIT 플러그인은 init script에서만 적용한다. 일반 test·check 태스크 그래프와 build.gradle은 그대로다.
      - name: Run PIT on the routing classes
        working-directory: backend
        env:
          EASYSUBWAY_CONTRACTS_BUNDLE: ${{ runner.temp }}/backend-contracts.json
        run: |
          set -euo pipefail
          ./gradlew --init-script ../tools/ci/gradle/journey-mutation.init.gradle pitest --no-daemon

      - name: Summarize the PIT report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/journey-mutation"
          node tools/ci/journey-mutation-trend.mjs summarize --report-dir backend/build/reports/pitest --output "${RUNNER_TEMP}/journey-mutation/result.json"
          cp -R backend/build/reports/pitest "${RUNNER_TEMP}/journey-mutation/report"

      # 결과는 저장소에 커밋하지 않는다(자동 PR 누적 방지). 보존 기간 안의 직전 성공 run들과만 비교한다.
      - name: Upload the mutation result
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: journey-mutation-${{ github.sha }}
          path: ${{ runner.temp }}/journey-mutation/
          retention-days: 30
          if-no-files-found: error

      # 직전 성공 run 최대 5개의 결과를 내려받는다. 보존 만료는 알림으로, 그 밖의 실패(목록·artifact·다운로드 오류, 손상된 파일)는
      # 경고로 남기고 나머지 run으로 기준을 채운다. 내려받은 목록은 manifest.json에 모인다.
      - name: Fetch previous successful runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          node tools/ci/journey-mutation-trend.mjs fetch-previous --repo "${GITHUB_REPOSITORY}" --workflow "${WORKFLOW_NAME}" --dir "${RUNNER_TEMP}/previous-mutation" --output "${RUNNER_TEMP}/previous-mutation/manifest.json"

      # 점수 하락은 ::warning으로만 드러내고 job은 실패시키지 않는다. 기준이 없거나 손상된 이유는 summary에 그대로 남는다.
      - name: Compare with the previous successful runs
        shell: bash
        run: |
          set -euo pipefail
          node tools/ci/journey-mutation-trend.mjs compare --current "${RUNNER_TEMP}/journey-mutation/result.json" --previous-manifest "${RUNNER_TEMP}/previous-mutation/manifest.json" --summary "$GITHUB_STEP_SUMMARY"
