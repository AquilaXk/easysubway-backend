name: Scheduled Dependency Vulnerability Scan

on:
  schedule:
    - cron: "17 21 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  osv-scan:
    name: Scheduled OSV Scan
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@d3c1414ded37de590f207572e37a7d180f1d0ef7
    with:
      export-results: false
      upload-sarif: true
      fail-on-vuln: true
      scan-args: |-
        --lockfile=backend/gradle.lockfile
        --lockfile=tools/qa/package-lock.json
