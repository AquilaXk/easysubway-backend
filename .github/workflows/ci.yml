name: Backend CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-vulnerability-scan:
    name: Dependency Vulnerability Scan
    # Automerge Queue가 update-branch 후 이 워크플로를 명시 dispatch한다. GITHUB_TOKEN
    # push는 synchronize 이벤트를 만들지 못하므로, dispatch에서도 required context
    # `Dependency Vulnerability Scan / osv-scan`이 새 head에 붙어야 병합이 가능해진다.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@3a7550f43ba5b58905a821ce3a0ed24c4858b3f4
    with:
      export-results: false
      upload-sarif: true
      fail-on-vuln: true
      scan-args: |-
        --lockfile=backend/gradle.lockfile
        --lockfile=tools/qa/package-lock.json

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Stage pinned contracts
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --output "${RUNNER_TEMP}/backend-contracts.json" \
            https://raw.githubusercontent.com/AquilaXk/easysubway/main/contracts/bundles/backend-contracts-v1.0.0.json
          node backend/tools/stage-contracts.mjs \
            --lock backend/contracts.lock.json \
            --input "${RUNNER_TEMP}/backend-contracts.json" \
            --output backend/build/contracts-staging

      - name: Test backend-owned Node contracts
        run: |
          node --test backend/tools/*.test.mjs
          node --test tools/ci/*.test.mjs
          node --test tools/routes/*.test.mjs
          node --test tools/realtime/*.test.mjs

      - name: Test admin QA contracts
        run: |
          npm ci --prefix tools/qa --ignore-scripts
          npm test --prefix tools/qa

      - name: Test and package backend
        working-directory: backend
        env:
          EASYSUBWAY_CONTRACTS_BUNDLE: ${{ runner.temp }}/backend-contracts.json
        run: ./gradlew test bootJar --no-daemon

      - name: Build image without push
        run: docker build --tag easysubway-backend:ci backend
