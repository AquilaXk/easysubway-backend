name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      ios: ${{ steps.filter.outputs.ios }}
      repository: ${{ steps.filter.outputs.repository }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      ci: ${{ steps.filter.outputs.ci }}
      deploy: ${{ steps.filter.outputs.deploy }}
      datapack: ${{ steps.filter.outputs.datapack }}
      route_map: ${{ steps.filter.outputs.route_map }}
      realtime: ${{ steps.filter.outputs.realtime }}
      release: ${{ steps.filter.outputs.release }}
      contracts: ${{ steps.filter.outputs.contracts }}

    steps:
      - name: Changes / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Changes / Detect changed paths and CI areas
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          zero_sha="0000000000000000000000000000000000000000"
          head_sha="${HEAD_SHA}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${BASE_SHA}"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "${zero_sha}" ]]; then
            base_sha="${BEFORE_SHA}"
          else
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          git diff --name-only "${base_sha}" "${head_sha}" > changed-files.txt
          bash tools/ci/detect-changed-paths.sh changed-files.txt

  dependency-vulnerability-scan:
    name: Dependency Vulnerability Scan
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true' }}
    permissions:
      actions: read
      security-events: write
      contents: read
    # OSV export-results gate: google/osv-scanner-action#129 / fix PR #130
    # Pin commit 3a7550f… (post-v2.3.8). Follow-up: move pin when a release includes the gate.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@3a7550f43ba5b58905a821ce3a0ed24c4858b3f4
    with:
      export-results: false
      upload-sarif: true
      fail-on-vuln: true
      scan-args: |-
        --lockfile=apps/mobile/pubspec.lock
        --lockfile=apps/mobile/android/app/gradle.lockfile
        --lockfile=backend/gradle.lockfile
        --lockfile=tools/qa/package-lock.json

  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: PR Title / Validate bracket prefix
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${PR_TITLE}" =~ ^\[(Feat|Fix|Test|Chore|Docs|Build|CI|Style|Refactor|Backend|Mobile)\]\ .+ ]]; then
            echo "::error title=PR title::Use '[Type] 한국어 작업 요약' format."
            exit 1
          fi

  release-gate-consistency:
    name: Release Gate Consistency
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read

    steps:
      - name: Release Gate Consistency / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Release Gate Consistency / Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Release Gate Consistency / Run release gate contract tests
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: |
          node --test tools/ci/repository-contract.test.mjs
          node tools/ci/check-admin-vendor-integrity.mjs
          node tools/ci/check-map-attribution.mjs
          node --test tools/ci/check-map-attribution.test.mjs
          node --test tools/route-map/capital-route-map-coverage.test.mjs

  admin-qa-gates:
    name: Admin QA Gates
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    permissions:
      contents: read

    steps:
      - name: Admin QA Gates / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Admin QA Gates / Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Admin QA Gates / Install pinned QA tools
        run: npm ci --prefix tools/qa --ignore-scripts

      - name: Admin QA Gates / Run static QA gates
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: |
          node tools/ci/check-admin-vendor-integrity.mjs
          npm test --prefix tools/qa

      # #2283 V6-11: admin 관련 경로(backend surface)가 바뀌지 않은 PR은 heavy browser step을
      # 명시적으로 건너뛰고 성공 종료한다(exit 0). backend 출력은 admin 서버 렌더 화면과 QA 하네스
      # (tools/qa/** → ci=true → backend=true), 워크플로 변경(ci=true → backend=true)을 모두 포괄한다.
      - name: Admin QA Gates / Skip actual browser QA (unrelated change)
        if: ${{ needs.changes.outputs.backend != 'true' }}
        run: echo "No admin-related (backend) changes; skipping the actual browser accessibility QA step."

      - name: Admin QA Gates / Set up Java for actual browser QA
        if: ${{ needs.changes.outputs.backend == 'true' }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Admin QA Gates / Set up Chrome for actual browser QA
        if: ${{ needs.changes.outputs.backend == 'true' }}
        id: setup-chrome-a11y
        uses: browser-actions/setup-chrome@086160e580d6e8c142ad5ba29009dcde677c6321
        with:
          install-dependencies: true

      - name: Admin QA Gates / Build backend for actual browser QA
        if: ${{ needs.changes.outputs.backend == 'true' }}
        working-directory: backend
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      # #2283 V6-11: backend를 dev/H2로 부팅해 이후 seed·harness 단계가 같은 러너에서 공유한다
      # (백그라운드 프로세스는 스텝 경계를 넘어 같은 러너 VM에서 유지된다). 임시 admin·operator
      # 계정 비밀번호는 이 스텝에서 생성·마스킹해 GITHUB_ENV로 다음 스텝에 전달한다(로그에 비밀
      # 미출력, repository secret 미사용). backend 부팅 실패는 shadow와 무관하게 job을 실패시킨다.
      - name: Admin QA Gates / Boot backend for actual browser QA
        if: ${{ needs.changes.outputs.backend == 'true' }}
        env:
          SPRING_PROFILES_ACTIVE: dev
          EASYSUBWAY_ADMIN_BASIC_AUTH_ENABLED: "false"
          ADMIN_QA_OUTPUT_DIR: artifacts/admin-qa
        run: |
          set -euo pipefail
          mkdir -p "${ADMIN_QA_OUTPUT_DIR}"

          admin_user="admin-qa"
          operator_user="operator-qa"
          admin_pw="$(openssl rand -hex 24)"
          operator_pw="$(openssl rand -hex 24)"
          echo "::add-mask::${admin_pw}"
          echo "::add-mask::${operator_pw}"
          {
            echo "ADMIN_QA_ADMIN_USER=${admin_user}"
            echo "ADMIN_QA_ADMIN_PASSWORD=${admin_pw}"
            echo "ADMIN_QA_OPERATOR_USER=${operator_user}"
            echo "ADMIN_QA_OPERATOR_PASSWORD=${operator_pw}"
          } >> "${GITHUB_ENV}"

          # pipefail-safe jar 해석: `ls | grep | head` 파이프라인 대신 nullglob 배열로 실제
          # 파일 존재를 확인하고 -plain.jar(클래스만 담긴 부산물)를 배열 순회로 제외한다.
          shopt -s nullglob
          candidate_jars=(backend/build/libs/*.jar)
          shopt -u nullglob
          jar=""
          for candidate in "${candidate_jars[@]}"; do
            if [[ "${candidate}" != *-plain.jar ]]; then
              jar="${candidate}"
              break
            fi
          done
          if [[ -z "${jar}" ]]; then
            echo "no backend jar found in backend/build/libs (excluding *-plain.jar)"
            exit 1
          fi
          echo "Booting backend (profile=dev, H2 in-memory): ${jar}"
          EASYSUBWAY_ADMIN_USERNAME="${admin_user}" \
          EASYSUBWAY_ADMIN_PASSWORD="${admin_pw}" \
          EASYSUBWAY_OPERATOR_USERNAME="${operator_user}" \
          EASYSUBWAY_OPERATOR_PASSWORD="${operator_pw}" \
          nohup java -jar "${jar}" > "${ADMIN_QA_OUTPUT_DIR}/backend-qa.log" 2>&1 &
          backend_pid=$!
          disown
          echo "BACKEND_QA_PID=${backend_pid}" >> "${GITHUB_ENV}"

          # readiness probe(/actuator/health/readiness, permitAll 확인됨 — SecurityConfig.java)로
          # 좁힌다. liveness만으로는 DB 마이그레이션·빈 초기화가 끝나기 전에도 true가 될 수 있어
          # readiness가 더 정확한 부팅 완료 신호다(management.endpoint.health.probes.enabled=true).
          ready=0
          for _ in $(seq 1 60); do
            if ! kill -0 "${backend_pid}" 2>/dev/null; then
              echo "backend process exited before readiness"
              break
            fi
            if curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 3
          done
          if [[ "${ready}" != "1" ]]; then
            echo "backend did not become ready (see backend-qa.log artifact)"
            exit 1
          fi

      # #2283 V6-11: browser step 직전 seed 단계. 신고 사진 fail-closed 검사(#2280 V6-08 report-queue
      # -action-signal)는 dev/H2의 빈 신고 대기열에서 썸네일 0개로 항상 blocking되므로, 공개 API
      # (POST /api/v1/reports, photoDataBase64 인라인 경로)로 사진 첨부 신고 1건을 시드해 전제를
      # 확보한다. station-sangnoksu·facility-sangnoksu-elevator-1은 InMemoryTransitMasterRepository가
      # dev 프로파일에서 항상 시드하는 고정 식별자다(§#2277 AdminAccessibilitySmokeTest와 동일 fixture).
      # 임의 재시도 없이 단발 요청 실패는 그대로 job을 실패시킨다.
      - name: Admin QA Gates / Seed CI facility report photo for actual browser QA
        if: ${{ needs.changes.outputs.backend == 'true' }}
        run: |
          set -euo pipefail
          # FacilityReportControllerTest의 VALID_PNG_BASE64와 동일한 1x1 PNG golden fixture(비밀 아님).
          photo_base64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/p9sAAAAASUVORK5CYII="
          payload="$(node -e '
            const [stationId, facilityId, photoBase64] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              stationId,
              facilityId,
              reportType: "BROKEN",
              description: "CI seed: #2283 browser QA blocking 전제 확보(신고 사진 fail-closed 검사용)",
              photoFileName: "ci-seed.png",
              photoContentType: "image/png",
              photoDataBase64: photoBase64,
            }));
          ' "station-sangnoksu" "facility-sangnoksu-elevator-1" "${photo_base64}")"
          response_file="$(mktemp)"
          http_code="$(curl -sS -o "${response_file}" -w '%{http_code}' \
            -u "${ADMIN_QA_ADMIN_USER}:${ADMIN_QA_ADMIN_PASSWORD}" \
            -H 'Content-Type: application/json' \
            -X POST http://localhost:8080/api/v1/reports \
            -d "${payload}")"
          if [[ "${http_code}" != "201" ]]; then
            echo "seed report creation failed (HTTP ${http_code})"
            cat "${response_file}"
            exit 1
          fi
          echo "seeded facility report with photo (HTTP 201)"

      # #2283 V6-11: BLOCKING 승격. shadow 구간(PR #2309 run 29677088560, tested revision
      # 1fc89cda8ca81b801bb1fe18b21e945b54193df9)에서 seed 단계 포함 blocking 0으로 완주한 것을
      # 실측한 뒤 continue-on-error 한 줄을 제거해 승격했다(잡 이름·기존 단계는 변경하지 않는다).
      # backend는 앞선 Boot 단계가 이미 부팅·Seed 단계가 이미 시드했다.
      - name: Admin QA Gates / Actual browser accessibility QA (shadow)
        if: ${{ needs.changes.outputs.backend == 'true' }}
        id: browser-qa
        env:
          CHROME_PATH: ${{ steps.setup-chrome-a11y.outputs.chrome-path }}
          ADMIN_QA_CHROME_NO_SANDBOX: "1"
          ADMIN_QA_BASE_URL: http://localhost:8080
          ADMIN_QA_OUTPUT_DIR: artifacts/admin-qa
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: |
          set -euo pipefail
          mkdir -p "${ADMIN_QA_OUTPUT_DIR}"
          cat > "${ADMIN_QA_OUTPUT_DIR}/run-manifest.json" <<EOF
          {
            "testedRevision": "${GITHUB_SHA}",
            "profile": "dev",
            "database": "h2-in-memory",
            "seed": "ephemeral env admin/operator bootstrap accounts + 1 seeded facility report photo (never printed)",
            "viewports": ["desktop-1440", "desktop-1280", "tablet-1024", "mobile-390", "mobile-320"],
            "textScale": "200%",
            "reflow": "400% (320px target width)",
            "command": "node tools/qa/admin-accessibility-qa.mjs --output ${ADMIN_QA_OUTPUT_DIR}",
            "mode": "blocking"
          }
          EOF
          node tools/qa/admin-accessibility-qa.mjs --output "${ADMIN_QA_OUTPUT_DIR}"

      # #2283 리뷰: backend-qa.log는 artifact로 업로드되므로(actions/upload-artifact는 파일
      # 내용을 마스킹하지 않는다 — ::add-mask::는 워크플로 로그 스트림에만 적용된다) 생성 비밀
      # 문자열이 그대로 남을 위험이 있다. 두 대안 중 scrub(치환)을 선택했다: 로그를 아티팩트에서
      # 제외하는 방법은 부팅 실패 진단에 필요한 Spring 부팅 로그 전체를 잃지만, 알려진 두 개
      # 생성 비밀(hex 문자열, 정규식 특수문자 없음)만 정확히 치환하면 나머지 진단 정보를 그대로
      # 보존하면서 유출 경로를 차단할 수 있다.
      - name: Admin QA Gates / Stop backend for actual browser QA
        if: ${{ always() && needs.changes.outputs.backend == 'true' }}
        env:
          ADMIN_QA_OUTPUT_DIR: artifacts/admin-qa
        run: |
          set -euo pipefail
          if [[ -n "${BACKEND_QA_PID:-}" ]]; then
            kill "${BACKEND_QA_PID}" 2>/dev/null || true
          fi
          log_file="${ADMIN_QA_OUTPUT_DIR}/backend-qa.log"
          if [[ -f "${log_file}" ]]; then
            if [[ -n "${ADMIN_QA_ADMIN_PASSWORD:-}" ]]; then
              sed -i "s/${ADMIN_QA_ADMIN_PASSWORD}/[REDACTED]/g" "${log_file}"
            fi
            if [[ -n "${ADMIN_QA_OPERATOR_PASSWORD:-}" ]]; then
              sed -i "s/${ADMIN_QA_OPERATOR_PASSWORD}/[REDACTED]/g" "${log_file}"
            fi
          fi

      - name: Admin QA Gates / Upload actual browser QA artifacts (shadow)
        if: ${{ always() && needs.changes.outputs.backend == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-accessibility-qa
          path: artifacts/admin-qa
          if-no-files-found: warn
          retention-days: 14

      - name: Admin QA Gates / Summarize actual browser QA (shadow)
        if: ${{ always() && needs.changes.outputs.backend == 'true' }}
        env:
          ADMIN_QA_OUTPUT_DIR: artifacts/admin-qa
          BROWSER_QA_OUTCOME: ${{ steps.browser-qa.outcome }}
          TESTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "### Admin QA Gates / Actual browser QA"
            echo ""
            echo "- Mode: **blocking** (PR #2309 run 29677088560에서 seed 포함 blocking 0 shadow 실측 후 승격)"
            echo "- Step outcome: \`${BROWSER_QA_OUTCOME}\`"
            echo "- Tested revision: \`${TESTED_REVISION}\`"
            echo "- Seed/profile: dev · H2 in-memory · ephemeral env admin/operator 계정"
            echo "- Coverage: admin+operator route inventory · viewport 1440/1280/1024/390/320 · 200% text · 400% reflow"
          } >> "${GITHUB_STEP_SUMMARY}"
          report="${ADMIN_QA_OUTPUT_DIR}/admin-accessibility-qa-report.json"
          if [[ -f "${report}" ]]; then
            # #2283 리뷰(CodeRabbit Major): report JSON이 손상·절단돼 있어도 이 단계는 정보성
            # summary만 남기므로 항상 성공 종료해야 한다. 게이트 판정(blocking exit)은 이미
            # 앞선 harness 단계(id: browser-qa, continue-on-error 없음 — blocking 승격 완료)가
            # 자체 exit code로 내렸다. 이 step의 성공/실패는 그 판정을 강화하거나 약화하지 않는다.
            node -e '
              const fs = require("fs");
              const reportPath = process.argv[1];
              try {
                const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
                const summary = report.summary || {};
                const blocking = (report.blockingViolations || []).length;
                const lines = [
                  "- Blocking violations: **" + blocking + "**",
                  "- axe critical: " + (summary.criticalAxeViolations ?? "n/a") + " · axe serious: " + (summary.seriousAxeViolations ?? "n/a"),
                  "- reflow(400%) horizontal-scroll failures: " + (summary.reflowHorizontalScrollFailures ?? "n/a"),
                  "- screenshots: " + (summary.screenshots ?? "n/a") + " · no-JS pages: " + (summary.noJsPages ?? "n/a"),
                ];
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
              } catch (error) {
                let size = "unknown";
                let head = "";
                try {
                  size = String(fs.statSync(reportPath).size);
                  head = fs.readFileSync(reportPath, "utf8").slice(0, 500);
                } catch {
                  // stat/read 자체가 실패해도 fallback summary는 계속 남긴다.
                }
                const lines = [
                  "- Report JSON parse failed (fallback summary): **" + error.message + "**",
                  "- File size: " + size + " bytes",
                  "- Head (first 500 chars): " + JSON.stringify(head),
                ];
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
              }
            ' "${report}"
          else
            echo "- Report JSON not produced (backend boot or harness failed before report write; see artifact backend-qa.log)." >> "${GITHUB_STEP_SUMMARY}"
          fi

  repository-contracts:
    name: Repository CI
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read

    steps:
      - name: Repository CI / Skip unchanged area
        if: ${{ needs.changes.outputs.repository != 'true' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.ci != 'true' }}
        run: echo "No repository, docs-only, or CI changes; skipping repository checks."

      - name: Repository CI / Checkout repository
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.datapack == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Repository CI / Set up Node.js
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.datapack == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Repository CI / Validate whitespace
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.ci == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff-tree --check --root HEAD
          fi

      # tools/qa는 detect-changed-paths.sh에서 tools/ci·tools/repo와 같은 arm(ci=true, repository=true)에
      # 묶이므로 계약 테스트 스텝 글롭에 넣는다(#2558). Admin QA Gates의 `npm test --prefix tools/qa`는
      # playwright 설치(npm ci)에 딸린 실행 경로라, 설치가 깨지면 계약 테스트까지 함께 사라진다.
      # tools/qa 테스트는 소스를 텍스트로 파싱해 playwright 없이 돌아가므로 여기서도 그대로 실행된다.
      - name: Repository CI / Run contract tests
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.ci == 'true' }}
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: node --test tools/ci/*.test.mjs tools/ci/lib/*.test.mjs tools/repo/*.test.mjs tools/lib/*.test.mjs tools/mobile/*.test.mjs tools/qa/*.test.mjs

      - name: Repository CI / Validate contracts
        if: ${{ needs.changes.outputs.contracts == 'true' }}
        run: node tools/ci/check-contracts.mjs

      - name: Repository CI / Check directory boundaries
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.datapack == 'true' }}
        run: node tools/ci/check-boundaries.mjs

      - name: Repository CI / Check migration DDL compatibility
        if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.ci == 'true' }}
        run: node tools/ci/check-migration-ddl-compat.mjs

      - name: Repository CI / Run data pack tool tests
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' }}
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: node --test tools/datapack/*.test.mjs tools/datapack/lib/*.test.mjs

      # 앱 drift 선언이 바뀌어도(mobile) 팩 자산이 바뀌어도(datapack) 판정이 필요하므로
      # datapack 테스트 레인보다 트리거 범위를 넓게 잡는다(#2527).
      - name: Repository CI / Check data pack and app catalog schema parity
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.mobile == 'true' || needs.changes.outputs.datapack == 'true' }}
        run: node tools/ci/check-pack-app-schema-parity.mjs

      # tools/routes는 detect-changed-paths.sh에서 tools/route-map과 같은 arm(repository=true,
      # route_map=true)에 묶이지만 노선도 렌더링이 아니라 경로 탐색 도구라 Chrome이 필요 없다(#2558).
      # 아래 route map 스텝에 합치면 setup-chrome에 불필요하게 묶이므로, 다른 도메인 스텝과 같은
      # `repository || ci` 게이트로 별도 스텝을 둔다. setup-chrome 실패가 브라우저 비의존 테스트를
      # 막지 않도록 Chrome 설치 스텝보다 앞에 배치한다.
      - name: Repository CI / Run route tool tests
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' }}
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: node --test tools/routes/*.test.mjs

      - name: Repository CI / Set up Chrome for route map tests
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' }}
        id: setup-chrome
        uses: browser-actions/setup-chrome@086160e580d6e8c142ad5ba29009dcde677c6321
        with:
          install-dependencies: true

      - name: Repository CI / Run route map tool tests
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' }}
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
          ROUTE_MAP_CHROME_NO_SANDBOX: "1"
        run: node --test tools/route-map/*.test.mjs

      - name: Repository CI / Run realtime provider contract tests
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' }}
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: node --test tools/realtime/*.test.mjs

      - name: Repository CI / Run security tool tests
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' }}
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: node --test tools/security/*.test.mjs

      - name: Repository CI / Run ops tool tests
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' }}
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: node --test tools/ops/*.test.mjs

      - name: Repository CI / Run release tool tests
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' }}
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: node --test tools/release/*.test.mjs

      - name: Repository CI / Validate Docker Compose config
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.ci == 'true' }}
        run: docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet

      - name: Repository CI / Run Route V2 gateway integration
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.contracts == 'true' || needs.changes.outputs.backend == 'true' }}
        run: tools/test/run-route-v2-gateway-integration.sh

      - name: Repository CI / Lint GitHub Actions workflows
        if: ${{ needs.changes.outputs.ci == 'true' }}
        shell: bash
        env:
          # #2396: job 수준 env에서 runner context를 쓰는 등 context availability·표현식·스키마
          # 오류를 PR 단계에서 사전 차단한다. 커스텀 self-hosted 러너 라벨은 .github/actionlint.yaml에 등록.
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          # 사전 존재하는 info/style 수준 shellcheck 잡음은 게이트 대상에서 제외하고
          # warning 이상(실제 셸 결함)만 실패시킨다.
          SHELLCHECK_OPTS: --severity=warning
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          workdir="$(mktemp -d)"
          curl --proto '=https' --tlsv1.2 -fsSL "${url}" -o "${workdir}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${workdir}/${tarball}" | sha256sum --check --status
          tar -xzf "${workdir}/${tarball}" -C "${workdir}" actionlint
          "${workdir}/actionlint" -color

      - name: Repository CI / Validate issue forms
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.ci == 'true' }}
        run: ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts f }' .github/ISSUE_TEMPLATE/*.yml

      - name: Repository CI / Validate tracked Markdown policy
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.ci == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          unexpected_markdown="$(git ls-files '*.md' ':!:README.md' ':!:.github/pull_request_template.md' ':!:.github/PULL_REQUEST_TEMPLATE/*.md')"
          if [[ -n "${unexpected_markdown}" ]]; then
            echo "Unexpected tracked Markdown file:"
            echo "${unexpected_markdown}"
            exit 1
          fi

      - name: Repository CI / Validate local agent docs are not tracked
        if: ${{ needs.changes.outputs.repository == 'true' || needs.changes.outputs.docs_only == 'true' || needs.changes.outputs.ci == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          unexpected_agent_files="$(git ls-files AGENTS.md CLAUDE.md GEMINI.md CURSOR.md COPILOT.md docs .codex .claude .cursor .aider .windsurf .ai)"
          if [[ -n "${unexpected_agent_files}" ]]; then
            echo "Unexpected tracked local agent file:"
            echo "${unexpected_agent_files}"
            exit 1
          fi

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read

    steps:
      - name: Backend CI / Skip unchanged area
        if: ${{ needs.changes.outputs.backend != 'true' }}
        run: echo "No backend changes; skipping backend checks."

      - name: Backend CI / Checkout repository
        if: ${{ needs.changes.outputs.backend == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Backend CI / Detect backend scaffold
        if: ${{ needs.changes.outputs.backend == 'true' }}
        id: scaffold
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f backend/gradlew ]]; then
            chmod +x backend/gradlew
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "Backend scaffold not found; skipping backend checks."
          fi

      - name: Backend CI / Set up Java
        if: ${{ needs.changes.outputs.backend == 'true' && steps.scaffold.outputs.present == 'true' }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Backend CI / Run Gradle checks
        if: ${{ needs.changes.outputs.backend == 'true' && steps.scaffold.outputs.present == 'true' }}
        working-directory: backend
        run: ./gradlew check --no-daemon

  mobile-app:
    name: Mobile App CI
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read

    steps:
      - name: Mobile App CI / Skip unchanged area
        if: ${{ needs.changes.outputs.mobile != 'true' }}
        run: echo "No mobile app changes; skipping mobile checks."

      - name: Mobile App CI / Checkout repository
        if: ${{ needs.changes.outputs.mobile == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Mobile App CI / Detect Flutter scaffold
        if: ${{ needs.changes.outputs.mobile == 'true' }}
        id: scaffold
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f apps/mobile/pubspec.yaml ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "Flutter mobile scaffold not found; skipping mobile checks."
          fi

      - name: Mobile App CI / Set up Flutter
        if: ${{ needs.changes.outputs.mobile == 'true' && steps.scaffold.outputs.present == 'true' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Mobile App CI / Set up Node.js for mobile contracts
        if: ${{ needs.changes.outputs.mobile == 'true' && steps.scaffold.outputs.present == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Mobile App CI / Generate Android release merged manifest
        if: ${{ needs.changes.outputs.mobile == 'true' && steps.scaffold.outputs.present == 'true' }}
        working-directory: apps/mobile
        shell: bash
        env:
          EASYSUBWAY_ANDROID_KEYSTORE_PATH: ci-release-manifest-only.jks
          EASYSUBWAY_ANDROID_STORE_PASSWORD: ci-release-manifest-only
          EASYSUBWAY_ANDROID_KEY_ALIAS: ci-release-manifest-only
          EASYSUBWAY_ANDROID_KEY_PASSWORD: ci-release-manifest-only
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --config-only
          android/gradlew -p android :app:processReleaseMainManifest --no-daemon

      - name: Mobile App CI / Run mobile contracts
        if: ${{ needs.changes.outputs.mobile == 'true' && steps.scaffold.outputs.present == 'true' }}
        env:
          EASYSUBWAY_EXPECT_ANDROID_RELEASE_MANIFEST: "true"
        run: node --test --test-name-pattern "모바일 generic catch|모바일 접근성 출시 QA|릴리즈 보안 기준선|모바일 스토어 심사 정보 기준선|모바일 스토어 개인정보 인벤토리|Android 릴리즈 권한|iOS 앱은 개인정보 매니페스트|Android 런처 아이콘" tools/ci/repository-contract.test.mjs

      # tools/mobile의 status voice 인벤토리는 apps/mobile/lib 트리를 실제로 스캔하는
      # drift 가드다(#2518). repository 게이트의 계약 테스트 스텝에만 배선하면 Dart 전용
      # PR(mobile=true, repository=false)에서 스킵되어, drift가 green으로 병합되고 실패는
      # 나중에 무관한 PR에서 터진다. 위 mobile contracts 스텝은 --test-name-pattern으로
      # 걸러지므로 별도 스텝으로 mobile 게이트에 연결한다.
      - name: Mobile App CI / Run mobile tool tests
        if: ${{ needs.changes.outputs.mobile == 'true' && steps.scaffold.outputs.present == 'true' }}
        env:
          NODE_OPTIONS: --disable-warning=ExperimentalWarning
        run: node --test tools/mobile/*.test.mjs

      - name: Mobile App CI / Run Flutter analyzer and tests
        if: ${{ needs.changes.outputs.mobile == 'true' && steps.scaffold.outputs.present == 'true' }}
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          # `flutter analyze`는 포맷 드리프트를 잡지 못해, 포맷이 어긋난 파일이 CI green으로
          # 병합된 뒤 무관한 PR에서 뒤늦게 터졌다. Dart 소스 전 디렉토리를 게이트로 고정한다.
          dart format --output=none --set-exit-if-changed lib test integration_test test_driver
          flutter analyze
          flutter test --coverage
          node ../../tools/ci/filter-mobile-lcov.mjs --input coverage/lcov.info --output coverage/lcov.info

  android:
    name: Android CI
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read

    steps:
      - name: Android CI / Skip unchanged area
        if: ${{ needs.changes.outputs.android != 'true' }}
        run: echo "No Android changes; skipping Android checks."

      - name: Android CI / Checkout repository
        if: ${{ needs.changes.outputs.android == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Android CI / Detect Android scaffold
        if: ${{ needs.changes.outputs.android == 'true' }}
        id: scaffold
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f apps/mobile/pubspec.yaml && -d apps/mobile/android ]]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "Android scaffold not found; skipping Android checks."
          fi

      - name: Android CI / Set up Java
        if: ${{ needs.changes.outputs.android == 'true' && steps.scaffold.outputs.present == 'true' }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android CI / Set up Flutter
        if: ${{ needs.changes.outputs.android == 'true' && steps.scaffold.outputs.present == 'true' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Android CI / Build Flutter Android debug APK
        if: ${{ needs.changes.outputs.android == 'true' && steps.scaffold.outputs.present == 'true' }}
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --debug

  notify-slack-ci-failure:
    name: Slack / CI failure
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - changes
      - release-gate-consistency
      - repository-contracts
      - admin-qa-gates
      - backend
      - mobile-app
      - android
      - dependency-vulnerability-scan
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
      }}
    env:
      SLACK_CI_WEBHOOK_URL: ${{ secrets.SLACK_CI_WEBHOOK_URL }}
    steps:
      - name: Slack / Skip missing CI webhook
        if: ${{ env.SLACK_CI_WEBHOOK_URL == '' }}
        run: echo "::notice title=Slack notification::SLACK_CI_WEBHOOK_URL is not configured."

      - name: Slack / Notify CI failure
        if: ${{ env.SLACK_CI_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c
        with:
          webhook: ${{ env.SLACK_CI_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "EasySubway CI failed"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    *EasySubway CI 실패*
                    • repo: `${{ github.repository }}`
                    • ref: `${{ github.ref_name }}`
                    • actor: `${{ github.actor }}`
                    • run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions 열기>
