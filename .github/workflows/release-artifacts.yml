name: Release Artifacts

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      android_rc_signing_mode:
        description: Android RC signing mode
        type: choice
        required: true
        default: ci-self-signed
        options:
          - ci-self-signed
          - production-upload-key
      play_upload:
        description: Upload the production RC to a Play track
        type: choice
        required: false
        default: none
        options:
          - none
          - internal
      datapack_run_id:
        description: Data Pack Release run ID for the same Git SHA (required for production RC identity)
        type: string
        required: false
      callback_reconciliation_run_id:
        description: Callback reconciliation evidence run ID for the same final RC identity
        type: string
        required: false

concurrency:
  group: release-artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      ios: ${{ steps.filter.outputs.ios }}
      repository: ${{ steps.filter.outputs.repository }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
      ci: ${{ steps.filter.outputs.ci }}
      deploy: ${{ steps.filter.outputs.deploy }}

    steps:
      - name: Changes / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Changes / Detect changed paths and artifact areas
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          zero_sha="0000000000000000000000000000000000000000"
          head_sha="${HEAD_SHA}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${BASE_SHA}"
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "${zero_sha}" ]]; then
            base_sha="${BEFORE_SHA}"
          else
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          git diff --name-only "${base_sha}" "${head_sha}" > changed-files.txt
          bash tools/ci/detect-changed-paths.sh changed-files.txt

  android-release:
    name: Android Release Artifact
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    outputs:
      artifact_available: ${{ steps.release-env.outputs.artifact_available }}
    if: ${{ needs.changes.outputs.android == 'true' || needs.changes.outputs.mobile == 'true' }}

    steps:
      - name: Android Release Artifact / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Android Release Artifact / Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Android Release Artifact / Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android Release Artifact / Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Android Release Artifact / Create CI release keystore
        shell: bash
        env:
          EASYSUBWAY_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/easysubway-ci-release.jks
          EASYSUBWAY_ANDROID_STORE_PASSWORD: ci-release-password
          EASYSUBWAY_ANDROID_KEY_ALIAS: ci-release
          EASYSUBWAY_ANDROID_KEY_PASSWORD: ci-release-password
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "${EASYSUBWAY_ANDROID_KEYSTORE_PATH}" \
            -storepass "${EASYSUBWAY_ANDROID_STORE_PASSWORD}" \
            -keypass "${EASYSUBWAY_ANDROID_KEY_PASSWORD}" \
            -alias "${EASYSUBWAY_ANDROID_KEY_ALIAS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=EasySubway CI,O=EasySubway,C=KR"

      - name: Android Release Artifacts / Restore GitHub Actions dotenv secret
        id: release-env
        shell: bash
        env:
          EASYSUBWAY_ENV_SECRET: ${{ secrets.EASYSUBWAY_ENV }}
        run: |
          set -euo pipefail
          mark_pr_non_store_ready() {
            echo "::notice title=Release artifact env::Store privacy release values are unavailable; skipping store-ready artifact build for this PR."
            {
              echo "EASYSUBWAY_RELEASE_ARTIFACTS_STORE_READY=false"
              echo "EASYSUBWAY_RELEASE_ARTIFACTS_SKIP_BUILD=true"
            } >> "${GITHUB_ENV}"
            echo "artifact_available=false" >> "${GITHUB_OUTPUT}"
          }

          if [[ -z "${EASYSUBWAY_ENV_SECRET}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              mark_pr_non_store_ready
              exit 0
            fi
            printf 'EASYSUBWAY_ENV secret is required for store privacy release artifact builds.\n' >&2
            exit 1
          fi
          env_file="${RUNNER_TEMP}/easysubway-release.env"
          printf '%s' "${EASYSUBWAY_ENV_SECRET}" > "${env_file}"
          if node tools/ci/validate-store-privacy-env.mjs --env-file "${env_file}" --github-env "${GITHUB_ENV}"; then
            echo "EASYSUBWAY_RELEASE_ARTIFACTS_STORE_READY=true" >> "${GITHUB_ENV}"
            echo "artifact_available=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            mark_pr_non_store_ready
          else
            exit 1
          fi

      - name: Android Release Artifact / Record non-store-ready PR gate
        if: ${{ env.EASYSUBWAY_RELEASE_ARTIFACTS_SKIP_BUILD == 'true' }}
        shell: bash
        run: |
          {
            echo "store_ready=false"
            echo "artifact=skipped"
            echo "reason=EASYSUBWAY_ENV missing required store privacy release values for PR context"
            echo "toolchain_policy=apps/mobile/release/signed-release-artifact-gate.json"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Android Release Artifact / Audit bundled datapacks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-gate"
          node tools/ci/audit-mobile-datapack-assets.mjs --index apps/mobile/assets/datapacks/index.json --root apps/mobile > "${RUNNER_TEMP}/release-gate/mobile-datapack-asset-audit.json"
          node tools/datapack/verify-production-pack-artifact-identity.mjs --build-spec tools/datapack/release/candidate-build-spec.json --asset apps/mobile/assets/datapacks/capital.sqlite.gz --index apps/mobile/assets/datapacks/index.json --pack-id capital > "${RUNNER_TEMP}/release-gate/production-pack-artifact-identity.json"
          echo "EASYSUBWAY_MOBILE_DATAPACK_ASSET_AUDIT=${RUNNER_TEMP}/release-gate/mobile-datapack-asset-audit.json" >> "${GITHUB_ENV}"

      - name: Android Release Artifact / Restore Crashlytics google-services.json
        if: ${{ env.EASYSUBWAY_RELEASE_ARTIFACTS_SKIP_BUILD != 'true' }}
        shell: bash
        env:
          EASYSUBWAY_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.EASYSUBWAY_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          target="apps/mobile/android/app/google-services.json"
          if [[ -z "${EASYSUBWAY_ANDROID_GOOGLE_SERVICES_JSON_BASE64}" ]]; then
            echo "::notice title=Crashlytics::EASYSUBWAY_ANDROID_GOOGLE_SERVICES_JSON_BASE64 unset; Android release continues without Firebase Crashlytics plugin wiring."
            exit 0
          fi
          printf '%s' "${EASYSUBWAY_ANDROID_GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > "${target}"
          test -s "${target}"
          echo "::notice title=Crashlytics::Restored ${target} for Crashlytics Gradle plugin."

      - name: Android Release Artifact / Build Flutter app bundle
        if: ${{ env.EASYSUBWAY_RELEASE_ARTIFACTS_SKIP_BUILD != 'true' }}
        working-directory: apps/mobile
        shell: bash
        env:
          EASYSUBWAY_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/easysubway-ci-release.jks
          EASYSUBWAY_ANDROID_STORE_PASSWORD: ci-release-password
          EASYSUBWAY_ANDROID_KEY_ALIAS: ci-release
          EASYSUBWAY_ANDROID_KEY_PASSWORD: ci-release-password
          DEPLOY_PUBLIC_API_BASE_URL: ${{ vars.DEPLOY_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          flutter pub get
          ../../tools/mobile/validate-release-dart-defines.sh \
            --dart-define=EASYSUBWAY_API_BASE_URL="${DEPLOY_PUBLIC_API_BASE_URL}" \
            --dart-define=EASYSUBWAY_TERMS_OF_SERVICE_URL="${EASYSUBWAY_TERMS_OF_SERVICE_URL}" \
            --dart-define=EASYSUBWAY_PRIVACY_POLICY_URL="${EASYSUBWAY_PRIVACY_POLICY_URL}" \
            --dart-define=EASYSUBWAY_LOCATION_TERMS_URL="${EASYSUBWAY_LOCATION_TERMS_URL}" \
            --dart-define=EASYSUBWAY_SUPPORT_EMAIL="${EASYSUBWAY_SUPPORT_EMAIL}" \
            --dart-define=EASYSUBWAY_DATA_DELETION_EMAIL="${EASYSUBWAY_DATA_DELETION_EMAIL}" \
            --dart-define=EASYSUBWAY_SECURITY_EMAIL="${EASYSUBWAY_SECURITY_EMAIL}" \
            --dart-define=EASYSUBWAY_KAKAO_MAP_NATIVE_APP_KEY="${EASYSUBWAY_KAKAO_MAP_NATIVE_APP_KEY}" \
            --dart-define=EASYSUBWAY_ENABLE_PUSH_NOTIFICATIONS=false
          flutter build appbundle --release \
            --target-platform=android-arm,android-arm64 \
            --dart-define=EASYSUBWAY_API_BASE_URL="${DEPLOY_PUBLIC_API_BASE_URL}" \
            --dart-define=EASYSUBWAY_TERMS_OF_SERVICE_URL="${EASYSUBWAY_TERMS_OF_SERVICE_URL}" \
            --dart-define=EASYSUBWAY_PRIVACY_POLICY_URL="${EASYSUBWAY_PRIVACY_POLICY_URL}" \
            --dart-define=EASYSUBWAY_LOCATION_TERMS_URL="${EASYSUBWAY_LOCATION_TERMS_URL}" \
            --dart-define=EASYSUBWAY_SUPPORT_EMAIL="${EASYSUBWAY_SUPPORT_EMAIL}" \
            --dart-define=EASYSUBWAY_DATA_DELETION_EMAIL="${EASYSUBWAY_DATA_DELETION_EMAIL}" \
            --dart-define=EASYSUBWAY_SECURITY_EMAIL="${EASYSUBWAY_SECURITY_EMAIL}" \
            --dart-define=EASYSUBWAY_KAKAO_MAP_NATIVE_APP_KEY="${EASYSUBWAY_KAKAO_MAP_NATIVE_APP_KEY}" \
            --dart-define=EASYSUBWAY_ENABLE_PUSH_NOTIFICATIONS=false

      - name: Android Release Artifact / Collect release outputs
        if: ${{ env.EASYSUBWAY_RELEASE_ARTIFACTS_SKIP_BUILD != 'true' }}
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/android
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/android/app-release.aab
          cp "${EASYSUBWAY_MOBILE_DATAPACK_ASSET_AUDIT}" release-artifacts/android/mobile-datapack-asset-audit.json
          cp release/signed-release-artifact-gate.json release-artifacts/android/signed-release-artifact-gate.json
          cp release/android-16kb-page-size-gate.json release-artifacts/android/android-16kb-page-size-gate.json
          cp release/play-production-access-gate.json release-artifacts/android/play-production-access-gate.json
          cp release/play-store-submission-content.json release-artifacts/android/play-store-submission-content.json
          cp release/play-generated-apk-device-matrix-gate.json release-artifacts/android/play-generated-apk-device-matrix-gate.json
          cp ../../release/product-gates/post-launch-operations-review-gate.json release-artifacts/android/post-launch-operations-review-gate.json
          cp ../../release/product-gates/support-incident-response-gate.json release-artifacts/android/support-incident-response-gate.json
          cp ../../release/product-gates/abuse-penetration-rehearsal-gate.json release-artifacts/android/abuse-penetration-rehearsal-gate.json
          cp ../../release/product-gates/rc-evidence-manifest-contract.json release-artifacts/android/rc-evidence-manifest-contract.json
          cp ../../tools/mobile/check-android-aab-16kb-page-size.sh release-artifacts/android/check-android-aab-16kb-page-size.sh
          cp ../../tools/mobile/check-elf-load-alignment.mjs release-artifacts/android/check-elf-load-alignment.mjs
          if [[ -f build/app/outputs/mapping/release/mapping.txt ]]; then
            cp build/app/outputs/mapping/release/mapping.txt release-artifacts/android/mapping.txt
          else
            printf 'mapping=not-generated\n' > release-artifacts/android/mapping.txt
          fi
          aab_payload_sha256="$(node ../../tools/release/hash-android-bundle-payload.mjs --aab release-artifacts/android/app-release.aab)"
          {
            echo "commit=${GITHUB_SHA}"
            echo "artifact=app-release.aab"
            echo "store_ready=false"
            echo "signing_key_type=temporary-self-signed"
            echo "rc_evidence_manifest=easysubway-rc-evidence-manifest-${GITHUB_SHA}"
            echo "mapping=build/app/outputs/mapping/release/mapping.txt"
            echo "mapping_retention_days=90"
            echo "play_submission_evidence=blocked_missing_internal_track_or_prelaunch_report"
            echo "page_size_16kb_evidence=blocked_until_tools_mobile_check_android_aab_16kb_page_size_passes_and_runtime_PAGE_SIZE_16384_smoke_passes"
            echo "play_production_access_evidence=blocked_until_play_production_access_gate_console_summary_is_satisfied"
            echo "play_app_content_data_safety_listing_evidence=blocked_until_play_store_submission_content_console_summary_is_satisfied"
            echo "play_generated_apk_device_matrix_evidence=blocked_until_play_generated_apk_device_matrix_gate_is_satisfied"
            echo "post_launch_operations_review_evidence=blocked_until_post_launch_operations_review_gate_is_satisfied"
            echo "support_incident_response_evidence=blocked_until_support_incident_response_gate_is_satisfied"
            echo "supportContactSetSha256=${EASYSUBWAY_SUPPORT_CONTACT_SET_SHA256}"
            echo "aabPayloadSha256=${aab_payload_sha256}"
            echo "abuse_penetration_rehearsal_evidence=blocked_until_abuse_penetration_rehearsal_gate_is_satisfied"
            echo "toolchain_policy=apps/mobile/release/signed-release-artifact-gate.json"
          } > release-artifacts/android/release-metadata.txt

      - name: Android Release Artifact / Upload app bundle
        if: ${{ env.EASYSUBWAY_RELEASE_ARTIFACTS_SKIP_BUILD != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: easysubway-android-release-${{ github.sha }}
          path: apps/mobile/release-artifacts/android
          if-no-files-found: error
          retention-days: 90

      - name: Android Release Artifact / Cleanup sensitive files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/easysubway-ci-release.jks" "${RUNNER_TEMP}/easysubway-upload-key.jks" "${RUNNER_TEMP}/easysubway-release.env"

  android-production-rc-release:
    name: Android Production RC Artifact
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.android_rc_signing_mode == 'production-upload-key' }}
    environment:
      name: android-production-rc

    steps:
      - name: Android Production RC Artifact / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Android Production RC Artifact / Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Android Production RC Artifact / Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Android Production RC Artifact / Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Android Production RC Artifact / Restore release environment
        shell: bash
        env:
          EASYSUBWAY_ENV_SECRET: ${{ secrets.EASYSUBWAY_ENV }}
        run: |
          set -euo pipefail
          if [[ -z "${EASYSUBWAY_ENV_SECRET}" ]]; then
            printf 'EASYSUBWAY_ENV secret is required for Android production RC builds.\n' >&2
            exit 1
          fi
          env_file="${RUNNER_TEMP}/easysubway-release.env"
          printf '%s' "${EASYSUBWAY_ENV_SECRET}" > "${env_file}"
          node tools/ci/validate-store-privacy-env.mjs \
            --env-file "${env_file}" \
            --github-env "${GITHUB_ENV}" \
            --require-android-rc-production

      - name: Android Production RC Artifact / Restore production upload key
        shell: bash
        env:
          EASYSUBWAY_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/easysubway-upload-key.jks
          EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          EASYSUBWAY_ANDROID_STORE_PASSWORD: ${{ secrets.EASYSUBWAY_ANDROID_STORE_PASSWORD }}
          EASYSUBWAY_ANDROID_KEY_ALIAS: ${{ secrets.EASYSUBWAY_ANDROID_KEY_ALIAS }}
          EASYSUBWAY_ANDROID_KEY_PASSWORD: ${{ secrets.EASYSUBWAY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required_secret in \
            EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64 \
            EASYSUBWAY_ANDROID_STORE_PASSWORD \
            EASYSUBWAY_ANDROID_KEY_ALIAS \
            EASYSUBWAY_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!required_secret}" ]]; then
              printf '%s is required for Android production RC builds.\n' "${required_secret}" >&2
              exit 1
            fi
          done
          echo "::add-mask::${EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64}"
          echo "::add-mask::${EASYSUBWAY_ANDROID_STORE_PASSWORD}"
          echo "::add-mask::${EASYSUBWAY_ANDROID_KEY_ALIAS}"
          echo "::add-mask::${EASYSUBWAY_ANDROID_KEY_PASSWORD}"
          umask 077
          printf '%s' "${EASYSUBWAY_ANDROID_UPLOAD_KEYSTORE_BASE64}" | base64 --decode > "${EASYSUBWAY_ANDROID_KEYSTORE_PATH}"
          upload_key_sha256="$(
            keytool -list -v \
              -keystore "${EASYSUBWAY_ANDROID_KEYSTORE_PATH}" \
              -storepass "${EASYSUBWAY_ANDROID_STORE_PASSWORD}" \
              -alias "${EASYSUBWAY_ANDROID_KEY_ALIAS}" |
              awk -F': ' '/SHA256:/{print $2; exit}'
          )"
          if [[ -z "${upload_key_sha256}" ]]; then
            printf 'Upload key SHA-256 fingerprint could not be read from keystore.\n' >&2
            exit 1
          fi
          {
            echo "EASYSUBWAY_ANDROID_KEYSTORE_PATH=${EASYSUBWAY_ANDROID_KEYSTORE_PATH}"
            echo "EASYSUBWAY_ANDROID_STORE_PASSWORD=${EASYSUBWAY_ANDROID_STORE_PASSWORD}"
            echo "EASYSUBWAY_ANDROID_KEY_ALIAS=${EASYSUBWAY_ANDROID_KEY_ALIAS}"
            echo "EASYSUBWAY_ANDROID_KEY_PASSWORD=${EASYSUBWAY_ANDROID_KEY_PASSWORD}"
            echo "EASYSUBWAY_ANDROID_UPLOAD_KEY_SHA256=${upload_key_sha256}"
          } >> "${GITHUB_ENV}"

      - name: Android Production RC Artifact / Restore Crashlytics google-services.json
        shell: bash
        env:
          EASYSUBWAY_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.EASYSUBWAY_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          target="apps/mobile/android/app/google-services.json"
          if [[ -z "${EASYSUBWAY_ANDROID_GOOGLE_SERVICES_JSON_BASE64}" ]]; then
            printf 'EASYSUBWAY_ANDROID_GOOGLE_SERVICES_JSON_BASE64 is required for Android production RC Crashlytics wiring.\n' >&2
            exit 1
          fi
          printf '%s' "${EASYSUBWAY_ANDROID_GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > "${target}"
          test -s "${target}"

      - name: Android Production RC Artifact / Audit bundled datapacks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/release-gate"
          node tools/ci/audit-mobile-datapack-assets.mjs --index apps/mobile/assets/datapacks/index.json --root apps/mobile > "${RUNNER_TEMP}/release-gate/mobile-datapack-asset-audit.json"
          node tools/datapack/verify-production-pack-artifact-identity.mjs --build-spec tools/datapack/release/candidate-build-spec.json --asset apps/mobile/assets/datapacks/capital.sqlite.gz --index apps/mobile/assets/datapacks/index.json --pack-id capital > "${RUNNER_TEMP}/release-gate/production-pack-artifact-identity.json"
          echo "EASYSUBWAY_MOBILE_DATAPACK_ASSET_AUDIT=${RUNNER_TEMP}/release-gate/mobile-datapack-asset-audit.json" >> "${GITHUB_ENV}"

      - name: Android Production RC Artifact / Build production signed app bundle
        working-directory: apps/mobile
        shell: bash
        env:
          DEPLOY_PUBLIC_API_BASE_URL: ${{ vars.DEPLOY_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          ../../tools/mobile/validate-release-dart-defines.sh \
            --dart-define=EASYSUBWAY_API_BASE_URL="${DEPLOY_PUBLIC_API_BASE_URL}" \
            --dart-define=EASYSUBWAY_TERMS_OF_SERVICE_URL="${EASYSUBWAY_TERMS_OF_SERVICE_URL}" \
            --dart-define=EASYSUBWAY_PRIVACY_POLICY_URL="${EASYSUBWAY_PRIVACY_POLICY_URL}" \
            --dart-define=EASYSUBWAY_LOCATION_TERMS_URL="${EASYSUBWAY_LOCATION_TERMS_URL}" \
            --dart-define=EASYSUBWAY_SUPPORT_EMAIL="${EASYSUBWAY_SUPPORT_EMAIL}" \
            --dart-define=EASYSUBWAY_DATA_DELETION_EMAIL="${EASYSUBWAY_DATA_DELETION_EMAIL}" \
            --dart-define=EASYSUBWAY_SECURITY_EMAIL="${EASYSUBWAY_SECURITY_EMAIL}" \
            --dart-define=EASYSUBWAY_KAKAO_MAP_NATIVE_APP_KEY="${EASYSUBWAY_KAKAO_MAP_NATIVE_APP_KEY}" \
            --dart-define=EASYSUBWAY_DATA_PACK_BASE_URL="${EASYSUBWAY_DATA_PACK_BASE_URL}" \
            --dart-define=EASYSUBWAY_DATAPACK_SIGNING_PUBLIC_KEY_N="${EASYSUBWAY_DATAPACK_SIGNING_PUBLIC_KEY_N}" \
            --dart-define=EASYSUBWAY_DATAPACK_SIGNING_PUBLIC_KEY_E="${EASYSUBWAY_DATAPACK_SIGNING_PUBLIC_KEY_E}" \
            --dart-define=EASYSUBWAY_DATAPACK_SIGNING_KEY_ID="${EASYSUBWAY_DATAPACK_SIGNING_KEY_ID}" \
            --dart-define=EASYSUBWAY_DATAPACK_CHANNEL="${EASYSUBWAY_DATAPACK_CHANNEL}" \
            --dart-define=EASYSUBWAY_ROUTE_V2_ONLINE_FIRST_ENABLED=true \
            --dart-define=EASYSUBWAY_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER="${EASYSUBWAY_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER}" \
            --dart-define=EASYSUBWAY_ENABLE_PUSH_NOTIFICATIONS=false
          flutter build appbundle --release \
            --target-platform=android-arm,android-arm64 \
            --dart-define=EASYSUBWAY_API_BASE_URL="${DEPLOY_PUBLIC_API_BASE_URL}" \
            --dart-define=EASYSUBWAY_TERMS_OF_SERVICE_URL="${EASYSUBWAY_TERMS_OF_SERVICE_URL}" \
            --dart-define=EASYSUBWAY_PRIVACY_POLICY_URL="${EASYSUBWAY_PRIVACY_POLICY_URL}" \
            --dart-define=EASYSUBWAY_LOCATION_TERMS_URL="${EASYSUBWAY_LOCATION_TERMS_URL}" \
            --dart-define=EASYSUBWAY_SUPPORT_EMAIL="${EASYSUBWAY_SUPPORT_EMAIL}" \
            --dart-define=EASYSUBWAY_DATA_DELETION_EMAIL="${EASYSUBWAY_DATA_DELETION_EMAIL}" \
            --dart-define=EASYSUBWAY_SECURITY_EMAIL="${EASYSUBWAY_SECURITY_EMAIL}" \
            --dart-define=EASYSUBWAY_KAKAO_MAP_NATIVE_APP_KEY="${EASYSUBWAY_KAKAO_MAP_NATIVE_APP_KEY}" \
            --dart-define=EASYSUBWAY_DATA_PACK_BASE_URL="${EASYSUBWAY_DATA_PACK_BASE_URL}" \
            --dart-define=EASYSUBWAY_DATAPACK_SIGNING_PUBLIC_KEY_N="${EASYSUBWAY_DATAPACK_SIGNING_PUBLIC_KEY_N}" \
            --dart-define=EASYSUBWAY_DATAPACK_SIGNING_PUBLIC_KEY_E="${EASYSUBWAY_DATAPACK_SIGNING_PUBLIC_KEY_E}" \
            --dart-define=EASYSUBWAY_DATAPACK_SIGNING_KEY_ID="${EASYSUBWAY_DATAPACK_SIGNING_KEY_ID}" \
            --dart-define=EASYSUBWAY_DATAPACK_CHANNEL="${EASYSUBWAY_DATAPACK_CHANNEL}" \
            --dart-define=EASYSUBWAY_ROUTE_V2_ONLINE_FIRST_ENABLED=true \
            --dart-define=EASYSUBWAY_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER="${EASYSUBWAY_PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER}" \
            --dart-define=EASYSUBWAY_ENABLE_PUSH_NOTIFICATIONS=false

      - name: Android Production RC Artifact / Collect production metadata
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/android
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/android/app-release.aab
          cp "${EASYSUBWAY_MOBILE_DATAPACK_ASSET_AUDIT}" release-artifacts/android/mobile-datapack-asset-audit.json
          cp release/signed-release-artifact-gate.json release-artifacts/android/signed-release-artifact-gate.json
          cp release/android-16kb-page-size-gate.json release-artifacts/android/android-16kb-page-size-gate.json
          cp release/android-rc-store-evidence.json release-artifacts/android/android-rc-store-evidence.json
          cp ../../release/product-gates/post-launch-operations-review-gate.json release-artifacts/android/post-launch-operations-review-gate.json
          cp ../../release/product-gates/support-incident-response-gate.json release-artifacts/android/support-incident-response-gate.json
          cp ../../release/product-gates/operations-observability-gate.json release-artifacts/android/operations-observability-gate.json
          cp ../../tools/mobile/check-android-aab-16kb-page-size.sh release-artifacts/android/check-android-aab-16kb-page-size.sh
          cp ../../tools/mobile/check-elf-load-alignment.mjs release-artifacts/android/check-elf-load-alignment.mjs
          if [[ -f build/app/outputs/mapping/release/mapping.txt ]]; then
            cp build/app/outputs/mapping/release/mapping.txt release-artifacts/android/mapping.txt
          else
            printf 'mapping=not-generated\n' > release-artifacts/android/mapping.txt
          fi
          version_line="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          version_name="${version_line%%+*}"
          version_code="${version_line##*+}"
          aab_sha256="$(sha256sum release-artifacts/android/app-release.aab | awk '{print $1}')"
          aab_payload_sha256="$(node ../../tools/release/hash-android-bundle-payload.mjs --aab release-artifacts/android/app-release.aab)"
          data_pack_manifest_sha256="$(sha256sum assets/datapacks/metro_map_pack/manifest.json | awk '{print $1}')"
          {
            echo "gitSha=${GITHUB_SHA}"
            echo "artifact=app-release.aab"
            echo "storeReadyCandidate=true"
            echo "signingKeyType=production-upload-key"
            echo "uploadKeySha256Fingerprint=${EASYSUBWAY_ANDROID_UPLOAD_KEY_SHA256}"
            echo "appSigningKeySha256Fingerprint=${EASYSUBWAY_PLAY_APP_SIGNING_KEY_SHA256}"
            echo "versionName=${version_name}"
            echo "versionCode=${version_code}"
            echo "packageId=com.easysubway.app"
            echo "aabSha256=${aab_sha256}"
            echo "aabPayloadSha256=${aab_payload_sha256}"
            echo "dataPackManifestSha256=${data_pack_manifest_sha256}"
            echo "supportContactSetSha256=${EASYSUBWAY_SUPPORT_CONTACT_SET_SHA256}"
            echo "dataPackChannel=${EASYSUBWAY_DATAPACK_CHANNEL}"
            echo "routeContractVersion=route-map-contract-v1"
            echo "realtimeContractVersion=seoul-topis-schema-v1"
            echo "mapping=build/app/outputs/mapping/release/mapping.txt"
            echo "mappingRetentionDays=90"
            echo "versionCodeMonotonicPolicy=must_be_greater_than_latest_play_uploaded_artifact"
            echo "failedRcVersionCodeReusePolicy=forbidden_without_1020_waiver"
            echo "pageSize16kbEvidence=blocked_until_tools_mobile_check_android_aab_16kb_page_size_passes_and_runtime_PAGE_SIZE_16384_smoke_passes"
            echo "toolchainPolicy=apps/mobile/release/signed-release-artifact-gate.json"
          } > release-artifacts/android/release-metadata.txt

      - name: Android Production RC Artifact / Upload app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: easysubway-android-production-rc-${{ github.sha }}
          path: apps/mobile/release-artifacts/android
          if-no-files-found: error
          retention-days: 90

      - name: Android Production RC Artifact / Cleanup sensitive files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/easysubway-ci-release.jks" "${RUNNER_TEMP}/easysubway-upload-key.jks" "${RUNNER_TEMP}/easysubway-release.env"

  play-internal-upload:
    name: Play internal track upload
    runs-on: ubuntu-latest
    needs:
      - android-production-rc-release
      - rc-evidence-manifest
    permissions:
      contents: read
    # Google Play allows only one active edit per app; serialize uploads and
    # never cancel an in-flight one so a running commit is not interrupted.
    concurrency:
      group: play-internal-upload
      cancel-in-progress: false
    # Shares the android-production-rc environment approval gate. Opt-in only:
    # play_upload=internal keeps the default build-only flow unchanged (#1689).
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.android_rc_signing_mode == 'production-upload-key' && inputs.play_upload == 'internal' && needs.android-production-rc-release.result == 'success' && needs.rc-evidence-manifest.result == 'success' }}
    environment:
      name: android-production-rc
    steps:
      - name: Play internal upload / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Play internal upload / Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Play internal upload / Download production RC artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: easysubway-android-production-rc-${{ github.sha }}
          path: release-artifacts/downloaded/android-production-rc

      - name: Play internal upload / Download RC evidence artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: easysubway-rc-evidence-manifest-${{ github.sha }}
          path: release-artifacts/downloaded/rc

      - name: Play internal upload / Require authoritative GO decision
        run: >-
          node tools/release/validate-system-release-manifest.mjs
          --manifest release-artifacts/downloaded/rc/system-release-manifest.json
          --require-decision GO

      - name: Play internal upload / Restore release environment
        shell: bash
        env:
          EASYSUBWAY_ENV_SECRET: ${{ secrets.EASYSUBWAY_ENV }}
        run: |
          set -euo pipefail
          if [[ -z "${EASYSUBWAY_ENV_SECRET}" ]]; then
            printf 'EASYSUBWAY_ENV secret is required for Play internal uploads.\n' >&2
            exit 1
          fi
          umask 077
          printf '%s' "${EASYSUBWAY_ENV_SECRET}" > "${RUNNER_TEMP}/easysubway-release.env"

      - name: Play internal upload / Upload AAB to internal track
        shell: bash
        run: |
          set -euo pipefail

          aab="release-artifacts/downloaded/android-production-rc/app-release.aab"
          mapping="release-artifacts/downloaded/android-production-rc/mapping.txt"

          version_code="$(sed -nE 's/^version:[^+]*\+([0-9]+).*/\1/p' apps/mobile/pubspec.yaml | head -n1)"
          if [[ -z "${version_code}" ]]; then
            echo "could not resolve versionCode from apps/mobile/pubspec.yaml" >&2
            exit 1
          fi

          mapping_args=()
          if [[ -f "${mapping}" ]] && ! grep -q '^mapping=not-generated$' "${mapping}"; then
            mapping_args=(--mapping "${mapping}")
          fi

          node tools/release/upload-play-internal.mjs \
            --env-file "${RUNNER_TEMP}/easysubway-release.env" \
            --aab "${aab}" \
            --version-code "${version_code}" \
            --track internal \
            --report release-artifacts/play-internal-upload-evidence.json \
            ${mapping_args[@]+"${mapping_args[@]}"}

      - name: Play internal upload / Upload evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: easysubway-play-internal-upload-${{ github.sha }}
          path: release-artifacts/play-internal-upload-evidence.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Play internal upload / Cleanup sensitive files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/easysubway-release.env"

  # PRs validate a local image only. Main pushes publish the single production
  # image and its immutable component manifest for CD consumption.
  backend-release:
    name: Backend Release Image
    runs-on: ubuntu-24.04-arm
    needs: changes
    permissions:
      actions: read
      contents: read
      # Main push에서 GHCR image를 publish할 때만 사용한다.
      packages: write
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.deploy == 'true' || needs.changes.outputs.android == 'true' || needs.changes.outputs.mobile == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Backend Release Image / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Backend Release Image / Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Backend Release Image / Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Backend Release Image / Require successful main CI
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ci_runs_file="${RUNNER_TEMP}/ci-runs.json"
          ci_wait_deadline="$((SECONDS + 3600))"
          while true; do
            if curl -fsS \
              --connect-timeout 5 \
              --max-time 20 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --output "${ci_runs_file}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&status=success&per_page=20"; then
              if node tools/ci/require-successful-workflow-run.mjs \
                "${ci_runs_file}" "${GITHUB_SHA}" "CI" "push" main 1209600; then
                break
              fi
            fi
            if (( SECONDS >= ci_wait_deadline )); then
              echo "timed out waiting for successful CI for ${GITHUB_SHA}" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Backend Release Image / Build bootJar
        working-directory: backend
        env:
          EASYSUBWAY_CONTRACTS_BUNDLE: ${{ github.workspace }}/contracts/bundles/backend-contracts-v1.0.0.json
        run: ./gradlew bootJar --no-daemon

      - name: Backend Release Image / Generate Route V2 planner canary
        working-directory: backend
        env:
          EASYSUBWAY_CONTRACTS_BUNDLE: ${{ github.workspace }}/contracts/bundles/backend-contracts-v1.0.0.json
          EASYSUBWAY_PLANNER_SUCCESS_OUTPUT: ../release-artifacts/backend/planner-canary-result.json
          EASYSUBWAY_CANONICAL_PACK_PATH: ../apps/mobile/assets/datapacks/capital.sqlite.gz
        run: |
          mkdir -p ../release-artifacts/backend
          ./gradlew test --no-daemon \
            --tests com.easysubway.route.application.service.RouteSearchServiceTest.routeV2PlannerProducesSyntheticCanaryResult

      - name: Backend Release Image / Build PR validation image
        if: ${{ github.event_name != 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/arm64 -f backend/Dockerfile -t easysubway-backend:${GITHUB_SHA} backend
          docker image inspect easysubway-backend:${GITHUB_SHA}

      - name: Backend Release Image / Log in to GHCR
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend Release Image / Build and push immutable arm64 image
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/aquilaxk/easysubway-backend:sha-${GITHUB_SHA}"
          metadata_file="${RUNNER_TEMP}/backend-build-metadata.json"
          mkdir -p release-artifacts/backend
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/arm64 --push --sbom=true --provenance=mode=max --metadata-file "${metadata_file}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -f backend/Dockerfile -t "${image}" backend
          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${image}")"
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "published image lacks an immutable digest" >&2
            exit 1
          fi
          if ! grep -Eq '"containerimage\.digest"[[:space:]]*:[[:space:]]*"'"${digest}"'"' "${metadata_file}"; then
            echo "Buildx metadata digest does not match the pushed manifest" >&2
            exit 1
          fi
          docker buildx imagetools inspect --raw "${image}" > release-artifacts/backend/image-index.json
          sbom="$(docker buildx imagetools inspect "${image}" --format '{{json .SBOM}}')"
          provenance="$(docker buildx imagetools inspect "${image}" --format '{{json .Provenance}}')"
          if [[ -z "${sbom}" || "${sbom}" == "null" || -z "${provenance}" || "${provenance}" == "null" ]]; then
            echo "published image lacks SBOM or provenance attestation" >&2
            exit 1
          fi
          arch="$(docker buildx imagetools inspect "${image}" --format '{{range .Manifest.Manifests}}{{if eq .Platform.OS "linux"}}{{.Platform.OS}}/{{.Platform.Architecture}}{{end}}{{end}}')"
          if [[ "${arch}" != "linux/arm64" ]]; then
            echo "published image runtime platform ${arch}, expected linux/arm64" >&2
            exit 1
          fi
          final_from="$(awk 'toupper($1) == "FROM" { line=$0 } END { print line }' backend/Dockerfile)"
          if [[ ! "${final_from}" =~ ^FROM[[:space:]]+[^[:space:]]+@sha256:[a-f0-9]{64}([[:space:]]+AS[[:space:]]+[A-Za-z0-9._-]+)?$ ]]; then
            echo "backend base image must be digest pinned" >&2
            exit 1
          fi
          {
            echo "image=ghcr.io/aquilaxk/easysubway-backend@${digest}"
            echo "imageDigest=${digest}"
          } > release-artifacts/backend/identity.env
          printf '[{"RepoDigests":["ghcr.io/aquilaxk/easysubway-backend@%s"],"Id":"%s"}]\n' "${digest}" "${digest}" > release-artifacts/backend/image-inspect.json

      - name: Backend Release Image / Validate deployment dry-run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/backend
          EASYSUBWAY_BACKEND_IMAGE_TAG="${GITHUB_SHA}" docker compose --env-file .env.example -f infra/docker-compose.yml config --quiet
          EASYSUBWAY_BACKEND_IMAGE_TAG="${GITHUB_SHA}" docker compose --env-file .env.example -f infra/docker-compose.yml config > release-artifacts/backend/rendered-compose.yml
          test -f release-artifacts/backend/rendered-compose.yml
          test ! -L release-artifacts/backend/rendered-compose.yml
          grep -Fq "image: easysubway-backend:${GITHUB_SHA}" release-artifacts/backend/rendered-compose.yml

      - name: Backend Release Image / Collect release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/backend
          shopt -s nullglob
          boot_jar=(backend/build/libs/*.jar)
          if [[ "${#boot_jar[@]}" -ne 1 ]]; then
            echo "expected exactly one backend bootJar, found ${#boot_jar[@]}" >&2
            exit 1
          fi
          cp "${boot_jar[0]}" release-artifacts/backend/backend-boot.jar
          if [[ "${GITHUB_EVENT_NAME}" != "push" ]]; then
            docker image inspect easysubway-backend:${GITHUB_SHA} > release-artifacts/backend/image-inspect.json
          fi
          backend_artifact_sha256="$(sha256sum release-artifacts/backend/backend-boot.jar | awk '{print $1}')"
          {
            echo "commit=${GITHUB_SHA}"
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              cat release-artifacts/backend/identity.env
            else
              echo "image=easysubway-backend:${GITHUB_SHA}"
            fi
            echo "backendArtifactSha256=${backend_artifact_sha256}"
            echo "dockerfile=backend/Dockerfile"
            echo "compose=infra/docker-compose.yml"
          } > release-artifacts/backend/release-metadata.txt

      - name: Backend Release Image / Emit component manifest
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          image_digest="$(sed -nE 's/^imageDigest=(sha256:[a-f0-9]{64})$/\1/p' release-artifacts/backend/identity.env)"
          if [[ -z "${image_digest}" ]]; then
            echo "component manifest requires the published image digest" >&2
            exit 1
          fi
          node backend/tools/build-component-manifest.mjs \
            --repository "${GITHUB_REPOSITORY}" \
            --git-sha "${GITHUB_SHA}" \
            --image-digest "${image_digest}" \
            --contract-version 1.0.0 \
            --evidence release-artifacts/backend/release-metadata.txt \
            --issue-ref AquilaXk/easysubway#2697 \
            --output release-artifacts/backend/backend-component-manifest.json

      - name: Backend Release Image / Upload image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: easysubway-backend-release-${{ github.sha }}
          path: release-artifacts/backend
          if-no-files-found: error
          retention-days: 14

  rc-evidence-manifest:
    name: RC Evidence Manifest
    runs-on: ubuntu-latest
    needs:
      - changes
      - android-release
      - android-production-rc-release
      - backend-release
    permissions:
      actions: read
      contents: read
    if: ${{ always() && needs.backend-release.result == 'success' && ((needs.android-release.result == 'success' && needs.android-release.outputs.artifact_available == 'true') || needs.android-production-rc-release.result == 'success') }}

    steps:
      - name: RC Evidence Manifest / Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: RC Evidence Manifest / Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: RC Evidence Manifest / Download Android artifact
        if: ${{ needs.android-release.result == 'success' && needs.android-release.outputs.artifact_available == 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: easysubway-android-release-${{ github.sha }}
          path: release-artifacts/downloaded/android

      - name: RC Evidence Manifest / Download Android production RC artifact
        if: ${{ needs.android-production-rc-release.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: easysubway-android-production-rc-${{ github.sha }}
          path: release-artifacts/downloaded/android-production-rc

      - name: RC Evidence Manifest / Download backend artifact
        if: ${{ needs.backend-release.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: easysubway-backend-release-${{ github.sha }}
          path: release-artifacts/downloaded/backend

      - name: RC Evidence Manifest / Download production data pack artifact
        if: ${{ inputs.datapack_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: easysubway-datapacks-${{ github.sha }}
          path: release-artifacts/downloaded/datapack
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.datapack_run_id }}

      - name: RC Evidence Manifest / Download callback reconciliation evidence
        if: ${{ inputs.callback_reconciliation_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: datapack-callback-reconciliation-evidence-${{ github.sha }}
          path: release-artifacts/downloaded/callback-reconciliation
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.callback_reconciliation_run_id }}

      - name: RC Evidence Manifest / Restore production data pack validation environment
        if: ${{ inputs.datapack_run_id != '' }}
        shell: bash
        env:
          EASYSUBWAY_ENV_SECRET: ${{ secrets.EASYSUBWAY_ENV }}
        run: |
          set -euo pipefail
          if [[ -z "${EASYSUBWAY_ENV_SECRET}" ]]; then
            echo "EASYSUBWAY_ENV is required for production data pack signature validation" >&2
            exit 1
          fi
          rc_env_file="${RUNNER_TEMP}/easysubway-rc-evidence.env"
          umask 077
          printf '%s' "${EASYSUBWAY_ENV_SECRET}" > "${rc_env_file}"
          node tools/ci/validate-store-privacy-env.mjs \
            --env-file "${rc_env_file}" \
            --github-env "${GITHUB_ENV}" \
            --require-android-rc-production
          rm -f "${rc_env_file}"

      - name: RC Evidence Manifest / Select finalized production data pack
        if: ${{ inputs.datapack_run_id != '' }}
        run: |
          set -euo pipefail
          node tools/release/select-rc-datapack-artifact.mjs \
            --artifact-root release-artifacts/downloaded/datapack \
            --output-root release-artifacts/downloaded/datapack-selected

      - name: RC Evidence Manifest / Revalidate current production data pack
        if: ${{ inputs.datapack_run_id != '' }}
        run: |
          set -euo pipefail
          node tools/datapack/validate-remote-datapack-artifact.mjs \
            --manifest-url "${EASYSUBWAY_DATA_PACK_BASE_URL%/}/catalog/current.json" \
            --expected-manifest release-artifacts/downloaded/datapack-selected/current.json \
            --output "${RUNNER_TEMP}/rc-current-datapack-validation" \
            --require-production

      - name: RC Evidence Manifest / Generate manifest
        shell: bash
        env:
          ANDROID_RC_SIGNING_MODE: ${{ inputs.android_rc_signing_mode }}
          CALLBACK_RECONCILIATION_RUN_ID: ${{ inputs.callback_reconciliation_run_id }}
          DATAPACK_RUN_ID: ${{ inputs.datapack_run_id }}
          PLAY_UPLOAD: ${{ inputs.play_upload }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/rc
          bundled_data_manifest=apps/mobile/assets/datapacks/index.json
          data_pack_manifest=apps/mobile/assets/datapacks/index.json
          data_pack_artifact=apps/mobile/assets/datapacks/capital.sqlite.gz
          data_pack_fallback_artifact="${data_pack_artifact}"
          data_pack_release_decision=""
          source_snapshot_evidence="${data_pack_manifest}"
          release_sequence=0
          data_version=unpromoted
          if [[ "${ANDROID_RC_SIGNING_MODE}" == production-upload-key && -z "${DATAPACK_RUN_ID}" ]]; then
            echo "datapack_run_id is required for production RC identity" >&2
            exit 1
          fi
          if [[ -n "${DATAPACK_RUN_ID}" ]]; then
            data_pack_manifest=release-artifacts/downloaded/datapack-selected/current.json
            data_pack_artifact=release-artifacts/downloaded/datapack-selected/active.sqlite.gz
            data_pack_fallback_artifact=release-artifacts/downloaded/datapack-selected/fallback.sqlite.gz
            data_pack_release_decision=release-artifacts/downloaded/datapack-selected/release-decision.json
            source_snapshot_evidence="${data_pack_release_decision}"
            release_sequence="$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).releaseSequence' "${data_pack_manifest}")"
            data_version="$(node -p 'const manifest = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); manifest.dataVersion ?? manifest.version ?? manifest.date ?? manifest.activePack?.version ?? "unpromoted"' "${data_pack_manifest}")"
          fi
          generator_args=(
            --repo-root .
            --app-root apps/mobile
            --rc-evidence-contract release/product-gates/rc-evidence-manifest-contract.json
            --git-sha "${GITHUB_SHA}"
            --verify-github-sha true
            --data-pack-manifest "${data_pack_manifest}"
            --data-pack-artifact "${data_pack_artifact}"
            --data-pack-fallback-artifact "${data_pack_fallback_artifact}"
            --release-sequence "${release_sequence}"
            --evidence-root ".codex/evidence/release/rc-evidence-manifest/${GITHUB_SHA}/"
            --device local_android_emulator
            --android-version android-15-or-16
          )
          if [[ -n "${DATAPACK_RUN_ID}" ]]; then
            generator_args+=(
              --data-pack-release-decision "${data_pack_release_decision}"
              --require-production-data-pack-binding true
            )
          fi
          blocked_evidence_args=(
            --gate-status androidRcEvidence=BLOCKED_EXTERNAL
            --gate-status productionDatapack=BLOCKED_EXTERNAL
            --gate-status playGeneratedApkDeviceMatrix=BLOCKED_EXTERNAL
            --gate-status backendOperations=BLOCKED_EXTERNAL
            --gate-status androidReleaseQuality=BLOCKED_EXTERNAL
            --gate-status abusePenetrationRehearsal=BLOCKED_EXTERNAL
            --gate-status scopeCoverage=BLOCKED_EXTERNAL
            --gate-status strictArtifactValidation=BLOCKED_EXTERNAL
            --gate-status routeAccessibilityQuality=BLOCKED_EXTERNAL
            --gate-status appSchemaCompatibility=BLOCKED_EXTERNAL
            --gate-status stagedRollout=BLOCKED_EXTERNAL
            --gate-status publicClaims=BLOCKED_EXTERNAL
            --datapack-gate-status source_admission=BLOCKED_EXTERNAL
            --datapack-gate-status source_governance=BLOCKED_EXTERNAL
            --datapack-gate-status freshness_conditional_publish=BLOCKED_EXTERNAL
            --datapack-gate-status rollback_rescue=BLOCKED_EXTERNAL
            --datapack-gate-status device_performance=BLOCKED_EXTERNAL
          )
          if [[ -n "${CALLBACK_RECONCILIATION_RUN_ID}" ]]; then
            blocked_evidence_args+=(
              --datapack-gate-status callback_reconciliation=SATISFIED
              --datapack-gate-evidence callback_reconciliation=release-artifacts/downloaded/callback-reconciliation/callback-reconciliation-gate-evidence.json
            )
          else
            blocked_evidence_args+=(
              --datapack-gate-status callback_reconciliation=BLOCKED_EXTERNAL
            )
          fi
          android_artifact_source="none"
          aab_path=""
          if [[ -f release-artifacts/downloaded/android-production-rc/app-release.aab ]]; then
            aab_path=release-artifacts/downloaded/android-production-rc/app-release.aab
            generator_args+=(--android-release-metadata release-artifacts/downloaded/android-production-rc/release-metadata.txt)
            android_artifact_source="easysubway-android-production-rc-${GITHUB_SHA}"
          elif [[ -f release-artifacts/downloaded/android/app-release.aab ]]; then
            aab_path=release-artifacts/downloaded/android/app-release.aab
            generator_args+=(--android-release-metadata release-artifacts/downloaded/android/release-metadata.txt)
            android_artifact_source="easysubway-android-release-${GITHUB_SHA}"
          fi
          if [[ -z "${aab_path}" ]]; then
            echo "exactly one Android AAB is required for RC evidence" >&2
            exit 1
          fi
          generator_args+=(--aab "${aab_path}")
          if [[ ! -f release-artifacts/downloaded/backend/image-inspect.json ]]; then
            echo "backend image inspect is required for RC evidence" >&2
            exit 1
          fi
          generator_args+=(--backend-image-inspect release-artifacts/downloaded/backend/image-inspect.json)
          node tools/release/generate-rc-evidence-manifest.mjs \
            "${generator_args[@]}" \
            --phase CANDIDATE \
            --output release-artifacts/rc/candidate-context.json
          version_line="$(awk '/^version:/{print $2; exit}' apps/mobile/pubspec.yaml)"
          version_name="${version_line%%+*}"
          version_code="${version_line##*+}"
          contracts_bundle="${RUNNER_TEMP}/contracts.tar"
          component_output="${RUNNER_TEMP}/component-manifests-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git archive --format=tar HEAD contracts > "${RUNNER_TEMP}/contracts.tar"
          node tools/release/build-monorepo-component-manifests.mjs \
            --repository AquilaXk/easysubway \
            --git-sha "${GITHUB_SHA}" \
            --mobile-version-name "${version_name}" \
            --mobile-version-code "${version_code}" \
            --aab "${aab_path}" \
            --bundled-data-manifest "${bundled_data_manifest}" \
            --backend-image-inspect release-artifacts/downloaded/backend/image-inspect.json \
            --backend-evidence release-artifacts/downloaded/backend/release-metadata.txt \
            --data-version "${data_version}" \
            --data-release-sequence "${release_sequence}" \
            --data-manifest "${data_pack_manifest}" \
            --source-snapshot-evidence "${source_snapshot_evidence}" \
            --platform-environment ci \
            --platform-evidence release-artifacts/downloaded/backend/rendered-compose.yml \
            --contracts-version 1.0.0 \
            --contracts-bundle "${contracts_bundle}" \
            --issue-ref AquilaXk/easysubway#2693 \
            --output-dir "${component_output}"
          cp "${component_output}/mobile-component-manifest.json" release-artifacts/rc/mobile-component-manifest.json
          cp "${component_output}/backend-component-manifest.json" release-artifacts/rc/backend-component-manifest.json
          cp "${component_output}/data-component-manifest.json" release-artifacts/rc/data-component-manifest.json
          cp "${component_output}/platform-component-manifest.json" release-artifacts/rc/platform-component-manifest.json
          cp "${component_output}/contracts-identity.json" release-artifacts/rc/contracts-identity.json
          for manifest in release-artifacts/rc/{mobile,backend,data,platform}-component-manifest.json release-artifacts/rc/contracts-identity.json; do
            test -f "${manifest}"
            test ! -L "${manifest}"
          done
          if [[ -f release-artifacts/downloaded/backend/planner-canary-result.json ]]; then
            node tools/release/build-planner-success-evidence.mjs \
              --candidate-context release-artifacts/rc/candidate-context.json \
              --canary-result release-artifacts/downloaded/backend/planner-canary-result.json \
              --output release-artifacts/rc/planner-success-evidence.json
          fi
          # #1414 #2099 fragment. Mobile이 실제로 소비한 RC identity와 E1/E7/E8/E9 시나리오
          # 근거(tracked widget/contract test·request 직렬화 소스)를 같은 candidate-context로 emit한다.
          # planner step과 동일하게 입력 artifact 존재를 먼저 확인한다(verdict 단계는 이 파일이
          # 없어도 fail-closed로 처리하므로 이 job이 강제로 실패하지 않는다).
          if [[ -f release-artifacts/rc/candidate-context.json ]]; then
            node tools/release/build-mobile-consumption-evidence.mjs \
              --candidate-context release-artifacts/rc/candidate-context.json \
              --repo-root . \
              --output release-artifacts/rc/mobile-consumption-evidence.json
          fi
          # #1018 마지막 DoD의 #2056 fragment. Play Data Safety 폼(answerMatrix), 공개 개인정보
          # 처리방침, runtime 수집 inventory 세 tracked 원본의 machine-auditable 일치 판정을 같은
          # candidate-context RC identity에 결속해 emit한다. planner/mobile step과 동일하게 입력
          # artifact 존재를 먼저 확인하고, 불일치는 producer가 fail-closed로 BLOCKED 처리한다.
          if [[ -f release-artifacts/rc/candidate-context.json ]]; then
            node tools/release/build-privacy-consistency-evidence.mjs \
              --candidate-context release-artifacts/rc/candidate-context.json \
              --repo-root . \
              --output release-artifacts/rc/store-privacy-consistency-evidence.json
          fi
          if [[ "${android_artifact_source}" == easysubway-android-production-rc-* ]]; then
            node tools/ops/generate-operations-phase-a-summary.mjs \
              --rc-manifest release-artifacts/rc/candidate-context.json \
              --summary release-artifacts/rc/operations-phase-a-summary.json \
              --status-output release-artifacts/rc/operations-phase-a-status.txt
            IFS= read -r operations_status < release-artifacts/rc/operations-phase-a-status.txt
            if [[ "${operations_status}" == "SATISFIED" ]]; then
              node tools/ops/validate-operations-release-summary.mjs \
                --summary release-artifacts/rc/operations-phase-a-summary.json \
                --rc-manifest release-artifacts/rc/candidate-context.json \
                --require-pass
            elif [[ "${operations_status}" != "BLOCKED_EXTERNAL" ]]; then
              echo "unexpected operations Phase A status: ${operations_status}" >&2
              exit 1
            fi
          else
            operations_status=BLOCKED_EXTERNAL
            printf 'BLOCKED_EXTERNAL\n' > release-artifacts/rc/operations-phase-a-status.txt
          fi
          operations_evidence_args=(--evidence-status "post_launch_operations=${operations_status}")
          operations_gate_args=(--gate-status "postLaunchOperations=${operations_status}")
          final_readiness_args=()
          if [[ "${PLAY_UPLOAD}" == internal && "${operations_status}" != "SATISFIED" ]]; then
            echo "Play internal upload requires SATISFIED operations Phase A evidence" >&2
            exit 1
          fi
          if [[ "${PLAY_UPLOAD}" == internal ]]; then
            final_readiness_args+=(--require-pre-play-upload-ready true)
          fi
          if [[ "${operations_status}" == "SATISFIED" ]]; then
            operations_evidence_args+=(--evidence-path post_launch_operations=release-artifacts/rc/operations-phase-a-summary.json)
            operations_gate_args+=(--gate-evidence postLaunchOperations=release-artifacts/rc/operations-phase-a-summary.json)
          fi
          node tools/release/generate-rc-evidence-manifest.mjs \
            "${generator_args[@]}" \
            "${blocked_evidence_args[@]}" \
            "${operations_evidence_args[@]}" \
            "${operations_gate_args[@]}" \
            "${final_readiness_args[@]}" \
            --phase FINAL \
            --candidate-context release-artifacts/rc/candidate-context.json \
            --output release-artifacts/rc/final-readiness.json \
            --mobile-component-manifest release-artifacts/rc/mobile-component-manifest.json \
            --backend-component-manifest release-artifacts/rc/backend-component-manifest.json \
            --data-component-manifest release-artifacts/rc/data-component-manifest.json \
            --platform-component-manifest release-artifacts/rc/platform-component-manifest.json \
            --contracts-identity release-artifacts/rc/contracts-identity.json \
            --system-release-output release-artifacts/rc/system-release-manifest.json \
            --product-release-id "android-v${version_name}+${version_code}"
          node tools/release/validate-system-release-manifest.mjs \
            --manifest release-artifacts/rc/system-release-manifest.json
          # #1414 route/datapack 통합 판정. same-RC identity로 E1~E9 matrix를 결합한다.
          # planner(#2098)/mobile(#2099) evidence는 이 job에서 candidate-context 기준으로 생성해
          # 바로 연결한다. route-map(#2068) evidence는 아직 identity+provenance+integrationScenarios
          # 스키마를 emit하는 tracked producer가 없어(route-map-android-evidence는 별개의 프레임/메모리
          # 성능 evidence 스키마) --route-map-evidence를 연결하지 않는다 — 날조 대신 verdict의 E1을
          # PENDING으로 남긴다.
          verdict_args=(
            --rc-manifest release-artifacts/rc/final-readiness.json
          )
          if [[ -f release-artifacts/rc/planner-success-evidence.json ]]; then
            verdict_args+=(--planner-evidence release-artifacts/rc/planner-success-evidence.json)
          fi
          if [[ -f release-artifacts/rc/mobile-consumption-evidence.json ]]; then
            verdict_args+=(--mobile-evidence release-artifacts/rc/mobile-consumption-evidence.json)
          fi
          node tools/release/generate-route-integration-verdict.mjs \
            "${verdict_args[@]}" \
            --output release-artifacts/rc/route-integration-verdict.json
          cp release/product-gates/post-launch-operations-review-gate.json release-artifacts/rc/post-launch-operations-review-gate.json
          cp release/product-gates/support-incident-response-gate.json release-artifacts/rc/support-incident-response-gate.json
          cp release/product-gates/operations-observability-gate.json release-artifacts/rc/operations-observability-gate.json
          cp release/product-gates/rc-evidence-manifest-contract.json release-artifacts/rc/rc-evidence-manifest-contract.json
          {
            echo "commit=${GITHUB_SHA}"
            echo "manifest=final-readiness.json"
            echo "android_artifact_source=${android_artifact_source}"
            echo "backend_artifact_source=easysubway-backend-release-${GITHUB_SHA}"
          } > release-artifacts/rc/release-metadata.txt

      - name: RC Evidence Manifest / Upload manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: easysubway-rc-evidence-manifest-${{ github.sha }}
          path: release-artifacts/rc
          if-no-files-found: error
          retention-days: 90

  notify-slack-release-result:
    name: Slack / Release artifacts result
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - changes
      - android-release
      - android-production-rc-release
      - play-internal-upload
      - backend-release
      - rc-evidence-manifest
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        (needs.changes.result == 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
      }}
    env:
      SLACK_RELEASE_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_WEBHOOK_URL }}
    steps:
      - name: Slack / Skip missing release webhook
        if: ${{ env.SLACK_RELEASE_WEBHOOK_URL == '' }}
        run: echo "::notice title=Slack notification::SLACK_RELEASE_WEBHOOK_URL is not configured."

      - name: Slack / Notify release artifacts result
        if: ${{ env.SLACK_RELEASE_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c
        with:
          webhook: ${{ env.SLACK_RELEASE_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "EasySubway release artifacts ${{ contains(needs.*.result, 'failure') && 'failure' || contains(needs.*.result, 'cancelled') && 'cancelled' || 'success' }}"
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    *EasySubway Release Artifacts ${{ contains(needs.*.result, 'failure') && '실패' || contains(needs.*.result, 'cancelled') && '취소' || '성공' }}*
                    • repo: `${{ github.repository }}`
                    • ref: `${{ github.ref_name }}`
                    • actor: `${{ github.actor }}`
                    • run: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions 열기>
