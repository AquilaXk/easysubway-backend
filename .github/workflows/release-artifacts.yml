name: Backend Immutable Image Producer

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-preflight:
    name: Backend image preflight (no push)
    # workflow_dispatch는 아래 발행 job이 담당하므로 preflight는 PR에서만 돈다.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Verify deterministic Journey contract bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backend/build/journey-contract-preflight-a backend/build/journey-contract-preflight-b
          node backend/tools/build-journey-contract-bundle.mjs \
            --producer-sha "${GITHUB_SHA}" \
            --output backend/build/journey-contract-preflight-a/journey-v3-contract-bundle-v2.json
          node backend/tools/build-journey-contract-bundle.mjs \
            --producer-sha "${GITHUB_SHA}" \
            --output backend/build/journey-contract-preflight-b/journey-v3-contract-bundle-v2.json
          cmp --silent backend/build/journey-contract-preflight-a/journey-v3-contract-bundle-v2.json backend/build/journey-contract-preflight-b/journey-v3-contract-bundle-v2.json

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # v1 datapack은 Journey OCI artifact의 fallback이 아니라 별도 backend resource다.
      - name: Stage pinned contracts
        shell: bash
        run: |
          artifact_url="$(jq -er '.artifactUrl | select(. == "https://raw.githubusercontent.com/AquilaXk/easysubway/6c29b55e6cbdb1713522cb4f766d9754728d5fc8/contracts/bundles/backend-contracts-v1.0.0.json")' backend/contracts.lock.json)"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --output "${RUNNER_TEMP}/backend-contracts.json" \
            "${artifact_url}"
          node backend/tools/stage-contracts.mjs \
            --lock backend/contracts.lock.json \
            --input "${RUNNER_TEMP}/backend-contracts.json" \
            --output backend/build/contracts-staging

      - name: Stage pinned Journey contracts
        shell: bash
        run: |
          set -euo pipefail
          journey_contract_subject="$(jq -er '.artifact | if type == "object" and (.repository | type == "string") and (.manifestDigest | type == "string" and test("^sha256:[a-f0-9]{64}$")) then "\(.repository)@\(.manifestDigest)" else error("invalid Journey contract OCI subject") end' backend/journey-contracts.lock.json)"
          [[ "${journey_contract_subject}" =~ ^ghcr\.io/aquilaxk/easysubway-backend-contracts@sha256:[a-f0-9]{64}$ ]]
          oras pull "${journey_contract_subject}" --output "${RUNNER_TEMP}/journey-contract-pull"
          node backend/tools/stage-journey-contracts.mjs \
            --lock backend/journey-contracts.lock.json \
            --input "${RUNNER_TEMP}/journey-contract-pull/journey-v3-contract-bundle-v2.json" \
            --output backend/build/journey-contracts-staging

      - name: Package backend
        working-directory: backend
        env:
          EASYSUBWAY_CONTRACTS_BUNDLE: ${{ runner.temp }}/backend-contracts.json
        run: ./gradlew bootJar --no-daemon

      - name: Build image without push
        shell: bash
        run: |
          set -euo pipefail
          final_from="$(awk 'toupper($1) == "FROM" { line=$0 } END { print line }' backend/Dockerfile)"
          if [[ ! "${final_from}" =~ ^FROM[[:space:]]+[^[:space:]]+@sha256:[a-f0-9]{64}([[:space:]]+AS[[:space:]]+[A-Za-z0-9._-]+)?$ ]]; then
            echo "backend final base image must be digest pinned" >&2
            exit 1
          fi
          docker buildx create --driver docker-container --use
          docker buildx build --load --platform linux/arm64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "easysubway-backend:preflight-${GITHUB_SHA}" \
            backend
          docker image inspect "easysubway-backend:preflight-${GITHUB_SHA}"

      - name: Verify source-free non-root read-only image
        shell: bash
        run: |
          set -euo pipefail
          image="easysubway-backend:preflight-${GITHUB_SHA}"
          declared_volumes="$(docker image inspect --format '{{json .Config.Volumes}}' "${image}")"
          if [[ "${declared_volumes}" != "null" ]]; then
            echo "backend runtime image must not declare volumes" >&2
            exit 1
          fi
          container="$(docker create "${image}")"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          rootfs_listing="${RUNNER_TEMP}/backend-image-rootfs.txt"
          docker export "${container}" | tar -tf - > "${rootfs_listing}"
          source_or_build_pattern='(^|/)(gradle|gradlew(\.bat)?|javac|gradle-wrapper\.jar)$|(^|/)gradle/wrapper/|\.(java|kt|kts|groovy|gradle)$'
          if grep -Eiq "\.class$|${source_or_build_pattern}" "${rootfs_listing}"; then
            echo "backend runtime image contains source or a build tool" >&2
            exit 1
          elif [[ "$?" -ne 1 ]]; then
            echo "backend runtime image source/build-tool scan failed" >&2
            exit 1
          fi
          app_archive="${RUNNER_TEMP}/backend-image-app.jar"
          archive_listing="${RUNNER_TEMP}/backend-image-app-archive.txt"
          archive_dir="${RUNNER_TEMP}/backend-image-app-archive"
          nested_archives="${RUNNER_TEMP}/backend-image-nested-archives.txt"
          nested_archive_listing="${RUNNER_TEMP}/backend-image-nested-archive.txt"
          nested_archive_member_listing="${RUNNER_TEMP}/backend-image-nested-archive-member.txt"
          filtered_nested_archive_listing="${RUNNER_TEMP}/backend-image-filtered-nested-archive.txt"
          docker cp "${container}:/app/app.jar" "${app_archive}"
          jar tf "${app_archive}" > "${archive_listing}"
          mkdir -p "${archive_dir}"
          (cd "${archive_dir}" && jar xf "${app_archive}")
          h2_archive="${archive_dir}/BOOT-INF/lib/h2-2.3.232.jar"
          if ! printf '%s  %s\n' '8dae62d22db8982c3dcb3826edb9c727c5d302063a67eef7d63d82de401f07d3' "${h2_archive}" | sha256sum --check --status; then
            echo "backend runtime H2 archive digest mismatch" >&2
            exit 1
          fi
          find "${archive_dir}" -type f -iname '*.jar' -print0 > "${nested_archives}"
          : > "${nested_archive_listing}"
          while IFS= read -r -d '' nested_archive; do
            jar tf "${nested_archive}" > "${nested_archive_member_listing}"
            while IFS= read -r nested_member; do
              printf '%s:/%s\n' "${nested_archive#"${archive_dir}/"}" "${nested_member}" >> "${nested_archive_listing}"
            done < "${nested_archive_member_listing}"
          done < "${nested_archives}"
          if grep -Eiq "${source_or_build_pattern}|\.(zip|war|ear|jmod)$" "${archive_listing}"; then
            echo "backend runtime application archive contains source or build files" >&2
            exit 1
          elif [[ "$?" -ne 1 ]]; then
            echo "backend runtime application archive scan failed" >&2
            exit 1
          fi
          if grep -Fvx 'BOOT-INF/lib/h2-2.3.232.jar:/org/h2/util/data.zip' "${nested_archive_listing}" > "${filtered_nested_archive_listing}"; then
            :
          elif [[ "$?" -ne 1 ]]; then
            echo "backend runtime dependency archive allowlist filter failed" >&2
            exit 1
          fi
          if archive_violation="$(grep -Eim1 "${source_or_build_pattern}|\.(jar|zip|war|ear|jmod)$" "${filtered_nested_archive_listing}")"; then
            printf 'backend runtime dependency archive contains prohibited entry: %q\n' "${archive_violation}" >&2
            exit 1
          elif [[ "$?" -ne 1 ]]; then
            echo "backend runtime dependency archive scan failed" >&2
            exit 1
          fi
          docker rm "${container}" >/dev/null
          trap - EXIT
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001 \
            --tmpfs /opt/easysubway/logs:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001 \
            --entrypoint /bin/sh \
            "${image}" -ceu '
              test "$(id -u)" = "10001"
              test "$(id -g)" = "10001"
              test "$(find /app -mindepth 1 -maxdepth 1 -printf "%f\n")" = "app.jar"
              test "$(stat -c "%u:%g" /app/app.jar)" = "10001:10001"
              ! touch /app/app.jar
              test -r /opt/easysubway/native/libsqlitejdbc.so
              test ! -w /opt/easysubway/native/libsqlitejdbc.so
              test -r /opt/easysubway/native/libzstd-jni-1.5.7-13.so
              test ! -w /opt/easysubway/native/libzstd-jni-1.5.7-13.so
              touch /tmp/runtime-write-check
              touch /opt/easysubway/logs/runtime-write-check
              java -XX:-UsePerfData \
                -Dorg.sqlite.lib.path=/opt/easysubway/native \
                -Dorg.sqlite.lib.name=libsqlitejdbc.so \
                -DZstdNativePath=/opt/easysubway/native/libzstd-jni-1.5.7-13.so \
                -Dloader.main=com.easysubway.journey.bundle.RouteBundleSqliteRuntimeCompiler \
                -cp /app/app.jar org.springframework.boot.loader.launch.PropertiesLauncher
              test -z "$(find /tmp -mindepth 1 -maxdepth 1 -name "sqlite-*" -print -quit)"
              test -z "$(find /tmp -mindepth 1 -maxdepth 1 -name "libzstd-jni-*" -print -quit)"
              test ! -e /var/run/docker.sock
            '

  backend-release:
    name: Backend immutable arm64 image
    # GITHUB_TOKEN 병합은 main push 이벤트를 만들지 못한다. Automerge Queue가 main
    # head에 producer 실행이 없으면 이 워크플로를 dispatch하므로, dispatch에서도
    # 이미지를 발행해야 배포 체인이 이어진다. ref 검증은 그대로 유지한다.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.sha != '' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Build exact Journey contract bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=backend/build/journey-contract-release/journey-v3-contract-bundle-v2.json
          mkdir -p "$(dirname "${bundle}")" release-artifacts/backend
          node backend/tools/build-journey-contract-bundle.mjs \
            --producer-sha "${GITHUB_SHA}" \
            --output "${bundle}"
          cp "${bundle}" release-artifacts/backend/journey-v3-contract-bundle-v2.json
          cmp --silent "${bundle}" release-artifacts/backend/journey-v3-contract-bundle-v2.json

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # v1 datapack은 Journey OCI artifact의 fallback이 아니라 별도 backend resource다.
      - name: Stage pinned contracts
        shell: bash
        run: |
          set -euo pipefail
          artifact_url="$(jq -er '.artifactUrl | select(. == "https://raw.githubusercontent.com/AquilaXk/easysubway/6c29b55e6cbdb1713522cb4f766d9754728d5fc8/contracts/bundles/backend-contracts-v1.0.0.json")' backend/contracts.lock.json)"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            --output "${RUNNER_TEMP}/backend-contracts.json" \
            "${artifact_url}"
          node backend/tools/stage-contracts.mjs \
            --lock backend/contracts.lock.json \
            --input "${RUNNER_TEMP}/backend-contracts.json" \
            --output backend/build/contracts-staging

      - name: Stage pinned Journey contracts
        shell: bash
        run: |
          set -euo pipefail
          journey_contract_subject="$(jq -er '.artifact | if type == "object" and (.repository | type == "string") and (.manifestDigest | type == "string" and test("^sha256:[a-f0-9]{64}$")) then "\(.repository)@\(.manifestDigest)" else error("invalid Journey contract OCI subject") end' backend/journey-contracts.lock.json)"
          [[ "${journey_contract_subject}" =~ ^ghcr\.io/aquilaxk/easysubway-backend-contracts@sha256:[a-f0-9]{64}$ ]]
          oras pull "${journey_contract_subject}" --output "${RUNNER_TEMP}/journey-contract-pull"
          node backend/tools/stage-journey-contracts.mjs \
            --lock backend/journey-contracts.lock.json \
            --input "${RUNNER_TEMP}/journey-contract-pull/journey-v3-contract-bundle-v2.json" \
            --output backend/build/journey-contracts-staging

      - name: Package backend
        working-directory: backend
        env:
          EASYSUBWAY_CONTRACTS_BUNDLE: ${{ runner.temp }}/backend-contracts.json
        run: ./gradlew bootJar --no-daemon

      - name: Validate exact main revision and final base image
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          final_from="$(awk 'toupper($1) == "FROM" { line=$0 } END { print line }' backend/Dockerfile)"
          if [[ ! "${final_from}" =~ ^FROM[[:space:]]+[^[:space:]]+@sha256:[a-f0-9]{64}([[:space:]]+AS[[:space:]]+[A-Za-z0-9._-]+)?$ ]]; then
            echo "backend final base image must be digest pinned" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR with ORAS
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GITHUB_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish immutable arm64 image
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/aquilaxk/easysubway-backend"
          metadata_file="${RUNNER_TEMP}/backend-build-metadata.json"
          mkdir -p release-artifacts/backend
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/arm64 --sbom=true --provenance=mode=max \
            --metadata-file "${metadata_file}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --output "type=image,name=${repository},push-by-digest=true,name-canonical=true,push=true" \
            backend
          digest="$(sed -nE 's/.*"containerimage\.digest"[[:space:]]*:[[:space:]]*"(sha256:[a-f0-9]{64})".*/\1/p' "${metadata_file}")"
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Buildx metadata lacks an immutable image digest" >&2
            exit 1
          fi
          subject="${repository}@${digest}"
          docker buildx imagetools inspect --raw "${subject}" > release-artifacts/backend/image-index.json
          docker buildx imagetools inspect "${subject}" --format '{{json .}}' > release-artifacts/backend/image-inspect.json
          docker buildx imagetools inspect "${subject}" --format '{{json .SBOM.SPDX}}' > release-artifacts/backend/sbom.json
          docker buildx imagetools inspect "${subject}" --format '{{json .Provenance.SLSA}}' > release-artifacts/backend/provenance.json
          if [[ ! -s release-artifacts/backend/sbom.json || "$(<release-artifacts/backend/sbom.json)" == "null" ]] \
            || ! grep -Fq '"spdxVersion"' release-artifacts/backend/sbom.json; then
            echo "SPDX SBOM payload is absent or invalid for ${subject}" >&2
            exit 1
          fi
          if [[ ! -s release-artifacts/backend/provenance.json || "$(<release-artifacts/backend/provenance.json)" == "null" ]] \
            || ! grep -Fq '"buildType"' release-artifacts/backend/provenance.json; then
            echo "SLSA provenance payload is absent or invalid for ${subject}" >&2
            exit 1
          fi
          if ! grep -Fq "${digest}" release-artifacts/backend/image-inspect.json; then
            echo "image inspection evidence does not bind ${subject}" >&2
            exit 1
          fi
          platform="$(docker buildx imagetools inspect "${subject}" --format '{{range .Manifest.Manifests}}{{if eq .Platform.OS "linux"}}{{.Platform.OS}}/{{.Platform.Architecture}}{{end}}{{end}}')"
          if [[ "${platform}" != "linux/arm64" ]]; then
            echo "published image runtime platform ${platform}, expected linux/arm64" >&2
            exit 1
          fi
          {
            echo "image=${subject}"
            echo "imageDigest=${digest}"
            echo "gitSha=${GITHUB_SHA}"
            echo "platform=${platform}"
            echo "sbom=sbom.json"
            echo "provenance=provenance.json"
          } > release-artifacts/backend/release-metadata.txt

      - name: Publish and verify Journey contract OCI artifact
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/aquilaxk/easysubway-backend-contracts"
          tag="git-${GITHUB_SHA}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_type="application/vnd.easysubway.journey.contract-bundle.v2"
          layer_type="application/vnd.easysubway.journey.contract-bundle.v2+json"
          bundle=release-artifacts/backend/journey-v3-contract-bundle-v2.json
          descriptor=release-artifacts/backend/journey-v3-contract-bundle-v2-descriptor.json
          raw_manifest=release-artifacts/backend/journey-v3-contract-bundle-v2-manifest.json
          receipt=release-artifacts/backend/journey-v3-contract-bundle-v2-receipt.json
          created="$(git show -s --format=%cI "${GITHUB_SHA}")"
          (
            cd release-artifacts/backend
            oras push "${repository}:${tag}" \
              --artifact-type "${artifact_type}" \
              --annotation "org.opencontainers.image.created=${created}" \
              "journey-v3-contract-bundle-v2.json:${layer_type}"
          )
          oras manifest fetch "${repository}:${tag}" --output "${raw_manifest}" --format json > "${descriptor}"
          node backend/tools/build-contract-publication-receipt.mjs \
            --bundle "${bundle}" \
            --descriptor "${descriptor}" \
            --manifest "${raw_manifest}" \
            --repository "${repository}" \
            --git-sha "${GITHUB_SHA}" \
            --output "${receipt}"
          manifest_digest="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).artifact.manifestDigest)' "${receipt}")"
          [[ "${manifest_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          pull_root="${RUNNER_TEMP}/journey-contract-pull"
          mkdir -p "${pull_root}"
          oras pull "${repository}@${manifest_digest}" --output "${pull_root}"
          cmp --silent "${bundle}" "${pull_root}/journey-v3-contract-bundle-v2.json"

      - name: Build immutable release evidence ledger
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-artifacts/backend
            for evidence in release-metadata.txt image-index.json image-inspect.json sbom.json provenance.json; do
              sha256sum "${evidence}"
            done
          ) > release-artifacts/backend/evidence-ledger.sha256
          (
            cd release-artifacts/backend
            for evidence in journey-v3-contract-bundle-v2.json journey-v3-contract-bundle-v2-descriptor.json journey-v3-contract-bundle-v2-manifest.json journey-v3-contract-bundle-v2-receipt.json; do
              sha256sum "${evidence}"
            done
          ) >> release-artifacts/backend/evidence-ledger.sha256

      - name: Emit and verify component manifest
        shell: bash
        run: |
          set -euo pipefail
          image_digest="$(sed -nE 's/^imageDigest=(sha256:[a-f0-9]{64})$/\1/p' release-artifacts/backend/release-metadata.txt)"
          [[ -n "${image_digest}" ]]
          node backend/tools/build-component-manifest.mjs \
            --repository AquilaXk/easysubway-backend \
            --git-sha "${GITHUB_SHA}" \
            --image-digest "${image_digest}" \
            --contract-version 1.0.0 \
            --evidence release-artifacts/backend/evidence-ledger.sha256 \
            --issue-ref AquilaXk/easysubway-backend#17 \
            --output release-artifacts/backend/backend-component-manifest.json
          evidence_sha256="$(sha256sum release-artifacts/backend/evidence-ledger.sha256 | awk '{print $1}')"
          grep -Eq '"evidenceSha256"[[:space:]]*:[[:space:]]*"'"${evidence_sha256}"'"' release-artifacts/backend/backend-component-manifest.json
          test ! -L release-artifacts/backend/backend-component-manifest.json

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: easysubway-backend-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifacts/backend
          if-no-files-found: error
          retention-days: 14
