      properties:
        timetableArtifactId:
          type: string
          minLength: 1
        timetableSnapshotSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        canonicalStationVersion:
          type: string
          minLength: 1
        canonicalStationSetSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        sourceLineageSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        evidenceHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        freshUntil:
          type: string
          format: date-time
    JourneySearchSuccess:
      type: object
      additionalProperties: false
      required:
        - contractVersion
        - requestId
        - queryId
        - calculatedAt
        - validUntil
        - effectiveDepartureTime
        - serviceDate
        - serviceTimezone
        - serviceDayCutoff
        - sourceIdentity
        - requestPolicy
        - journeys
      properties:
        contractVersion:
          type: string
          enum: [JOURNEY_SEARCH_V3]
        requestId:
          type: string
          pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        queryId:
          type: string
          minLength: 1
        calculatedAt:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        effectiveDepartureTime:
          type: string
          format: date-time
        serviceDate:
          type: string
          format: date
        serviceTimezone:
          type: string
          enum: [Asia/Seoul]
        serviceDayCutoff:
          type: string
          enum: ["03:00"]
        sourceIdentity:
          $ref: "#/components/schemas/JourneySourceIdentity"
        requestPolicy:
          $ref: "#/components/schemas/JourneyRequestPolicy"
        journeys:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/Journey"
    JourneyProfileSuccess:
      type: object
      additionalProperties: false
      required:
        - contractVersion
        - requestId
        - queryId
        - calculatedAt
        - validUntil
        - temporalQuery
        - serviceDays
        - sourceIdentity
        - algorithmIdentity
        - frontierPolicyIdentity
        - journeys
        - profileSegments
        - summary
      properties:
        contractVersion:
          type: string
          enum: [JOURNEY_PROFILE_V1]
        requestId:
          type: string
          pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        queryId:
          type: string
          minLength: 1
        calculatedAt:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        temporalQuery:
          $ref: "#/components/schemas/JourneyTemporalQuery"
        serviceDays:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/JourneyProfileServiceDayIdentity"
        sourceIdentity:
          $ref: "#/components/schemas/JourneyProfileSourceIdentity"
        algorithmIdentity:
          $ref: "#/components/schemas/JourneyAlgorithmIdentity"
        frontierPolicyIdentity:
          $ref: "#/components/schemas/JourneyFrontierPolicyIdentity"
        journeys:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/JourneyProfileJourneyCandidate"
        profileSegments:
          type: array
          minItems: 1
          description: >-
            Adjacent segments are compressed; a boundary exists only when the applicable
            journey-id set changes. Every journeyId must resolve in this response.
          items:
            $ref: "#/components/schemas/JourneyProfileSegment"
        summary:
          $ref: "#/components/schemas/JourneyProfileSummary"
    JourneyProfileServiceDayIdentity:
      type: object
      additionalProperties: false
      required: [serviceDate, serviceTimezone, serviceDayCutoff]
      properties:
        serviceDate:
          type: string
          format: date
        serviceTimezone:
          type: string
          enum: [Asia/Seoul]
        serviceDayCutoff:
          type: string
          enum: ["03:00"]
    JourneyProfileSourceIdentity:
      type: object
      additionalProperties: false
      required:
        - routeBundleId
        - routeBundleGeneration
        - routeBundleSha256
        - timetableSnapshotId
        - accessibilitySnapshotId
        - realtimeSnapshotId
      properties:
        routeBundleId:
          type: string
          minLength: 1
        routeBundleGeneration:
          type: string
          minLength: 1
        routeBundleSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        timetableSnapshotId:
          type: string
          minLength: 1
        accessibilitySnapshotId:
          type: string
          minLength: 1
        realtimeSnapshotId:
          type: string
          minLength: 1
          nullable: true
    JourneyAlgorithmIdentity:
      type: object
      additionalProperties: false
      required: [algorithmSuiteId, queryAlgorithmId, semanticVersion]
      properties:
        algorithmSuiteId:
          type: string
          minLength: 1
        queryAlgorithmId:
          type: string
          minLength: 1
        semanticVersion:
          type: string
          minLength: 1
    JourneyFrontierPolicyIdentity:
      type: object
      additionalProperties: false
      required: [frontierPolicyId, semanticVersion]
      properties:
        frontierPolicyId:
          type: string
          minLength: 1
        semanticVersion:
          type: string
          minLength: 1
    JourneyProfileJourneyCandidate:
      type: object
      additionalProperties: false
      description: >-
        readyAt is when the passenger is ready to begin the requested journey; journeyStartTime
        is entry-transition start; firstBoardingTime is the first ride departure;
        arrivalAtPlatform is the final ride arrival; arrivalAtDestination is verified EXIT completion.
      required:
        - journeyId
        - readyAt
        - journeyStartTime
        - firstBoardingTime
        - arrivalAtPlatform
        - arrivalAtDestination
        - objectiveTags
        - journey
      properties:
        journeyId:
          type: string
          minLength: 1
        readyAt:
          type: string
          format: date-time
        journeyStartTime:
          type: string
          format: date-time
        firstBoardingTime:
          type: string
          format: date-time
        arrivalAtPlatform:
          type: string
          format: date-time
        arrivalAtDestination:
          type: string
          format: date-time
        objectiveTags:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [FASTEST_ARRIVAL, LATEST_DEPARTURE, FEWEST_TRANSFERS, LOWEST_WALKING_BURDEN, BEST_ACCESSIBILITY, SAFEST_CONNECTION]
        journey:
          $ref: "#/components/schemas/Journey"
    JourneyProfileSegment:
      type: object
      additionalProperties: false
      required: [readyFromInclusive, readyUntilExclusive, journeyIds]
      properties:
        readyFromInclusive:
          type: string
          format: date-time
        readyUntilExclusive:
          type: string
          format: date-time
        journeyIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
