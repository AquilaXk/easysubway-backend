openapi: 3.0.3
info:
  title: EasySubway Journey V3 API
  version: 3.0.0
paths:
  /api/v3/journeys/session:
    post:
      operationId: issueJourneySession
      summary: Issue an Android Play Integrity backed Journey session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneySessionRequest"
      responses:
        "200":
          description: Short-lived Journey route session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneySessionResponse"
        "400":
          description: Invalid or malformed Journey session request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                invalidSessionRequest:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: INVALID_JOURNEY_SESSION_REQUEST
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
        "403":
          description: Play Integrity verdict or request binding rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                attestationRejected:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTE_SESSION_ATTESTATION_REJECTED
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
        "503":
          description: Play Integrity provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                attestationUnavailable:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTE_SESSION_ATTESTATION_UNAVAILABLE
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
  /api/v3/journeys/search:
    post:
      operationId: searchJourneys
      summary: Search server-authoritative subway journeys
      security:
        - JourneySessionBearer: []
      x-easysubway-time-policy-contract:
        TIMETABLE_REQUIRED: realtime-fields-null
        REALTIME_REQUIRED: realtime-fields-required-non-null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneySearchRequest"
      responses:
        "200":
          description: Ordered verified Journey candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneySearchSuccess"
        "400":
          description: Invalid or unsupported Journey request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                invalidRequest:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: INVALID_JOURNEY_REQUEST
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
        "404":
          description: Canonical station identity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                stationNotFound:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: STATION_NOT_FOUND
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
        "422":
          description: No route satisfies the exact request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                routeNotFound:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTE_NOT_FOUND
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
                accessibilityUnsatisfied:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ACCESSIBILITY_CONSTRAINT_UNSATISFIED
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
        "503":
          description: Required fresh and compatible route data or service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                routeBundleUnavailable:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTING_BUNDLE_UNAVAILABLE
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
                routeBundleStale:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTING_BUNDLE_STALE
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
                timetableUnavailable:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: TIMETABLE_UNAVAILABLE
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
                timetableStale:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: TIMETABLE_STALE
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
                realtimeUnavailable:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: REALTIME_REQUIRED_UNAVAILABLE
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
                routingIdentityMismatch:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTING_IDENTITY_MISMATCH
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
                routeServiceUnavailable:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTE_SERVICE_UNAVAILABLE
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
        "504":
          description: Journey computation exceeded the server deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                searchTimeout:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: JOURNEY_SEARCH_TIMEOUT
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
        "401":
          description: Missing, expired, or invalid Journey route session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                sessionRequired:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTE_SESSION_REQUIRED
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
        "429":
          description: Journey request rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                rateLimited:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTE_RATE_LIMITED
                    retryable: false
                    occurredAt: "2026-08-02T23:58:00.482+09:00"
  /api/v3/journeys/profile:
    post:
      operationId: profileJourneys
      summary: Search identity-bound temporal Journey profiles
      description: >-
        Returns only compressed profile breakpoints. A destination arrival is complete
        only after the verified EXIT transition. LAST_CONNECTION is the latest feasible
        O/D departure under the request walking, accessibility, transfer, and active
        service-day constraints.
      security:
        - JourneySessionBearer: []
      x-easysubway-cache-control: private, no-store
      x-easysubway-time-policy-contract:
        TIMETABLE_REQUIRED: realtime-fields-null
        REALTIME_REQUIRED: realtime-fields-required-non-null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneyProfileRequest"
      responses:
        "200":
          description: Compressed verified temporal Journey profile
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: ["private, no-store"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyProfileSuccess"
        "400":
          description: Invalid or unbounded temporal query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                invalidTemporalQuery:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: INVALID_TEMPORAL_QUERY
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
                temporalWindowTooLarge:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: TEMPORAL_WINDOW_TOO_LARGE
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
        "404":
          description: Canonical station identity not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                stationNotFound:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: STATION_NOT_FOUND
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
        "422":
          description: The bounded temporal query cannot yield a verified journey profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                noService:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: NO_SERVICE_IN_DEPARTURE_WINDOW
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
                deadlineMiss:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: NO_ROUTE_ARRIVING_BY_DEADLINE
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
                noLastConnection:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: NO_LAST_CONNECTION
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
                realtimeNotApplicable:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: REALTIME_NOT_APPLICABLE_TO_TEMPORAL_QUERY
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
                queryTooComplex:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: TEMPORAL_QUERY_TOO_COMPLEX
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
        "503":
          description: Required profile data, identity, frontier capacity, or service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                realtimeUnavailable:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: REALTIME_REQUIRED_UNAVAILABLE
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
                routeBundleUnavailable:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTING_BUNDLE_UNAVAILABLE
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
                routeBundleStale:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTING_BUNDLE_STALE
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
                identityMismatch:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTING_IDENTITY_MISMATCH
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
                frontierCapacityExceeded:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: RAPTOR_FRONTIER_CAPACITY_EXCEEDED
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
        "504":
          description: Journey profile computation exceeded the server deadline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                profileTimeout:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: JOURNEY_PROFILE_TIMEOUT
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
        "401":
          description: Missing, expired, or invalid Journey route session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                sessionRequired:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTE_SESSION_REQUIRED
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
        "429":
          description: Journey profile request rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                rateLimited:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTE_RATE_LIMITED
                    retryable: false
                    occurredAt: "2026-09-01T08:00:00+09:00"
  /api/v3/station-timetables/search:
    post:
      operationId: searchStationTimetables
      summary: Read server-authoritative station timetable departures
      security:
        - JourneySessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StationTimetableSearchRequest"
      responses:
        "200":
          description: Ordered departures from the active timetable snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationTimetableSearchSuccess"
        "400":
          description: Invalid station timetable request or selector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                invalidRequest:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: INVALID_JOURNEY_REQUEST
                    retryable: false
                    occurredAt: "2026-08-25T09:00:00+09:00"
        "404":
          description: Canonical station-line or active timetable coverage is absent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                stationLineNotFound:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: STATION_LINE_NOT_FOUND
                    retryable: false
                    occurredAt: "2026-08-25T09:00:00+09:00"
                timetableNotCovered:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: TIMETABLE_NOT_COVERED
                    retryable: false
                    occurredAt: "2026-08-25T09:00:00+09:00"
        "503":
          description: Active timetable snapshot is unavailable, stale, or incompatible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                unavailable:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: TIMETABLE_UNAVAILABLE
                    retryable: false
                    occurredAt: "2026-08-25T09:00:00+09:00"
                stale:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: TIMETABLE_STALE
                    retryable: false
                    occurredAt: "2026-08-25T09:00:00+09:00"
                identityMismatch:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: TIMETABLE_IDENTITY_MISMATCH
                    retryable: false
                    occurredAt: "2026-08-25T09:00:00+09:00"
        "401":
          description: Missing, expired, or invalid Journey route session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                sessionRequired:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTE_SESSION_REQUIRED
                    retryable: false
                    occurredAt: "2026-08-25T09:00:00+09:00"
        "429":
          description: Journey request rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyError"
              examples:
                rateLimited:
                  value:
                    contractVersion: JOURNEY_ERROR_V1
                    requestId: 01K1Y000000000000000000000
                    code: ROUTE_RATE_LIMITED
                    retryable: false
                    occurredAt: "2026-08-25T09:00:00+09:00"
components:
  securitySchemes:
    JourneySessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-route-session
  schemas:
    JourneySessionRequest:
      type: object
      additionalProperties: false
      required: [integrityToken, clientNonce]
      properties:
        integrityToken:
          type: string
          minLength: 1
          maxLength: 16384
        clientNonce:
          type: string
          pattern: "^[A-Za-z0-9_-]{22}$"
    JourneySessionResponse:
      type: object
      additionalProperties: false
      required: [token, scope, issuedAt, expiresAt]
      properties:
        token:
          type: string
          minLength: 1
        scope:
          type: string
          enum: [journey:v3]
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    JourneySearchRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - originStationId
        - destinationStationId
        - departure
        - timePolicy
        - walkingPace
        - mobilityProfile
        - constraintMode
        - maxTransfers
        - alternativeCount
      properties:
        requestId:
          type: string
          pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        originStationId:
          type: string
          minLength: 1
        destinationStationId:
          type: string
          minLength: 1
        departure:
          $ref: "#/components/schemas/JourneyDeparture"
        timePolicy:
          $ref: "#/components/schemas/TimePolicy"
        walkingPace:
          $ref: "#/components/schemas/WalkingPace"
        mobilityProfile:
          $ref: "#/components/schemas/MobilityProfile"
        constraintMode:
          $ref: "#/components/schemas/ConstraintMode"
        maxTransfers:
          type: integer
          minimum: 0
          maximum: 3
        alternativeCount:
          type: integer
          minimum: 1
          maximum: 3
      not:
        required: [mobilityProfile, constraintMode]
        properties:
          mobilityProfile:
            enum: [NO_STAIRS]
          constraintMode:
            enum: [NONE]
    JourneyDeparture:
      oneOf:
        - $ref: "#/components/schemas/JourneyDepartureNow"
        - $ref: "#/components/schemas/JourneyDepartureScheduled"
    JourneyDepartureNow:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [NOW]
    JourneyDepartureScheduled:
      type: object
      additionalProperties: false
      description: Retained wire alias for the canonical DEPART_AT product mode.
      required: [mode, requestedAt]
      properties:
        mode:
          type: string
          enum: [SCHEDULED]
        requestedAt:
          type: string
          format: date-time
    TimePolicy:
      type: string
      enum: [TIMETABLE_REQUIRED, REALTIME_REQUIRED]
    WalkingPace:
      type: string
      enum: [SLOW, STANDARD, FAST]
    MobilityProfile:
      type: string
      enum: [STANDARD, SLOW, NO_STAIRS, STEP_FREE]
    ConstraintMode:
      type: string
      enum: [NONE, REQUIRE_STEP_FREE]
    JourneyProfileRequest:
      type: object
      additionalProperties: false
      description: >-
        Closed JSON input; implementations reject duplicate keys, unknown fields, and
        trailing tokens before temporal semantic validation.
      required:
        - requestId
        - originStationId
        - destinationStationId
        - temporalQuery
        - timePolicy
        - walkingPace
        - mobilityProfile
        - constraintMode
        - maxTransfers
        - alternativeCount
      properties:
        requestId:
          type: string
          pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
        originStationId:
          type: string
          minLength: 1
        destinationStationId:
          type: string
          minLength: 1
        temporalQuery:
          $ref: "#/components/schemas/JourneyTemporalQuery"
        timePolicy:
          $ref: "#/components/schemas/TimePolicy"
        walkingPace:
          $ref: "#/components/schemas/WalkingPace"
        mobilityProfile:
          $ref: "#/components/schemas/MobilityProfile"
        constraintMode:
          $ref: "#/components/schemas/ConstraintMode"
        maxTransfers:
          type: integer
          minimum: 0
          maximum: 3
        alternativeCount:
          type: integer
          minimum: 1
          maximum: 3
      not:
        required: [mobilityProfile, constraintMode]
        properties:
          mobilityProfile:
            enum: [NO_STAIRS]
          constraintMode:
            enum: [NONE]
    JourneyTemporalQuery:
      oneOf:
        - $ref: "#/components/schemas/JourneyDepartBetweenQuery"
        - $ref: "#/components/schemas/JourneyArriveByQuery"
        - $ref: "#/components/schemas/JourneyLastConnectionQuery"
    JourneyDepartBetweenQuery:
      type: object
      additionalProperties: false
      description: >-
        A bounded ordered ready-time interval. The server rejects equal or reversed
        bounds and intervals above the active temporal resource-policy limit.
      required: [kind, earliestReadyAt, latestReadyAt]
      properties:
        kind:
          type: string
          enum: [DEPART_BETWEEN]
        earliestReadyAt:
          type: string
          format: date-time
        latestReadyAt:
          type: string
          format: date-time
    JourneyArriveByQuery:
      type: object
      additionalProperties: false
      description: >-
        A bounded ordered ready-time and destination-arrival deadline interval. The
        deadline applies after the verified destination EXIT transition completes.
      required: [kind, earliestReadyAt, arrivalDeadline]
      properties:
        kind:
          type: string
          enum: [ARRIVE_BY]
        earliestReadyAt:
          type: string
          format: date-time
        arrivalDeadline:
          type: string
          format: date-time
    JourneyLastConnectionQuery:
      type: object
      additionalProperties: false
      description: >-
        Finds the latest feasible O/D departure for the requested active service day;
        service-day cutoff is a day boundary, not a synthesized final-event anchor.
      required: [kind, serviceDate]
      properties:
        kind:
          type: string
          enum: [LAST_CONNECTION]
        serviceDate:
          type: string
          format: date
    StationTimetableSearchRequest:
      type: object
      additionalProperties: false
      required: [stationId, lineId, selector]
      properties:
        stationId:
          type: string
          minLength: 1
        lineId:
          type: string
          minLength: 1
        selector:
          $ref: "#/components/schemas/StationTimetableSelector"
    StationTimetableSelector:
      oneOf:
        - $ref: "#/components/schemas/StationTimetableServiceDateSelector"
        - $ref: "#/components/schemas/StationTimetableDayTypeSelector"
        - $ref: "#/components/schemas/StationTimetableNextDeparturesSelector"
    StationTimetableServiceDateSelector:
      type: object
      additionalProperties: false
      required: [kind, serviceDate]
      properties:
        kind:
          type: string
          enum: [SERVICE_DATE]
        serviceDate:
          type: string
          format: date
    StationTimetableDayTypeSelector:
      type: object
      additionalProperties: false
      required: [kind, dayType, referenceDate]
      properties:
        kind:
          type: string
          enum: [DAY_TYPE]
        dayType:
          type: string
          enum: [WEEKDAY, SATURDAY, SUNDAY_HOLIDAY]
        referenceDate:
          type: string
          format: date
    StationTimetableNextDeparturesSelector:
      type: object
      additionalProperties: false
      required: [kind, asOf, horizonDays]
      properties:
        kind:
          type: string
          enum: [NEXT_DEPARTURES]
        asOf:
          type: string
