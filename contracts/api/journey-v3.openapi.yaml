          type: string
          format: date-time
        primaryJourneyId:
          type: string
          minLength: 1
        recommendedJourneyIds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            minLength: 1
    JourneyLastConnectionProfileSummary:
