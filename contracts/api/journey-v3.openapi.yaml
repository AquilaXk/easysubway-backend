          minimum: 0
          maximum: 3
        walkingDistanceMeters:
          type: integer
          minimum: 0
        timeSource:
          type: string
          enum: [TIMETABLE, REALTIME]
        accessibility:
          $ref: "#/components/schemas/JourneyAccessibility"
