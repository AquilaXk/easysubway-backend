          type: string
          minLength: 1
        saferAlternativeJourneyIds:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            minLength: 1
        recommendedJourneyIds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            minLength: 1
    JourneySourceIdentity:
