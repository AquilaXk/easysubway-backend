openapi: 3.0.3
info:
  title: EasySubway report API
  version: 1.0.0
  description: |
    시설 제보를 접수하고 처리 상태를 확인하는 공개 API입니다.

    호출 흐름은 둘입니다.

    - **익명 접수**: 접수 요청에 `clientSubmissionId`를 실어 보냅니다. 접수 응답으로
      받은 `receiptToken`을 이후 상태 조회·확인 완료 요청의
      `X-Easysubway-Report-Receipt-Token` 헤더에 실어야 합니다.
    - **로그인 사용자 접수**: 인증 자격 증명으로 접수하고, 본인 제보는 헤더 없이 조회합니다.

    사진은 선택입니다. 첨부할 때는 업로드 의도를 먼저 만들어(`POST /api/v1/report-uploads`)
    받은 주소로 사진을 올린 뒤, 접수 요청에 `photoObjectKey` 계열 값을 실어 보냅니다.

    제보 경로 전체에 호출량 제한이 있습니다. 한도를 넘으면 본문 없이 `429`를 반환합니다.
# 기본은 인증 없이 호출한다. 소유자 흐름도 지원하는 operation만 개별로 다시 선언한다.
security: []
paths:
  /api/v1/report-uploads:
    post:
      summary: 사진 업로드 의도 생성
      description: |
        사진을 올릴 주소와 함께 보내야 할 헤더를 발급합니다. 여기서 신고한
        `photoContentType`·`photoSha256`·`photoSizeBytes`는 실제 업로드와 제보 접수에서
        모두 다시 대조하므로, 세 값이 실제 파일과 정확히 일치해야 합니다.

        발급된 주소는 유효 기간이 있고(`expiresAt`), 만료되면 다시 발급받아야 합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportUploadIntentRequest"
      responses:
        "201":
          description: 업로드 주소와 필수 헤더를 발급했습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportUploadIntentEnvelope"
        "400":
          $ref: "#/components/responses/InvalidReportRequest"
        "429":
          $ref: "#/components/responses/ReportRateLimited"
  /api/v1/report-uploads/{uploadId}:
    put:
      summary: 사진 본문 업로드 (로컬·개발 환경 전용)
      description: |
        업로드 의도로 발급받은 주소에 사진 본문을 올립니다.

        **이 엔드포인트는 `prod`·`staging`·`release`·`prod-like` 프로파일에서 차단됩니다.**
        해당 환경에서는 요청이 `400`으로 거부되므로, 발급 응답의 `uploadUrl`이 가리키는
        저장소 주소를 그대로 사용해야 합니다.

        본문 길이는 1바이트 이상 921,600바이트 이하여야 하고, `Content-Type`과
        `x-easysubway-upload-sha256`·`x-easysubway-upload-size`는 업로드 의도를 만들 때
        신고한 값과 정확히 일치해야 합니다. 하나라도 어긋나면 `400`입니다.
      parameters:
        - name: uploadId
          in: path
          required: true
          description: 업로드 의도 발급 응답의 `uploadUrl` 마지막 경로 조각
          schema:
            type: string
            minLength: 1
        - name: x-easysubway-upload-sha256
          in: header
          required: true
          description: 업로드 의도에 신고한 사진의 SHA-256 (소문자 hex 64자)
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: x-easysubway-upload-size
          in: header
          required: true
          description: 업로드 의도에 신고한 사진의 바이트 크기
          schema:
            type: string
            pattern: "^[0-9]+$"
      requestBody:
        required: true
        description: |
          사진 본문입니다. `Content-Type`은 업로드 의도에 신고한 형식과 같아야 합니다.
        content:
          image/jpeg:
            schema:
              $ref: "#/components/schemas/ReportPhotoBinary"
          image/png:
            schema:
              $ref: "#/components/schemas/ReportPhotoBinary"
          image/webp:
            schema:
              $ref: "#/components/schemas/ReportPhotoBinary"
      responses:
        "204":
          description: 사진을 저장했습니다.
        "400":
          $ref: "#/components/responses/InvalidReportRequest"
        "429":
          $ref: "#/components/responses/ReportRateLimited"
  /api/v1/reports:
    post:
      summary: 시설 제보 접수
      description: |
        시설 제보를 접수합니다. 익명은 `clientSubmissionId`가 있어야 하고, 없으면
        인증 자격 증명이 있어야 합니다. 둘 다 없으면 `401`입니다.

        `clientSubmissionId`가 이미 접수된 값이면 새로 만들지 않고 기존 제보를 그대로
        돌려줍니다. 이때 `receiptToken`은 다시 발급되지 않습니다.

        사진을 첨부하려면 `photoObjectKey`·`photoFileName`·`photoContentType`·
        `photoSha256`·`photoSizeBytes`를 함께 보냅니다. 이 다섯 값은 업로드 의도에 신고한
        값 및 실제로 올라간 파일과 모두 대조합니다.
      security:
        - {}
        - reportOwnerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: 제보를 접수했습니다. 익명 접수는 `receiptToken`이 함께 옵니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCreatedEnvelope"
        "400":
          $ref: "#/components/responses/InvalidReportRequest"
        "401":
          $ref: "#/components/responses/ReportUnauthorized"
        "404":
          $ref: "#/components/responses/ReportTargetNotFound"
        "429":
          $ref: "#/components/responses/ReportRateLimited"
  /api/v1/reports/{reportId}:
    get:
      summary: 제보 처리 상태 조회
      description: |
        익명 접수분은 `X-Easysubway-Report-Receipt-Token` 헤더가 반드시 있어야 합니다.
        로그인 사용자는 헤더 없이 본인 제보를 조회합니다.

        헤더도 인증 자격 증명도 없으면 제보의 존재 여부를 노출하지 않기 위해 `404`를 반환합니다.
      security:
        - {}
        - reportOwnerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Easysubway-Report-Receipt-Token
          in: header
          required: false
          description: |
            접수 응답의 `receiptToken`입니다. **익명 접수분 조회에는 반드시 있어야 합니다.**
            로그인 사용자의 본인 제보 조회에서는 생략합니다.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: 제보 처리 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportStatusEnvelope"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        "429":
          $ref: "#/components/responses/ReportRateLimited"
  /api/v1/reports/{reportId}/confirm:
    post:
      summary: 제보 처리 결과 확인 완료
      description: |
        처리가 끝난 제보의 결과를 사용자가 확인했다고 표시합니다. 아직 처리가 끝나지 않은
        제보에 호출하면 `400`입니다.

        익명 접수분은 `X-Easysubway-Report-Receipt-Token` 헤더가 반드시 있어야 하고,
        헤더도 인증 자격 증명도 없으면 `401`입니다.
      security:
        - {}
        - reportOwnerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Easysubway-Report-Receipt-Token
          in: header
          required: false
          description: |
            접수 응답의 `receiptToken`입니다. **익명 접수분 확인 완료에는 반드시 있어야 합니다.**
            로그인 사용자의 본인 제보 확인 완료에서는 생략합니다.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: 확인 완료 처리된 제보 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportStatusEnvelope"
        "400":
          $ref: "#/components/responses/InvalidReportRequest"
        "401":
          $ref: "#/components/responses/ReportUnauthorized"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        "429":
          $ref: "#/components/responses/ReportRateLimited"
components:
  securitySchemes:
    reportOwnerAuth:
      type: http
      scheme: basic
      description: |
        로그인 사용자의 제보 소유자 흐름입니다. 자격 증명이 있으면 본인 제보를
        receipt token 없이 접수·조회·확인 완료할 수 있습니다.
  responses:
    InvalidReportRequest:
      description: |
        요청 값이 올바르지 않습니다. 검증 실패는 오류 봉투를 반환하고,
        요청 본문을 읽지 못한 경우 `code`는 `UNREADABLE_BODY`입니다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            invalidRequest:
              value:
                success: false
                message: 사진 첨부 정보를 확인해야 합니다.
                code: INVALID_REQUEST
                correlationId: 0f1d2c3b-4a59-4687-9d21-8f6a5b4c3d2e
            unreadableBody:
              value:
                success: false
                message: 요청 본문을 확인해야 합니다.
                code: UNREADABLE_BODY
                correlationId: 0f1d2c3b-4a59-4687-9d21-8f6a5b4c3d2e
    ReportUnauthorized:
      description: |
        익명 흐름의 식별자(`clientSubmissionId` 또는 receipt token 헤더)도, 인증 자격 증명도
        없습니다. 본문 없이 상태 코드만 반환합니다.
    ReportTargetNotFound:
      description: 제보 대상 역이나 시설을 찾을 수 없습니다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: 역 정보를 찾을 수 없습니다.
            code: RESOURCE_NOT_FOUND
            correlationId: 0f1d2c3b-4a59-4687-9d21-8f6a5b4c3d2e
    ReportNotFound:
      description: |
        제보를 찾을 수 없거나 조회 권한이 없습니다. 제보의 존재 여부를 노출하지 않기 위해
        두 경우를 같은 응답으로 돌려줍니다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            success: false
            message: 신고 정보를 찾을 수 없습니다.
            code: RESOURCE_NOT_FOUND
            correlationId: 0f1d2c3b-4a59-4687-9d21-8f6a5b4c3d2e
    ReportRateLimited:
      description: 호출량 제한을 넘었습니다. 본문 없이 상태 코드만 반환합니다.
  schemas:
    ApiResponseEnvelope:
      description: |
        모든 응답이 공유하는 봉투입니다. 값이 없는 필드는 직렬화에서 빠지므로
        성공 응답에는 `message`·`code`·`correlationId`가, 실패 응답에는 `data`가 없습니다.
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        data:
          description: 성공 응답 본문
        message:
          type: string
        code:
          type: string
        correlationId:
          type: string
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
        - type: object
          required: [success, message, code, correlationId]
          properties:
            success:
              type: boolean
              enum: [false]
            message:
              type: string
            code:
              type: string
              enum:
                - INVALID_REQUEST
                - UNREADABLE_BODY
                - RESOURCE_NOT_FOUND
            correlationId:
              type: string
    ReportUploadIntentEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              $ref: "#/components/schemas/ReportUploadIntent"
    ReportCreatedEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              $ref: "#/components/schemas/CreatedReport"
    ReportStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiResponseEnvelope"
        - type: object
          required: [success, data]
          properties:
            success:
              type: boolean
              enum: [true]
            data:
              $ref: "#/components/schemas/ReportStatusView"
    ReportPhotoBinary:
      type: string
      format: binary
      description: 사진 본문. 1바이트 이상 921,600바이트 이하여야 합니다.
    PhotoContentType:
      type: string
      description: |
        허용 형식입니다. **아래 소문자 표기를 그대로 보내야 합니다.**

        대소문자 처리는 경로마다 다릅니다. 업로드 의도 생성과 사진 본문 업로드는 앞뒤 공백을
        제거하고 소문자로 맞춰 받지만, 제보 접수의 `photoObjectKey` 경로는 저장된 형식과
        대소문자까지 그대로 비교합니다. 그래서 `IMAGE/PNG`로 업로드 의도를 만들면 업로드까지는
        통과하고 접수에서 `400`이 됩니다. 소문자 표기는 모든 경로에서 동작합니다.

        media type 파라미터는 붙이지 마십시오. `image/png; charset=utf-8`은 업로드 의도
        생성에서 `400`으로 거부됩니다.
      enum:
        - image/jpeg
        - image/png
        - image/webp
    ClientSubmissionId:
      type: string
      description: |
        클라이언트가 만드는 제출 식별자입니다. 같은 값으로 다시 접수하면 중복 접수 대신
        기존 제보를 돌려주므로 재시도 안전성의 근거가 됩니다.
      pattern: "^[A-Za-z0-9_-]+$"
      minLength: 1
      maxLength: 120
    PhotoSha256:
      type: string
      description: 사진의 SHA-256 (소문자 hex 64자)
      pattern: "^[0-9a-f]{64}$"
    PhotoSizeBytes:
      type: integer
      format: int64
      description: 사진의 바이트 크기
      minimum: 1
      maximum: 921600
    ReportType:
      type: string
      enum:
        - BROKEN
        - UNDER_CONSTRUCTION
        - CLOSED
        - ROUTE_BLOCKED
        - ELEVATOR_UNAVAILABLE
        - STAIRS_PRESENT
        - ETA_INACCURATE
        - TRANSFER_IMPOSSIBLE
        - LOCATION_WRONG
        - INFORMATION_WRONG
        - RECOVERED
    ReportStatus:
      type: string
      enum:
        - SUBMITTED
        - DUPLICATE
        - UNDER_REVIEW
        - ACCEPTED
        - REJECTED
        - RESOLVED
    ReportUploadIntentRequest:
      type: object
      required:
        - clientSubmissionId
        - photoContentType
        - photoSha256
        - photoSizeBytes
      properties:
        clientSubmissionId:
          $ref: "#/components/schemas/ClientSubmissionId"
        photoContentType:
          $ref: "#/components/schemas/PhotoContentType"
        photoSha256:
          $ref: "#/components/schemas/PhotoSha256"
        photoSizeBytes:
          $ref: "#/components/schemas/PhotoSizeBytes"
        photoFileName:
          type: string
          description: |
            이 요청에서는 사용하지 않습니다. 제보 접수(`POST /api/v1/reports`)에서는
            사진을 첨부할 때 필요하므로 클라이언트가 값을 들고 있어야 합니다.
    ReportUploadIntent:
      type: object
      additionalProperties: false
      required:
        - objectKey
        - uploadUrl
        - uploadMethod
        - uploadHeaders
        - expiresAt
      properties:
        objectKey:
          type: string
          description: 제보 접수 요청의 `photoObjectKey`로 그대로 넣어야 하는 값
        uploadUrl:
          type: string
          description: 사진 본문을 올릴 주소
        uploadMethod:
          type: string
          description: 사진 본문을 올릴 때 사용할 HTTP method
        uploadHeaders:
          type: object
          description: 사진 본문을 올릴 때 그대로 실어야 하는 헤더
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: 이 업로드 주소가 만료되는 시각 (UTC)
    CreateReportRequest:
      type: object
      description: |
        `stationId`·`facilityId`·`reportType`은 항상 필요합니다. `description`은 선택입니다.

        익명 접수는 `clientSubmissionId`가 있어야 하고, 없으면 인증 자격 증명이 필요합니다.
      required:
        - stationId
        - facilityId
        - reportType
      properties:
        stationId:
          type: string
          description: 제보 대상 역 식별자. 운영 중인 역이어야 합니다.
          minLength: 1
        facilityId:
          type: string
          description: 제보 대상 시설 식별자. `stationId`에 속한 시설이어야 합니다.
          minLength: 1
        reportType:
          $ref: "#/components/schemas/ReportType"
        description:
          type: string
          description: 제보 내용. 선택 항목입니다.
          maxLength: 1000
        clientSubmissionId:
          $ref: "#/components/schemas/ClientSubmissionId"
        photoObjectKey:
          type: string
          description: |
            업로드 의도 응답의 `objectKey`입니다. 사진을 첨부할 때는 이 값과 함께
            `photoFileName`·`photoContentType`·`photoSha256`·`photoSizeBytes`를 모두 보내야 합니다.
        photoFileName:
          type: string
          description: 사진 파일 이름. `photoObjectKey`를 보낼 때 필요합니다.
        photoContentType:
          $ref: "#/components/schemas/PhotoContentType"
        photoSha256:
          $ref: "#/components/schemas/PhotoSha256"
        photoSizeBytes:
          $ref: "#/components/schemas/PhotoSizeBytes"
        photoDataBase64:
          type: string
          description: |
            사진 본문을 base64로 직접 실어 보내는 경로입니다. **인증 자격 증명이 있는
            호출자에게만 동작하며**, 익명 접수 요청에서는 값이 버려집니다. 이때
            `photoFileName`·`photoContentType`만 남아 첨부가 불완전해지므로 `400`이 됩니다.

            이 경로의 존치 여부는 아직 확정되지 않았습니다(이슈 #27). 결정이 나면
            이 항목의 서술이 바뀌거나 삭제됩니다. 새 연동에서는
            `photoObjectKey` 경로를 사용하십시오.
        latitude:
          type: number
          description: 제보 위치 위도. 선택 항목입니다.
        longitude:
          type: number
