<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>관리자 로그인</title>
	<link rel="icon" type="image/png" th:href="@{/images/admin-app-icon.png}" href="/images/admin-app-icon.png">
	<link rel="stylesheet" th:href="@{/css/admin-v3.css}">
</head>
<body class="admin-v3">
<main class="login-screen">
	<form class="login-card" method="post" th:action="@{/admin/login}">
		<div class="login-brand">
			<img th:src="@{/images/admin-app-icon.png}" src="/images/admin-app-icon.png" alt="">
			<strong>쉬운 지하철 관리자</strong>
			<span class="login-console-badge">관리자 콘솔</span>
		</div>
		<h1>관리자 로그인</h1>
		<p class="login-subtitle">안전한 운영을 위해 관리자 계정으로 로그인해 주세요</p>
		<input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
		<div class="login-field">
			<label for="username">아이디</label>
			<input id="username" name="username" autocomplete="username" required placeholder="관리자 아이디 입력">
		</div>
		<div class="login-field">
			<label for="password">비밀번호</label>
			<input id="password" name="password" type="password" autocomplete="current-password" required placeholder="비밀번호 입력">
		</div>
		<label class="login-remember" for="remember-me">
			<input id="remember-me" name="remember-me" type="checkbox">
			<span>로그인 유지</span>
		</label>
		<button class="login-submit primary" type="submit">로그인</button>
		<div class="login-note"
		     role="alert"
		     th:if="${loginNotice == T(com.easysubway.common.security.LoginNotice).RETRY_WARNING}">아이디 또는 비밀번호를 확인하고 다시 시도해 주세요.</div>
		<div class="login-footer">
			<span class="login-security-notice">EasySubway Platform · 종단간 암호화 세션</span>
		</div>
	</form>
</main>
</body>
</html>
