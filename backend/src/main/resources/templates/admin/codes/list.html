<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
	<title>공통코드</title>
	<link rel="stylesheet" th:href="@{/css/admin-v3.css}">
</head>
<body class="admin-v3">
<a th:replace="~{admin/fragments/shell :: skipLink}"></a>
<div class="admin-shell">
<div th:replace="~{admin/fragments/shell :: sidebar('a-codes')}"></div>
<main class="admin-main">
	<div th:replace="~{admin/fragments/shell :: topbar}"></div>
	<div th:replace="~{admin/fragments/shell :: contentStart}"></div>
	<header class="admin-page-head">
		<div>
			<h1>공통코드</h1>
			<p>운영자가 반복 선택하는 사유와 상태만 관리합니다.</p>
		</div>
	</header>

	<section class="admin-panel">
		<h2>그룹</h2>
		<form class="table-toolbar" method="get" th:action="@{/admin/codes/page}"
		      role="search" aria-label="공통코드 그룹 조회">
			<select id="code-group-filter" name="groupCode" aria-label="그룹 필터">
				<option th:each="group : ${groups}"
				        th:value="${group.groupCode}"
				        th:selected="${group.groupCode == selectedGroup}"
				        th:text="${group.displayName}">신고 반려 사유</option>
			</select>
			<button type="submit" class="outline">조회</button>
			<a class="admin-btn plain" th:href="@{/admin/codes/page}">초기화</a>
		</form>
	</section>

	<section class="admin-panel">
		<h2>코드 목록</h2>
		<div class="admin-table-scroll" tabindex="0" role="group"
		     aria-label="가로로 스크롤 가능한 데이터 표">
		<table>
			<thead>
			<tr>
				<th scope="col">코드</th>
				<th scope="col">이름</th>
				<th scope="col">설명</th>
				<th scope="col">정렬</th>
				<th scope="col">상태</th>
				<th scope="col">관리</th>
			</tr>
			</thead>
			<tbody>
			<tr th:if="${codes.isEmpty()}">
				<td class="empty" colspan="6">
					<div th:replace="~{admin/fragments/empty-state :: panel('등록된 코드가 없습니다.', '선택한 그룹에 코드가 없습니다. 아래에서 코드를 추가하세요.')}"></div>
				</td>
			</tr>
			<tr th:each="code : ${codes}">
				<td th:text="${code.code}">DUPLICATE</td>
				<td th:text="${code.displayName}">중복 제보</td>
				<td th:text="${code.description}">설명</td>
				<td th:text="${code.sortOrder}">10</td>
				<td th:text="${code.enabledLabel}">선택 가능</td>
				<td>
					<form th:if="${code.enabled and !code.requiredIncidentCode}" th:action="@{'/admin/codes/' + ${code.groupCode} + '/' + ${code.code} + '/disable'}" method="post">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<input type="hidden" name="commandToken" th:value="${commandTokens.next()}">
						<details class="admin-action-confirm">
							<summary class="danger">비활성화…</summary>
							<p class="meta" th:text="|코드 ${code.code}을(를) 비활성화할까요? 이 작업은 되돌리기 어렵습니다.|">확인</p>
							<button type="submit" class="danger">비활성화 실행</button>
						</details>
					</form>
				</td>
			</tr>
			</tbody>
		</table>
		</div>
		<div th:replace="~{admin/fragments/pagination :: pager('공통코드 목록 페이지', ${page}, ${paginationLinks})}"></div>
	</section>

	<section class="admin-panel">
		<h2>코드 추가·수정</h2>
		<form class="admin-form" method="post" th:action="@{/admin/codes}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<input type="hidden" name="commandToken" th:value="${commandTokens.next()}">
			<input type="hidden" name="groupCode" th:value="${selectedGroup}">
			<label>코드 <input name="code" required></label>
			<label>이름 <input name="displayName" required></label>
			<label>설명 <input name="description"></label>
			<label>정렬 <input name="sortOrder" type="number" min="0" value="0"></label>
			<label><input name="enabled" type="checkbox" value="true" checked> 신규 선택 가능</label>
			<button type="submit" class="primary">저장</button>
		</form>
	</section>
</main>
</div>
<th:block th:replace="~{admin/fragments/shell :: scripts}"></th:block>
</body>
</html>
