<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
	<title>엘리베이터 가동 상태 확인 기록</title>
	<link rel="stylesheet" th:href="@{/css/admin-v3.css}">
</head>
<body class="admin-v3">
<a th:replace="~{admin/fragments/shell :: skipLink}"></a>
<div class="admin-shell">
<div th:replace="~{admin/fragments/shell :: sidebar('a-reports')}"></div>
<main class="admin-main">
	<div th:replace="~{admin/fragments/shell :: topbar}"></div>
	<div th:replace="~{admin/fragments/shell :: contentStart}"></div>
	<div th:replace="~{admin/fragments/shell :: breadcrumb('제보·품질·확인', '제보 확인 대기열', '/admin/reports/page', '엘리베이터 가동 상태 확인 기록')}"></div>
	<header class="admin-page-head">
		<div>
			<h1>엘리베이터 가동 상태 확인 기록</h1>
		</div>
		<div class="admin-actions">
			<a class="admin-btn plain" th:href="@{/admin/reports/page}">제보 확인 대기열로</a>
		</div>
	</header>
	<output th:replace="~{admin/fragments/shell :: flash}"></output>
	<div class="alert failure" role="alert" th:if="${errorMessage != null}">
		<strong>기록하지 않았습니다</strong>
		<p th:text="${errorMessage}">오류 안내</p>
	</div>

	<section class="admin-panel">
		<h2>확인 결과 기록</h2>
		<p class="meta">확인한 상태는 공식 원천이 같은 값을 계속 보내는 동안 유지되고, 공식 원천 값이 바뀌면 그 값으로 바뀝니다.</p>
		<form th:action="@{/admin/reports/elevator-status/page/verify}" method="post" th:if="${catalogAvailable}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<input type="hidden" name="commandToken" th:value="${commandTokens.next()}">
			<label>
				엘리베이터
				<select name="facilityId" required>
					<option value="">엘리베이터를 고르세요</option>
					<option th:each="option : ${facilityOptions}"
					        th:value="${option.value}"
					        th:selected="${option.value == verificationForm.facilityId}"
					        th:text="${option.label}">가역 엘리베이터 1번 출입구 (smrt-elev:0201:2:1번 출입구)</option>
				</select>
			</label>
			<fieldset>
				<legend>확인한 상태</legend>
				<label th:each="option : ${stateOptions}">
					<input type="radio" name="state" required
					       th:value="${option.value}"
					       th:checked="${option.value == verificationForm.state}">
					<span th:text="${option.label}">가동</span>
				</label>
			</fieldset>
			<button class="primary" type="submit">확인 상태 기록</button>
		</form>
	</section>
</main>
</div>
<th:block th:replace="~{admin/fragments/shell :: scripts}"></th:block>
</body>
</html>
