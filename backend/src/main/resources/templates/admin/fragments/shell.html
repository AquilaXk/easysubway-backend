<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="admin-sidebar" th:fragment="sidebar(active)" aria-label="통합 관리자 화면">
	<div class="admin-brand">
		<div>
			<strong>쉬운 지하철</strong>
			<span>통합 관리자</span>
		</div>
	</div>
	<div class="admin-nav-group" th:each="group : ${adminProgramGroups}">
		<p th:text="${group.label}">메뉴 그룹</p>
		<a th:each="program : ${group.programs}"
		   th:classappend="${active == program.id} ? ' is-active'"
		   th:href="@{${program.path}}"
		   th:text="${program.label}">메뉴</a>
	</div>
</nav>
<a th:fragment="skipLink" class="skip-link" href="#admin-content">본문으로 건너뛰기</a>
<div th:fragment="topbar" class="admin-topbar">
	<div class="admin-topbar-row" aria-label="관리자 실행 환경">
		<div class="admin-topbar-meta">
			<span class="admin-env-badge"
			      th:classappend="${' is-' + (adminShell != null ? adminShell.environmentTone : 'development')}"
			      th:text="${adminShell != null ? adminShell.environmentLabel : 'DEV'}">DEV</span>
			<span>관리자 <strong th:text="${adminShell != null ? adminShell.username : 'anonymous'}">admin</strong></span>
			<span>권한 <strong th:text="${adminShell != null ? adminShell.rolesLabel : '권한 없음'}">admin.view</strong></span>
		</div>
		<div class="admin-topbar-meta">
			<span>revision <strong th:text="${adminShell != null ? adminShell.revision : 'local'}">local</strong></span>
			<span>master data <strong th:text="${adminShell != null ? adminShell.masterDataVersion : 'unknown'}">unknown</strong></span>
			<form th:if="${adminShell != null && adminShell.username != 'anonymous'}"
			      th:action="@{/admin/logout}"
			      method="post"
			      aria-label="관리자 로그아웃">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<button type="submit">로그아웃</button>
			</form>
		</div>
	</div>
</div>
<div th:fragment="contentStart" id="admin-content" class="admin-content-anchor" tabindex="-1"></div>
<output th:fragment="flash" class="alert alert-dismissible"
        th:if="${flashMessage != null && !flashMessage.isBlank()}"
        th:classappend="${flashTone == 'failure'} ? ' failure' : (${flashTone == 'warning'} ? ' warning' : ' good')"
        x-data="dismissibleAlert" x-show="visible">
	<span th:text="${flashMessage}">처리되었습니다.</span>
	<button type="button" class="alert-dismiss" x-cloak x-on:click="dismiss" aria-label="알림 닫기">✕</button>
</output>
<!--
  관리자 프론트 스크립트(#1736): htmx·Alpine(CSP 빌드)·app.js를 self-host + SRI로 로드한다.
  전부 defer라 파싱 순서대로 실행되어 app.js의 alpine:init 리스너가 Alpine start 전에 등록된다.
  Chart.js는 필요한 화면만 chartScripts fragment로 별도 로드한다(대시보드·분석).
-->
<th:block th:fragment="scripts">
	<script th:src="@{/vendor/htmx-2.0.10/htmx.min.js}"
	        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
	        crossorigin="anonymous" defer></script>
	<script th:src="@{/vendor/alpinejs-csp-3.15.12/cdn.min.js}"
	        integrity="sha384-MKLWq9B+VC0W3U8kDIBEsSu8uCnQ1B0UQpRaB+F7uR5ocXFbymMUKuLRntu5LLdu"
	        crossorigin="anonymous" defer></script>
	<script th:src="@{/js/admin/app.js}" defer></script>
</th:block>
<th:block th:fragment="chartScripts">
	<script th:src="@{/vendor/chartjs-4.5.1/chart.umd.js}"
	        integrity="sha384-hfkuqrKeWFmnTMWN31VWyoe8xgdTADD11kgxmdpx2uyE6j5Az5uZq6u6AKYYmAOw"
	        crossorigin="anonymous" defer></script>
</th:block>
<span th:fragment="status(text, tone)" class="admin-status"
      th:classappend="${tone == 'good'} ? ' good' : (${tone == 'bad'} ? ' bad' : (${tone == 'warn'} ? ' warn' : ''))"
      th:text="${text}">상태</span>
<span th:fragment="statusAuto(label)" class="admin-status"
      th:classappend="${label == null ? '' :
        (#lists.contains({'완료','성공','정상','반영','반영됨','확인 완료','관리자 확인','고장·공사 반영','SUCCESS','PASS','RESOLVED','OK'}, label) ? ' good' :
        (#lists.contains({'실패','오류','고장','폐쇄','반려됨','차단','중단','OPEN','FAIL','FAILED','ERROR'}, label) ? ' bad' :
        (#lists.contains({'접수됨','진행 중','실행 중','대기','확인 중','확인 필요','공사 중','미확인','사용자 제보','엘리베이터 미확인','PENDING','RUNNING'}, label) ? ' warn' : '')))}"
      th:text="${label}">상태</span>
</body>
</html>
