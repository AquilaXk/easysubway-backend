<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<title>통합 관리자 공용 셸</title>
</head>
<body>
<nav class="admin-sidebar" id="admin-primary-nav" th:fragment="sidebar(active)" aria-label="통합 관리자 화면">
	<div class="admin-brand">
		<div>
			<strong>쉬운 지하철</strong>
			<span>통합 관리자</span>
		</div>
	</div>
	<!--
	  퀵서치(#1981): 사이드바 최상단 검색 필드. 신규 JS 로직 없이 기존 커맨드 팔레트(#1738)
	  메커니즘을 그대로 재사용한다 — command-palette x-data 블록(트리거+오버레이)을 topbar에서
	  이 위치로 이동해, 퀵서치 입력 자체가 팔레트를 여는 트리거가 되도록 했다(x-on:click.prevent="show").
	-->
	<div class="command-palette" x-data="commandPalette"
	     x-on:keydown.cmd.k.window.prevent="show"
	     x-on:keydown.ctrl.k.window.prevent="show"
	     x-on:keydown.escape.window="hide">
		<a class="admin-sidebar-quicksearch command-palette-trigger" th:href="@{/admin/search}" x-on:click.prevent="show">
			<span aria-hidden="true">🔍</span>
			<span>메뉴·역 검색</span>
			<kbd>⌘K</kbd>
		</a>
		<div class="command-palette-overlay" x-cloak x-show="open"
		     role="dialog" aria-modal="true" aria-label="통합 검색">
			<div class="command-palette-backdrop" x-on:click="hide"></div>
			<div class="command-palette-panel">
				<form role="search" method="get" th:action="@{/admin/search}"
				      hx-target="#palette-results" hx-swap="innerHTML"
				      th:attr="hx-get=@{/admin/search}" hx-trigger="keyup changed delay:300ms">
					<input type="search" name="q" x-ref="input" placeholder="메뉴·역 검색"
					       aria-label="검색어" autocomplete="off"
					       x-on:keydown.arrow-down.prevent="focusResults">
					<button type="submit">검색</button>
				</form>
				<div id="palette-results" class="command-palette-results"
				     x-on:keydown.arrow-down.prevent="moveDown"
				     x-on:keydown.arrow-up.prevent="moveUp"></div>
			</div>
		</div>
	</div>
	<div class="admin-nav-scroll">
		<div class="admin-nav-group" th:each="group : ${adminProgramGroups}">
			<p class="admin-nav-group-label" th:text="${group.label}">메뉴 그룹</p>
			<a th:each="program : ${group.programs}"
			   class="admin-nav-item"
			   th:classappend="${active == program.id} ? ' is-active'"
			   th:href="@{${program.path}}"
			   th:text="${program.label}">메뉴</a>
		</div>
	</div>
</nav>
<a th:fragment="skipLink" class="skip-link" href="#admin-content">본문으로 건너뛰기</a>
<div th:fragment="topbar" class="admin-topbar">
	<!--
	  반응형 사이드바 토글(#1738): ≤1024px에서만 보인다. 누르면 사이드바를 오프캔버스로 연다
	  (body.sidebar-open + 백드롭). nav 바깥(topbar)에 둬야 한다 — .has-js .admin-sidebar가
	  transform: translateX(-100%)로 화면 밖에 있을 때도 이 토글은 항상 화면에 남아야 열 수 있다.
	-->
	<div class="admin-sidebar-nav-control" x-data="sidebarToggle"
	     x-on:keydown.escape.window="close">
		<button type="button" class="admin-sidebar-toggle" x-on:click="toggle"
		        x-bind:aria-expanded="ariaExpanded" aria-controls="admin-primary-nav"
		        aria-label="주 메뉴 열기·닫기">
			<span aria-hidden="true">☰</span>
		</button>
		<div class="admin-sidebar-backdrop" x-cloak x-show="open" x-on:click="close"></div>
	</div>
	<div class="admin-topbar-row" aria-label="관리자 실행 환경">
		<div class="admin-topbar-meta">
			<span class="admin-env-badge"
			      th:classappend="${' is-' + (adminShell != null ? adminShell.environmentTone : 'development')}"
			      th:text="${adminShell != null ? adminShell.environmentLabel : 'DEV'}">DEV</span>
			<span>관리자 <strong th:text="${adminShell != null ? adminShell.username : 'anonymous'}">admin</strong></span>
			<span>권한 <strong th:text="${adminShell != null ? adminShell.rolesLabel : '권한 없음'}">admin.view</strong></span>
		</div>
		<div class="admin-topbar-meta">
			<!--
			  알림 센터(#1738): topbar 벨. 벨을 누르면 요약 패널이 열린다(Cmd 없이 클릭으로).
			  live 영역은 alertCenter 컴포넌트가 60초마다 htmx로 /admin/alerts를 폴링해 채운다.
			  탭이 비활성이면 폴링을 멈춘다. no-JS는 벨이 /admin/alerts 전용 페이지로 이동한다.
			-->
			<div class="admin-alert-center" x-data="alertCenter"
			     x-bind:class="rootClass" x-on:keydown.escape.window="hide">
				<a class="admin-alert-bell" th:href="@{/admin/alerts}" x-on:click.prevent="toggle"
				   aria-haspopup="dialog" x-bind:aria-expanded="ariaExpanded"
				   aria-controls="admin-alert-live" aria-label="알림 센터">
					<span class="admin-alert-bell-icon" aria-hidden="true">🔔</span>
				</a>
				<div id="admin-alert-live" class="admin-alert-live"></div>
			</div>
			<span>revision <strong th:text="${adminShell != null ? adminShell.revision : 'local'}">local</strong></span>
			<span>master data <strong th:text="${adminShell != null ? adminShell.masterDataVersion : 'unknown'}">unknown</strong></span>
			<form th:if="${adminShell != null && adminShell.username != 'anonymous'}"
			      th:action="@{/admin/logout}"
			      method="post"
			      aria-label="관리자 로그아웃">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<button type="submit">로그아웃</button>
			</form>
		</div>
	</div>
</div>
<div th:fragment="contentStart" id="admin-content" class="admin-content-anchor" tabindex="-1"></div>
<!--
  breadcrumb(#1738): 그룹 > 프로그램(링크) > 상세. 상세 화면(reports/detail 등)에서 위치를 보여준다.
  detailLabel이 null이면 2단만 렌더. 화면군 이슈가 재사용한다.
-->
<nav th:fragment="breadcrumb(groupLabel, programLabel, programHref, detailLabel)"
     class="admin-breadcrumb" aria-label="위치">
	<ol>
		<li th:text="${groupLabel}">그룹</li>
		<li><a th:href="@{${programHref}}" th:text="${programLabel}">프로그램</a></li>
		<li th:if="${detailLabel != null and !detailLabel.isEmpty()}"
		    aria-current="page" th:text="${detailLabel}">상세</li>
	</ol>
</nav>
<output th:fragment="flash" class="alert alert-dismissible"
        th:if="${flashMessage != null && !flashMessage.isBlank()}"
        th:classappend="${flashTone == 'failure'} ? ' failure' : (${flashTone == 'warning'} ? ' warning' : ' good')"
        x-data="dismissibleAlert" x-show="visible">
	<span th:text="${flashMessage}">처리되었습니다.</span>
	<button type="button" class="alert-dismiss" x-cloak x-on:click="dismiss" aria-label="알림 닫기">✕</button>
</output>
<!--
  토스트 영역(#1737): htmx 응답의 HX-Trigger("admin-toast", {message, tone}) 이벤트로 우상단 알림을 띄운다.
  no-JS에서는 서버 flash(<output th:fragment="flash">)가 대체한다. 화면군 이슈가 이 fragment를 재사용한다.
-->
<div th:fragment="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"
     x-data="toastHub" x-on:admin-toast.window="show">
	<output class="toast-item" x-cloak x-show="visible" x-bind:class="toneClass">
		<span x-text="message">알림</span>
		<button type="button" class="toast-dismiss" x-on:click="hide" aria-label="알림 닫기">✕</button>
	</output>
</div>
<!--
  드로어(사이드 패널, #1737): htmx가 #admin-drawer-body에 상세 fragment를 로드하고 HX-Trigger로
  admin-drawer-open을 쏘면 열린다. Esc·백드롭·닫기 버튼으로 닫는다. no-JS는 상세 링크가 상세 페이지로 이동.
  화면군 이슈가 재사용한다. 열림/닫힘 포커스 이동·복귀 키보드 검증은 접근성 QA(#1749)에서 확인한다.
-->
<aside th:fragment="drawer" class="admin-drawer" x-data="drawer" x-show="visible" x-cloak
       x-on:admin-drawer-open.window="open" x-on:keydown.escape.window="close"
       role="dialog" aria-modal="true" aria-label="상세 패널">
	<div class="admin-drawer-backdrop" x-on:click="close"></div>
	<div class="admin-drawer-panel" x-ref="panel" tabindex="-1">
		<button type="button" class="admin-drawer-close" x-on:click="close" aria-label="패널 닫기">✕</button>
		<div id="admin-drawer-body" class="admin-drawer-body"></div>
	</div>
</aside>
<!--
  관리자 프론트 스크립트(#1736): htmx·Alpine(CSP 빌드)·app.js를 self-host + SRI로 로드한다.
  전부 defer라 파싱 순서대로 실행된다. app.js는 Alpine보다 먼저 alpine:init 리스너를 등록해야
  x-data 컴포넌트(sidebarToggle, commandPalette, copyField 등)가 Alpine start 전에 준비된다.
  Chart.js는 필요한 화면만 chartScripts fragment로 별도 로드한다(대시보드·분석).
-->
<th:block th:fragment="scripts">
	<script th:src="@{/vendor/htmx-2.0.10/htmx.min.js}"
	        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
	        crossorigin="anonymous" defer></script>
	<script th:src="@{/js/admin/app.js}" defer></script>
	<script th:src="@{/vendor/alpinejs-csp-3.15.12/cdn.min.js}"
	        integrity="sha384-MKLWq9B+VC0W3U8kDIBEsSu8uCnQ1B0UQpRaB+F7uR5ocXFbymMUKuLRntu5LLdu"
	        crossorigin="anonymous" defer></script>
</th:block>
<th:block th:fragment="chartScripts">
	<script th:src="@{/vendor/chartjs-4.5.1/chart.umd.js}"
	        integrity="sha384-hfkuqrKeWFmnTMWN31VWyoe8xgdTADD11kgxmdpx2uyE6j5Az5uZq6u6AKYYmAOw"
	        crossorigin="anonymous" defer></script>
</th:block>
<span th:fragment="status(text, tone)" class="admin-status"
      th:classappend="${tone == 'good'} ? ' good' : (${tone == 'bad'} ? ' bad' : (${tone == 'warn'} ? ' warn' : ''))"
      th:text="${text}">상태</span>
<span th:fragment="statusAuto(label)" class="admin-status"
      th:classappend="${label == null ? '' :
        (#lists.contains({'완료','성공','정상','반영','반영됨','확인 완료','관리자 확인','고장·공사 반영','SUCCESS','PASS','RESOLVED','OK'}, label) ? ' good' :
        (#lists.contains({'실패','오류','고장','폐쇄','반려됨','차단','중단','OPEN','FAIL','FAILED','ERROR'}, label) ? ' bad' :
        (#lists.contains({'접수됨','진행 중','실행 중','대기','확인 중','확인 필요','공사 중','미확인','사용자 제보','엘리베이터 미확인','PENDING','RUNNING'}, label) ? ' warn' : '')))}"
      th:text="${label}">상태</span>
</body>
</html>
