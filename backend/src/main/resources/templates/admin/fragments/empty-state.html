<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<title>관리자 빈 상태 fragment</title>
</head>
<body>
<!--
  관리자 표준 빈 상태(#1737): 아이콘 없는 텍스트 중심(패밀리룩 — 과장 박스 금지).
  message는 상황 설명, hint는 다음 행동 안내(선택). 화면군 이슈가 재사용한다.
  사용: <div th:replace="~{admin/fragments/empty-state :: panel('확인할 신고가 없습니다.', '필터를 조정해 보세요.')}"></div>
-->
<div th:fragment="panel(message, hint)" class="empty-state">
	<p class="empty-state-message" th:text="${message}">표시할 항목이 없습니다.</p>
	<p class="empty-state-hint" th:if="${hint != null and !hint.isEmpty()}" th:text="${hint}">다음 행동 안내</p>
</div>
</body>
</html>
