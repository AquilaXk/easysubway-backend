<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<title>관리자 페이지네이션</title>
</head>
<body>
<nav class="pagination" th:fragment="pager(label, page, links)" th:aria-label="${label}" th:if="${page.hasPages}">
	<span class="pagination-total" th:if="${page.totalRecordCount != null}">
		총 <strong th:text="${page.totalRecordCount}">0</strong>건
	</span>
	<div class="pagination-pages-group">
		<a th:if="${page.hasPrevious}" th:href="${links.previousHref}" class="pagination-prev">이전</a>
		<span th:unless="${page.hasPrevious}" class="pagination-prev is-disabled" aria-disabled="true">이전</span>
		<span class="pagination-numbers">
			<a th:each="pageLink : ${links.pages}"
			   th:href="${pageLink.href}"
			   th:attr="aria-current=${pageLink.current ? 'page' : null}"
			   th:classappend="${pageLink.current} ? ' is-active' : ''"
			   th:text="${pageLink.label}">1</a>
		</span>
		<a th:if="${page.hasNext}" th:href="${links.nextHref}" class="pagination-next">다음</a>
		<span th:unless="${page.hasNext}" class="pagination-next is-disabled" aria-disabled="true">다음</span>
	</div>
</nav>
</body>
</html>
