<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
	<title>데이터 수집 배치</title>
	<link rel="stylesheet" th:href="@{/css/admin-v3.css}">
</head>
<body class="admin-v3">
<a th:replace="~{admin/fragments/shell :: skipLink}"></a>
<div class="admin-shell">
<div th:replace="~{admin/fragments/shell :: sidebar('a-collections')}"></div>
<main class="admin-main">
	<div th:replace="~{admin/fragments/shell :: topbar}"></div>
	<div th:replace="~{admin/fragments/shell :: contentStart}"></div>
	<header class="admin-page-head">
		<div>
			<h1>데이터 수집</h1>
			<p>도시철도 마스터 수집을 실행하고 성공·실패·재시도 가능 여부를 확인합니다.</p>
		</div>
	</header>

	<form class="run-form" th:action="@{/admin/data-collections/page/run}" method="post">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
		<input type="hidden" name="commandToken" th:value="${commandTokens.next()}">
		<label th:each="sourceOption : ${sourceOptions}">
			<input type="radio"
			       name="source"
			       th:value="${sourceOption.value}"
			       th:checked="${sourceOptionStat.first}">
			<span th:text="${sourceOption.label + ' 데이터 수집'}">도시철도 마스터 데이터 수집</span>
		</label>
		<button type="submit" class="primary">수집 실행</button>
	</form>

	<section class="admin-panel" id="collection-live" th:fragment="live">
		<h2>최근 실행 기록</h2>
		<div class="admin-auto-refresh" hidden x-data="autoRefresh"
		     data-refresh-url="/admin/data-collections/page/live" data-refresh-target="#collection-live"
		     data-refresh-interval="10000" th:attr="data-refresh-active=${hasRunning} ? 'true' : 'false'"></div>
		<div class="admin-table-scroll" tabindex="0" role="group"
		     aria-label="가로로 스크롤 가능한 데이터 표">
		<table>
			<thead>
			<tr>
				<th scope="col">수집 대상</th>
				<th scope="col">상태</th>
				<th scope="col">요청자</th>
				<th scope="col">시작</th>
				<th scope="col">완료</th>
				<th scope="col">수집 건수</th>
				<th scope="col">단계</th>
				<th scope="col">실패 사유</th>
				<th scope="col">재시도</th>
				<th scope="col">다음 행동</th>
			</tr>
			</thead>
			<tbody>
			<tr th:if="${runs.isEmpty()}">
				<td class="empty" colspan="10">최근 실행 기록이 없습니다.</td>
			</tr>
			<tr th:each="run : ${runs}">
				<td th:text="${run.sourceLabel}">도시철도 마스터</td>
				<td><span th:replace="~{admin/fragments/shell :: statusAuto(${run.statusLabel})}">완료</span></td>
				<td th:text="${run.requestedBy}">admin-user</td>
				<td th:text="${run.startedAt}">2026-06-15T10:00:00</td>
				<td th:text="${run.completedAtLabel()}">2026-06-15T10:01:00</td>
				<td th:text="${run.collectedCount}">13</td>
				<td>
					<details class="admin-step-accordion" th:attr="open=${run.failedStepCount() > 0} ? 'open' : null">
						<summary th:text="${run.stepSummaryLabel()}">단계 3개</summary>
						<ol class="admin-step-list">
							<li th:each="step : ${run.steps}" th:classappend="${step.failed} ? ' admin-step-failed'">
								<strong th:text="${step.name}">FETCH</strong>
								<span th:text="${step.statusLabel}">완료</span>
								<span th:text="${'건수 ' + step.recordCount}">건수 14</span>
								<span th:if="${step.failed}" class="admin-step-failure" th:text="${step.failureMessage}">-</span>
							</li>
						</ol>
					</details>
				</td>
				<td th:text="${run.failureLabel()}">-</td>
				<td>
					<details th:if="${run.retryable}" class="admin-retry-confirm">
						<summary>재시도…</summary>
						<p class="meta" th:text="|대상: ${run.sourceLabel}. 확인하면 수집을 다시 실행합니다.|">영향</p>
						<form th:action="@{/admin/data-collections/page/run}" method="post">
							<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
							<input type="hidden" name="commandToken" th:value="${commandTokens.next()}">
							<input type="hidden" name="source" th:value="${run.source}">
							<button type="submit" class="primary">재시도 확인</button>
						</form>
					</details>
					<span th:unless="${run.retryable}" th:text="${run.retryableLabel()}">불필요</span>
				</td>
				<td th:text="${run.operatorAction}">수집이 완료되었습니다. 최근 데이터 품질 화면에서 반영 결과를 확인하세요.</td>
			</tr>
			</tbody>
		</table>
		</div>
		<div th:replace="~{admin/fragments/pagination :: pager('데이터 수집 실행 목록 페이지', ${page}, ${paginationLinks})}"></div>
	</section>
</main>
</div>
<th:block th:replace="~{admin/fragments/shell :: scripts}"></th:block>
</body>
</html>
