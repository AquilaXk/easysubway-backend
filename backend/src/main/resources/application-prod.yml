logging:
  level:
    com.easysubway: INFO

management:
  endpoint:
    health:
      group:
        readiness:
          include: "readinessState,db,productionReadiness"

spring:
  datasource:
    url: ${EASYSUBWAY_DATASOURCE_URL}
    username: ${EASYSUBWAY_DATASOURCE_USERNAME}
    password: ${EASYSUBWAY_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    postgresql:
      transactional-lock: false
    # 기존 운영 DB는 schema만 있고 Flyway 이력이 없을 수 있어 최초 전환 시 baseline으로 수렴시킨다.
    baseline-on-migrate: true
    baseline-version: 1
  batch:
    jdbc:
      # Batch metadata table은 Flyway baseline migration에서 운영 schema와 함께 관리한다.
      initialize-schema: never

easysubway:
  ads:
    event-daily-cap: ${EASYSUBWAY_ADS_EVENT_DAILY_CAP}
  report:
    receipt-token-pepper: ${EASYSUBWAY_REPORT_RECEIPT_PEPPER:${EASYSUBWAY_REPORT_RECEIPT_TOKEN_PEPPER:}}
    abuse-control:
      window-seconds: ${EASYSUBWAY_REPORT_ABUSE_WINDOW_SECONDS:60}
      upload-intent-limit: ${EASYSUBWAY_REPORT_ABUSE_UPLOAD_INTENT_LIMIT:60}
      upload-claim-limit: ${EASYSUBWAY_REPORT_ABUSE_UPLOAD_CLAIM_LIMIT:120}
      report-submit-limit: ${EASYSUBWAY_REPORT_ABUSE_REPORT_SUBMIT_LIMIT:30}
      status-limit: ${EASYSUBWAY_REPORT_ABUSE_STATUS_LIMIT:120}
      confirm-limit: ${EASYSUBWAY_REPORT_ABUSE_CONFIRM_LIMIT:30}
      max-counter-keys: ${EASYSUBWAY_REPORT_ABUSE_MAX_COUNTER_KEYS:4096}
      store-mode: ${EASYSUBWAY_REPORT_ABUSE_STORE_MODE:local}
    upload:
      bucket: ${EASYSUBWAY_REPORT_UPLOAD_BUCKET:}
      max-bytes: ${EASYSUBWAY_REPORT_UPLOAD_MAX_BYTES:921600}
      url-ttl-seconds: ${EASYSUBWAY_REPORT_UPLOAD_URL_TTL_SECONDS:900}
      intent-signing-key: ${EASYSUBWAY_REPORT_UPLOAD_INTENT_SIGNING_KEY:${EASYSUBWAY_REPORT_RECEIPT_PEPPER:${EASYSUBWAY_REPORT_RECEIPT_TOKEN_PEPPER:}}}
      object-storage-endpoint: ${EASYSUBWAY_REPORT_OBJECT_STORAGE_INTERNAL_ENDPOINT:}
      public-base-url: ${EASYSUBWAY_REPORT_UPLOAD_PUBLIC_BASE_URL:}
      object-storage-access-key: ${EASYSUBWAY_OBJECT_STORAGE_ACCESS_KEY:}
      object-storage-secret-key: ${EASYSUBWAY_OBJECT_STORAGE_SECRET_KEY:}
      object-storage-region: ${EASYSUBWAY_OBJECT_STORAGE_REGION:us-east-1}
  admin:
    username: ${EASYSUBWAY_ADMIN_USERNAME}
    password: ${EASYSUBWAY_ADMIN_PASSWORD}
    platform-transition:
      stage: ${EASYSUBWAY_ADMIN_PLATFORM_TRANSITION_STAGE:shadow}
      flags:
        rbac-enforcement: ${EASYSUBWAY_ADMIN_PLATFORM_FLAGS_RBAC_ENFORCEMENT:false}
        audit-enforcement: ${EASYSUBWAY_ADMIN_PLATFORM_FLAGS_AUDIT_ENFORCEMENT:false}
        legacy-env-admin-fallback: ${EASYSUBWAY_ADMIN_PLATFORM_FLAGS_LEGACY_ENV_ADMIN_FALLBACK:true}
        break-glass-bootstrap: ${EASYSUBWAY_ADMIN_PLATFORM_FLAGS_BREAK_GLASS_BOOTSTRAP:true}
      release-gate:
        blocker-mode: ${EASYSUBWAY_ADMIN_PLATFORM_RELEASE_BLOCKER_MODE:fail}
    break-glass:
      username: ${EASYSUBWAY_ADMIN_BREAK_GLASS_USERNAME:}
      password: ${EASYSUBWAY_ADMIN_BREAK_GLASS_PASSWORD:}
      reason: ${EASYSUBWAY_ADMIN_BREAK_GLASS_REASON:}
    basic-auth:
      enabled: ${EASYSUBWAY_ADMIN_BASIC_AUTH_ENABLED:false}
      exception-owner: ${EASYSUBWAY_ADMIN_BASIC_AUTH_EXCEPTION_OWNER:}
      exception-expires-at: ${EASYSUBWAY_ADMIN_BASIC_AUTH_EXCEPTION_EXPIRES_AT:}
  operator:
    username: ${EASYSUBWAY_OPERATOR_USERNAME:}
    password: ${EASYSUBWAY_OPERATOR_PASSWORD:}
  auth:
    client-ip:
      trusted-proxies: ${EASYSUBWAY_TRUSTED_PROXY_CIDRS}
  notifications:
    push:
      external-enabled: ${EASYSUBWAY_PUSH_EXTERNAL_ENABLED:false}
  timetable:
    seed:
      enabled: ${EASYSUBWAY_TIMETABLE_SEED_ENABLED:false}
      includes-itx: ${EASYSUBWAY_TIMETABLE_SEED_INCLUDES_ITX:false}
    freshness:
      # break-glass override: 만료된 timetable snapshot을 명시적 운영 결정으로 한시 서빙한다(기본 false).
      # 활성화 시 기동·주기 WARN 로그와 break-glass 메트릭으로 우회가 관측된다. actuator health detail에도
      # breakGlass/breakGlassReason이 실리지만, management.endpoint.health.show-details 기본값(never)에서는
      # /actuator/health 응답에 노출되지 않는다 — 실효 감사 표면은 WARN 로그 + gauge다(health detail 노출을
      # 원하면 show-details: when-authorized 검토가 필요하며 이 변경 범위 밖이다).
      # 무결성(해시·스키마·출처) 검증은 우회되지 않는다 — 시간 기반 만료(fresh_until)만 우회한다.
      # RouteV2Planner의 feed_end_date staleness 게이트(isFeedStale → STALE_TIMETABLE → 503)는 fresh_until과
      # 무관한 별도 축이라 override와 상관없이 그대로 적용된다(feed_end_date 이후 날짜는 실제 trip이 없어 우회
      # 대상이 아님) — override를 켜도 feed_end_date가 지난 날짜의 인증 경로검색은 여전히 503이다.
      # 오타(예: "ture")나 형식이 안 맞는 값은 boolean 바인딩 실패로 "OFF 폴백"이 아니라 애플리케이션 기동
      # 자체가 실패한다(fail-safe이지만 무중단이 아니므로 운영 중 혼선에 유의).
      # 적용 프로파일 범위: 이 파일(application-prod.yml)은 spring.profiles.group(application.yml)에 의해
      # staging/release/prod-like에도 상속되므로 이 플래그는 prod 전용이 아니라 운영 계열 프로파일 전체
      # (prod·staging·release·prod-like)에 공통으로 적용된다 — 의도된 범위다(모니터 bean과 동일한
      # @Profile("prod | staging | release | prod-like") 대상에 대한 공통 안전장치).
      # 사용 후에는 fresh snapshot이 admit되는 즉시 반드시 비활성으로 되돌린다.
      break-glass: ${EASYSUBWAY_TIMETABLE_FRESHNESS_BREAK_GLASS:false}
      # 활성 사유·활성화 주체 감사 문맥(로그·health detail에 그대로 노출된다). 활성 시 채우기를 권장한다.
      break-glass-reason: ${EASYSUBWAY_TIMETABLE_FRESHNESS_BREAK_GLASS_REASON:}
  route-v2:
    origin-secret: ${EASYSUBWAY_ROUTE_V2_ORIGIN_SECRET:}
    session-max-requests: ${EASYSUBWAY_ROUTE_V2_SESSION_MAX_REQUESTS:50}
    play-integrity:
      certificate-sha256: ${EASYSUBWAY_ROUTE_V2_PLAY_INTEGRITY_CERTIFICATE_SHA256:}
  play-integrity:
    credentials-base64: ${EASYSUBWAY_PLAY_INTEGRITY_CREDENTIALS_BASE64:}
