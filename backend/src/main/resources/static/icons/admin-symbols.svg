<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="display: none">
  <!--
    admin-symbols.svg — V6-04(#2276) 프로젝트 소유 정적 아이콘 sprite.
    외부 라이브러리를 vendor하지 않고 보편적 기하학 라인 아이콘만 최소하게 담는다(무채색·심플 원칙).
    inventory 13개 고정: search, menu, alert, close, account, logout, chevron-down, check,
    warning, error, info, more, copy. 각 symbol은 viewBox="0 0 20 20" · fill="none" ·
    stroke="currentColor" · stroke-width="1.75" · round linecap/linejoin을 사용한다.
    렌더 svg의 accessible name은 이 sprite를 <use>로 부르는 button/link가 소유한다(fragments/icon.html).
  -->
  <symbol id="search" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
