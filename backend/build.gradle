plugins {
	id 'java'
	id 'jacoco'
	id 'com.github.spotbugs' version '6.2.2'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
}

jacoco {
	// Java 21 클래스 파일 계측을 지원하는 안정 버전을 고정한다.
	toolVersion = '0.8.13'
}

spotbugs {
	// 리포트 전용: baseline·억제 정책 정합 전 CI를 붉히지 않는다(#2440).
	ignoreFailures = true
	showProgress = false
	excludeFilter = file('quality/spotbugs-exclude.xml')
}

configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

group = 'com.easysubway'
version = '0.0.1-SNAPSHOT'
description = 'EasySubway backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
		vendor = JvmVendorSpec.ADOPTIUM
	}
}

repositories {
	// eGovFrame 공식 Maven 저장소가 CI runner에서 간헐적으로 timeout되어 필요한 artifact만 로컬 mirror로 먼저 해석한다.
	maven {
		url = uri('gradle/local-maven')
		content {
			includeGroup 'org.egovframe.boot'
			includeGroup 'org.egovframe.rte'
		}
	}
	mavenCentral()
	maven {
		url 'https://maven.egovframe.go.kr/maven'
		content {
			includeGroup 'org.egovframe.boot'
			includeGroup 'org.egovframe.rte'
		}
	}
}

dependencyManagement {
	imports {
		mavenBom 'org.egovframe.boot:egovframe-boot-starter-parent:5.0.0'
		mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
		// Jackson 2.21.5 — GHSA-5jmj-h7xm-6q6v(CVE-2026-54515) 패치(#2459).
		mavenBom 'com.fasterxml.jackson:jackson-bom:2.21.5'
	}
	dependencies {
		// PostgreSQL JDBC 42.7.12 — OSV advisory 패치(#2459).
		dependency 'org.postgresql:postgresql:42.7.12'
		// Spring Boot BOM이 더 낮게 고정하는 공통 라이브러리는 기존 eGovFrame 기준 보안 패치 버전을 유지한다.
		// fdl-property가 끌어오는 commons-configuration2 2.11.0은 GHSA-337m-mw94-2v6g(Medium)라 2.15.0으로 상향(#1821).
		dependency 'org.apache.commons:commons-configuration2:2.15.0'
		dependency 'org.apache.commons:commons-lang3:3.18.0'
		// log4j 2.25.3은 verifyHostName 설정 속성 경로의 TLS 호스트명 검증이 누락(CVE-2026-34477, CVE-2025-68161 불완전 수정)이라 2.25.4로 상향(#1837).
		dependency 'org.apache.logging.log4j:log4j-api:2.25.4'
		dependency 'org.apache.logging.log4j:log4j-core:2.25.4'
		dependency 'org.apache.logging.log4j:log4j-jul:2.25.4'
		dependency 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.4'
		dependency 'org.apache.logging.log4j:log4j-layout-template-json:2.25.4'
		dependency 'org.apache.commons:commons-compress:1.26.2'
	}
}

dependencyLocking {
	lockAllConfigurations()
}

dependencies {
	implementation 'org.egovframe.rte:egovframe-rte-ptl-mvc'
	// 수집 배치 control-plane: bat-core 변수 리스너로 표준 배치 변수 시딩 + 생명주기 로깅(#1820).
	// psl-dataaccess는 bat-core의 inert transitive로만 존재(직접 채택 금지, contract test 강제).
	implementation 'org.egovframe.rte:egovframe-rte-bat-core'
	// 수집 run ID control-plane: fdl-idgnr Table 전략 ID + fdl-property 접두어 외부화(#1821).
	// 보안 식별자(UUID·DB PK·토큰)는 대상 아님 — 운영성 수집 run ID 한정(contract test 강제).
	implementation 'org.egovframe.rte:egovframe-rte-fdl-property'
	implementation 'org.egovframe.rte:egovframe-rte-fdl-idgnr'
	// 관리자·운영기관 내보내기 xlsx 병행(#1822): fdl-excel AbstractPOIExcelView로 렌더. CSV 계약 불변.
	// POI 계열 transitive는 mavenCentral 해석(버전 충돌 시 dependencyManagement 명시 고정).
	implementation 'org.egovframe.rte:egovframe-rte-fdl-excel'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-log4j2'
	implementation 'org.apache.logging.log4j:log4j-layout-template-json'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 관리자 콘솔 htmx 부분 응답 규약: @HxRequest 매핑 분리와 hx: dialect의 CSRF 헤더 자동 주입.
	// 4.0.x는 Spring Boot 3.5 기준으로 빌드된 계열이라 현재 BOM(3.5.15)과 정합한다(5.x는 Spring Boot 4.0 기준).
	implementation 'io.github.wimdeblauwe:htmx-spring-boot-thymeleaf:4.0.3'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.48.0'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
	testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
	testImplementation 'org.testcontainers:postgresql:1.21.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// @SpringBootTest 컨텍스트 캐시 누적 + fdl-excel 1만 행 xlsx 메모리 테스트(#1822)로 스위트 힙 수요가
	// 기본 512MB를 넘어선다. 포크 테스트 JVM 힙을 2g로 상향(전체 스위트·CI 공통 OOM 방지).
	maxHeapSize = '2g'
	// 계약 테스트는 backend 밖의 contracts/api를 읽는다. 입력으로 선언하지 않으면 계약 파일만
	// 고친 변경에서 test 태스크가 UP-TO-DATE로 건너뛰어 게이트가 조용히 비활성화된다.
	inputs.dir(layout.projectDirectory.dir('../contracts/api'))
		.withPropertyName('apiContracts')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.dir(layout.projectDirectory.dir('../contracts/route'))
		.withPropertyName('routeContracts')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.dir(layout.projectDirectory.dir('src/main/resources/timetable'))
		.withPropertyName('timetableResources')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.dir(layout.projectDirectory.dir('src/main/java'))
		.withPropertyName('runtimeInventoryJavaSources')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	// 커버리지 측정만 수행한다. 전역 % fail 게이트는 후속 이슈에서 패키지 단위로 검토한다(#2440).
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
	classDirectories.setFrom(files(classDirectories.files.collect { classesDir ->
		fileTree(dir: classesDir, exclude: [
			'**/*Application.class',
		])
	}))
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	launcher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
		vendor = JvmVendorSpec.ADOPTIUM
	}
	reports {
		html.required = true
		xml.required = true
	}
}

def spotbugsMainEvidence = layout.buildDirectory.file('spotbugs/spotbugsMain-evidence.json')

tasks.named('spotbugsMain', com.github.spotbugs.snom.SpotBugsTask) {
	reports.named('html') {
		outputLocation = layout.buildDirectory.file('reports/spotbugs/spotbugsMain.html')
	}
	reports.named('xml') {
		outputLocation = layout.buildDirectory.file('reports/spotbugs/spotbugsMain.xml')
	}
}

tasks.register('writeSpotbugsMainEvidence') {
	def spotbugsMain = tasks.named('spotbugsMain', com.github.spotbugs.snom.SpotBugsTask)
	dependsOn spotbugsMain
	outputs.file(spotbugsMainEvidence)

	doLast {
		def task = spotbugsMain.get()
		def declaredTaskType = com.github.spotbugs.snom.SpotBugsTask
		if (!declaredTaskType.isAssignableFrom(task.class)) throw new GradleException("spotbugsMain runtime type is not assignable to ${declaredTaskType.name}: ${task.class.name}")
		def hash = { file -> java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
		def repositoryPath = { value -> "backend/${project.relativePath(value).replace('\\', '/')}" }
		def directoryEntries = { values -> values.collect { [path: it.canonicalPath, repositoryPath: repositoryPath(it)] }.sort { it.repositoryPath } }
		def fileEntries = { values -> values.findAll { it.isFile() }.collect { [path: it.canonicalPath, repositoryPath: repositoryPath(it), sha256: hash(it)] }.sort { it.repositoryPath } }
		def artifactMap = { configuration, label ->
			def mapped = [:]
			configuration.incoming.artifactView { }.artifacts.artifacts.each { artifact ->
				def file = artifact.file.canonicalFile
				if (!file.isFile()) throw new GradleException("non-regular ${label} artifact: ${file}")
				def owner = artifact.variant.owner
				if (!(owner instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier)) throw new GradleException("unmapped ${label} component: ${owner}")
				def identity = [component: "${owner.group}:${owner.module}:${owner.version}", artifact: file.name]
				if (mapped.put(file, identity) != null) throw new GradleException("conflicting ${label} artifact: ${file}")
			}
			mapped
		}
		def mergeArtifactMaps = { label, maps ->
			def merged = [:]
			maps.each { mapped ->
				mapped.each { file, identity ->
					def existing = merged[file]
					if (existing != null && existing != identity) throw new GradleException("conflicting ${label} artifact identity: ${file}")
					merged[file] = identity
				}
			}
			merged
		}
		def artifactFiles = { values, mapped, label -> values.collect { file ->
			if (!file.isFile()) throw new GradleException("non-regular ${label} input: ${file}")
			def canonical = file.canonicalFile
			def item = mapped[canonical]
			if (item == null) throw new GradleException("unmapped ${label} input: ${canonical}")
			[component: item.component, artifact: item.artifact, path: canonical.canonicalPath, sha256: hash(canonical)]
		}.sort { "${it.component}/${it.artifact}" } }
		def exactArtifactFiles = { values, mapped, label ->
			def entries = artifactFiles(values, mapped, label)
			def taskFiles = values.collect { file ->
				if (!file.isFile()) throw new GradleException("non-regular ${label} input: ${file}")
				file.canonicalFile
			}.toSet()
			if (taskFiles != mapped.keySet()) throw new GradleException("${label} task inputs do not exactly match resolved artifacts")
			entries
		}
		def assertDisjoint = { leftLabel, left, rightLabel, right ->
			def overlap = left.keySet().find { right.containsKey(it) }
			if (overlap != null) throw new GradleException("${leftLabel} and ${rightLabel} overlap: ${overlap}")
		}
		def expandedFiles = { directories, pattern -> directories.collectMany { fileTree(it).matching { include pattern }.files }.toSet().toList() }
		def plugin = plugins.getPlugin('com.github.spotbugs')
		def pluginJar = new File(plugin.class.protectionDomain.codeSource.location.toURI())
		def launcher = task.launcher.get().metadata
		if (!JvmVendorSpec.ADOPTIUM.matches(launcher.vendor)) throw new GradleException("spotbugsMain launcher is not Adoptium: ${launcher.vendor}")
		def excludeFilter = task.excludeFilter.get().asFile
		def xmlReport = task.reports.xml.outputLocation.get().asFile
		def htmlReport = task.reports.html.outputLocation.get().asFile
		def engineArtifacts = mergeArtifactMaps('SpotBugs task engine', [
			artifactMap(configurations.spotbugs, 'SpotBugs engine'),
			artifactMap(configurations.spotbugsSlf4j, 'SpotBugs SLF4J provider'),
		])
		def auxiliaryArtifacts = artifactMap(configurations.compileClasspath, 'SpotBugs auxiliary classpath')
		def pluginArtifacts = artifactMap(configurations.spotbugsPlugins, 'SpotBugs external plugins')
		assertDisjoint('SpotBugs engine', engineArtifacts, 'SpotBugs auxiliary classpath', auxiliaryArtifacts)
		assertDisjoint('SpotBugs engine', engineArtifacts, 'SpotBugs external plugins', pluginArtifacts)
		assertDisjoint('SpotBugs auxiliary classpath', auxiliaryArtifacts, 'SpotBugs external plugins', pluginArtifacts)
		def output = spotbugsMainEvidence.get().asFile
		output.parentFile.mkdirs()
		def sourceDirs = task.sourceDirs.files.toList()
		def classDirs = task.classDirs?.files?.toList() ?: []
		if (classDirs.isEmpty()) throw new GradleException('spotbugsMain has no class directories')
		def taskClasses = task.classes
		if (taskClasses == null) throw new GradleException('spotbugsMain classes input is unavailable')
		def compiledClasses = taskClasses.asFileTree.files.toList()
		if (compiledClasses.isEmpty() || compiledClasses.any { !it.isFile() || !it.name.endsWith('.class') } || compiledClasses.any { candidate -> !classDirs.any { directory -> candidate.canonicalPath.startsWith(directory.canonicalPath + File.separator) } }) throw new GradleException('spotbugsMain classes input does not match compiled class directories')
		output.setText(groovy.json.JsonOutput.toJson([schemaVersion: 1, gradle: [version: gradle.gradleVersion], plugin: [id: 'com.github.spotbugs', requestedVersion: '6.2.2', implementationClass: plugin.class.name, implementationPath: pluginJar.canonicalPath, implementationSha256: hash(pluginJar)], engine: [toolVersion: spotbugs.toolVersion.get(), classpath: exactArtifactFiles(task.spotbugsClasspath.files, engineArtifacts, 'SpotBugs engine')], java: [requestedVendor: 'ADOPTIUM', vendorMatchesRequestedSpec: true, vendor: launcher.vendor.toString(), languageVersion: launcher.languageVersion.asInt(), runtimeVersion: launcher.javaRuntimeVersion, jvmVersion: launcher.jvmVersion, installationPath: launcher.installationPath.asFile.canonicalPath, launcherPath: new File(launcher.installationPath.asFile, 'bin/java').canonicalPath, launcherSha256: hash(new File(launcher.installationPath.asFile, 'bin/java'))], task: [name: task.name, path: task.path, declaredType: declaredTaskType.name, runtimeType: task.class.name, runtimeTypeAssignableToDeclared: true, ignoreFailures: task.ignoreFailures, sourceDirs: directoryEntries(sourceDirs), classDirs: directoryEntries(classDirs), sources: fileEntries(expandedFiles(sourceDirs, '**/*.java')), classes: fileEntries(compiledClasses), auxClassPaths: exactArtifactFiles(task.auxClassPaths.files, auxiliaryArtifacts, 'SpotBugs auxiliary classpath'), pluginJarFiles: exactArtifactFiles(task.pluginJarFiles.files, pluginArtifacts, 'SpotBugs external plugins'), excludeFilter: repositoryPath(excludeFilter), xmlOutput: repositoryPath(xmlReport), htmlOutput: repositoryPath(htmlReport)]]) + '\n', 'UTF-8')
	}
}

def contractsBundle = providers.environmentVariable('EASYSUBWAY_CONTRACTS_BUNDLE')

def stageContracts = tasks.register('stageContracts', Exec) {
	inputs.file(layout.projectDirectory.file('tools/stage-contracts.mjs'))
	inputs.file(layout.projectDirectory.file('contracts.lock.json'))
	inputs.file(contractsBundle)
	outputs.dir(layout.buildDirectory.dir('contracts-staging'))

	doFirst {
		def bundle = contractsBundle.orNull
		if (bundle == null || bundle.isBlank()) {
			throw new GradleException('EASYSUBWAY_CONTRACTS_BUNDLE is required')
		}
		commandLine 'node', 'tools/stage-contracts.mjs', '--lock', 'contracts.lock.json', '--input', bundle, '--output', 'build/contracts-staging'
	}
}

def journeyContractsStaging = layout.buildDirectory.dir('journey-contracts-staging')
def journeyContractsStagingMarker = layout.buildDirectory.file('journey-contracts-staging/.stage-complete')
def journeyContractsLock = layout.projectDirectory.file('journey-contracts.lock.json')

tasks.named('processResources') {
	inputs.file(journeyContractsLock)
		.withPropertyName('journeyContractsLock')
		.withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.dir(journeyContractsStaging)
		.withPropertyName('journeyContractsStaging')
		.withPathSensitivity(PathSensitivity.RELATIVE)

	doFirst {
		def lock = new groovy.json.JsonSlurper().parse(journeyContractsLock.asFile)
		def payloadSha256 = lock?.payload?.sha256
		if (!(payloadSha256 instanceof String) || !(payloadSha256 ==~ /[a-f0-9]{64}/)) {
			throw new GradleException('Journey contract lock payload SHA-256 is invalid')
		}
		def marker = journeyContractsStagingMarker.get().asFile
		if (!java.nio.file.Files.isRegularFile(marker.toPath(), java.nio.file.LinkOption.NOFOLLOW_LINKS)
			|| marker.getText('UTF-8') != "${payloadSha256}\n") {
			throw new GradleException('Journey contract staging does not match the lock payload')
		}
	}

	from(stageContracts)
	from(layout.buildDirectory.dir('journey-contracts-staging'))
}

tasks.named('bootJar') {
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}
